<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>myresume — Resume Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#1C2430;
    --paper:#F6F4EE;
    --panel:#FFFFFF;
    --brass:#A8823E;
    --brass-dark:#8A6A2F;
    --slate:#5B6472;
    --line:#E3DFD3;
    --line-soft:#EDEAE1;
    --danger:#B4483B;
    --resume-ink:#1F2532;
    --resume-slate:#5C6472;
    --resume-accent:#1F4E79;
    --resume-line:#D5DAE0;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(168,130,62,0.25);}

  /* ---------- App shell ---------- */
  .app{
    display:grid;
    grid-template-columns: var(--editor-width, 420px) 6px 1fr;
    min-height:100vh;
  }
  @media (max-width: 980px){
    .app{ grid-template-columns: 1fr; }
    .resize-handle{ display:none; }
  }
  .resize-handle{
    cursor:col-resize;
    background:var(--line);
    position:relative;
    transition:background .15s ease;
  }
  .resize-handle:hover, .resize-handle.dragging{ background:var(--brass); }
  .resize-handle::after{
    content:"";
    position:absolute;
    top:0; bottom:0;
    left:-4px; right:-4px;
  }
  body.resizing-panel, body.resizing-panel *{ cursor:col-resize !important; user-select:none; }

  /* ---------- Left: Editor ---------- */
  .editor{
    background:var(--panel);
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-width:0;
  }
  .brand{
    padding:22px 28px 16px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .brand-mark{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-seal{
    width:11px;height:11px;
    background:var(--brass);
    transform:rotate(45deg);
    flex-shrink:0;
    animation:sealFloat 3.5s ease-in-out infinite;
  }
  @keyframes sealFloat{ 0%,100%{ transform:rotate(45deg) translateY(0); } 50%{ transform:rotate(45deg) translateY(-3px); } }
  .brand h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:0.01em;
    margin:0;
  }
  .brand p{
    margin:2px 0 0;
    font-size:11.5px;
    color:var(--slate);
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .brand-actions{
    display:flex;
    gap:8px;
  }
  .icon-btn{
    border:1px solid var(--line);
    background:transparent;
    color:var(--slate);
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    font-weight:600;
    padding:7px 10px;
    border-radius:7px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .icon-btn:hover{ border-color:var(--brass); color:var(--brass-dark); background:rgba(168,130,62,0.06); }
  .icon-btn{ transition:border-color .15s ease, color .15s ease, background .15s ease, transform .1s ease; }
  .icon-btn:active{ transform:scale(0.96); }

  /* Tabs */
  .tabs{
    display:flex;
    gap:2px;
    padding:14px 28px 0;
    border-bottom:1px solid var(--line);
    overflow-x:auto;
    position:relative;
  }
  .tab{
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:600;
    color:var(--slate);
    background:none;
    border:none;
    padding:8px 12px 12px;
    cursor:pointer;
    position:relative;
    white-space:nowrap;
    letter-spacing:0.01em;
    transition:color .18s ease;
  }
  .tab:hover{ color:var(--ink); }
  .tab.active{ color:var(--ink); }
  .tab-dot{
    display:inline-block;
    width:5px; height:5px;
    border-radius:50%;
    background:var(--brass);
    margin-left:5px;
    vertical-align:middle;
  }
  .tab-indicator{
    position:absolute;
    left:0;
    top:auto;
    bottom:-1px;
    height:2px;
    background:var(--brass);
    border-radius:2px;
    transition:transform .28s cubic-bezier(.4,0,.2,1), width .28s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
  }

  .panels{
    flex:1;
    overflow-y:auto;
    padding:22px 28px 100px;
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  .panels::-webkit-scrollbar{ width:8px; }
  .panels::-webkit-scrollbar-track{ background:transparent; }
  .panels::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
  .panels::-webkit-scrollbar-thumb:hover{ background:var(--slate); }
  .panel{ display:none; }
  .panel.active{ display:block; animation:fade .3s cubic-bezier(.16,1,.3,1); }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  @keyframes cardIn{ from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:none;} }
  @keyframes chatIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  .toast-container{
    position:fixed;
    bottom:20px;
    right:20px;
    display:flex;
    flex-direction:column;
    gap:8px;
    z-index:9999;
    pointer-events:none;
  }
  .toast{
    background:var(--ink);
    color:#F6F4EE;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:600;
    padding:11px 16px;
    border-radius:8px;
    box-shadow:0 10px 28px -8px rgba(28,36,48,0.35);
    animation:toastIn .3s cubic-bezier(.16,1,.3,1);
    pointer-events:auto;
  }
  .toast.leaving{ animation:toastOut .22s ease forwards; }
  .toast.success{ background:#2E5C3F; }
  .toast.error{ background:var(--danger); }
  @keyframes toastIn{ from{opacity:0; transform:translateY(12px) scale(.95);} to{opacity:1; transform:none;} }
  @keyframes toastOut{ from{opacity:1; transform:none;} to{opacity:0; transform:translateY(8px) scale(.95);} }

  /* ---------- Askme floating widget ---------- */
  .ai-widget{
    position:fixed;
    /* 90px, not 24px: platforms like Netlify inject their own "powered by"
       badge fixed to the exact bottom-right corner with an unbeatable
       z-index (~2147483645) — this clears it instead of fighting it. */
    bottom:90px;
    right:24px;
    z-index:500;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:14px;
    pointer-events:none;
  }
  .ai-fab{
    width:58px;
    height:58px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    pointer-events:auto;
    background:linear-gradient(135deg, var(--brass) 0%, var(--ink) 130%);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 10px 30px -8px rgba(28,36,48,0.5);
    position:relative;
    transition:transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
  }
  .ai-fab:hover{ transform:scale(1.08); box-shadow:0 14px 36px -8px rgba(28,36,48,0.6); }
  .ai-fab:active{ transform:scale(0.94); }
  .ai-fab-icon{ display:flex; filter:drop-shadow(0 1px 2px rgba(0,0,0,0.25)); }
  .ai-fab-icon svg{ width:26px; height:26px; }

  .ai-panel{
    width:380px;
    max-width:calc(100vw - 48px);
    max-height:min(600px, calc(100vh - 120px));
    background:#fff;
    border-radius:16px;
    box-shadow:0 24px 64px -14px rgba(28,36,48,0.4);
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    opacity:0;
    transform:translateY(16px) scale(.96);
    pointer-events:none;
    transition:opacity .22s ease, transform .22s cubic-bezier(.16,1,.3,1);
    transform-origin:bottom right;
  }
  .ai-panel.open{ opacity:1; transform:none; pointer-events:auto; }
  .ai-panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    background:linear-gradient(135deg, var(--ink) 0%, #2b3547 100%);
    color:#fff;
    flex-shrink:0;
  }
  .ai-panel-header-info{ display:flex; align-items:center; gap:10px; }
  .ai-avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--brass) 0%, #caa25c 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
  }
  .ai-avatar svg{ width:17px; height:17px; }
  .ai-panel-title{ font-size:14px; font-weight:700; line-height:1.3; }
  .ai-panel-status{
    font-size:10.5px;
    color:rgba(255,255,255,0.65);
    display:flex;
    align-items:center;
    gap:5px;
    margin-top:2px;
  }
  .ai-status-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#4ADE80;
    box-shadow:0 0 0 3px rgba(74,222,128,0.2);
  }
  .ai-panel-close{
    background:none;
    border:none;
    color:#fff;
    opacity:.7;
    cursor:pointer;
    font-size:14px;
    padding:4px;
    transition:opacity .15s ease;
  }
  .ai-panel-close:hover{ opacity:1; }
  .ai-panel-body{
    padding:14px 16px;
    overflow-y:auto;
    flex:1;
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  .ai-panel-body::-webkit-scrollbar{ width:8px; }
  .ai-panel-body::-webkit-scrollbar-track{ background:transparent; }
  .ai-panel-body::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }

  /* ---------- ATS score ---------- */
  .ats-score-badge{
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#FEFEFC;
    margin-bottom:14px;
    animation:cardIn .22s cubic-bezier(.16,1,.3,1);
  }
  .ats-score-circle{
    width:64px;
    height:64px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:20px;
    color:#fff;
    transition:background .3s ease;
  }
  .ats-score-title{ font-size:14px; font-weight:700; color:var(--ink); margin-bottom:2px; }
  .ats-score-label{ font-size:11.5px; color:var(--slate); line-height:1.5; }
  .ats-check-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line-soft);
    animation:cardIn .2s cubic-bezier(.16,1,.3,1) backwards;
  }
  .ats-check-row:last-child{ border-bottom:none; }
  .ats-check-icon{
    flex-shrink:0;
    width:19px;
    height:19px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10.5px;
    font-weight:700;
    color:#fff;
    margin-top:1px;
  }
  .ats-check-icon.pass{ background:#2E7D4F; }
  .ats-check-icon.warn{ background:#C08A2E; }
  .ats-check-icon.fail{ background:var(--danger); }
  .ats-check-label{ font-size:12.5px; font-weight:600; color:var(--ink); }
  .ats-check-detail{ font-size:11.5px; color:var(--slate); margin-top:2px; line-height:1.4; }
  .ats-suggestion-list{ margin:8px 0 0; padding-left:18px; }
  .ats-suggestion-list li{ font-size:12.5px; line-height:1.55; margin-bottom:6px; color:var(--ink); }
  .ats-skill-pill{
    display:inline-block;
    background:#fff;
    border:1px solid var(--line);
    color:var(--ink);
    font-size:11.5px;
    font-weight:600;
    padding:5px 11px;
    border-radius:16px;
    margin:0 6px 6px 0;
  }

  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:11px;
    font-weight:600;
    color:var(--slate);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:6px;
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }

  input[type=text], input[type=email], input[type=tel], input[type=url], input[type=month], textarea, select{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:7px;
    padding:9px 11px;
    outline:none;
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  input:focus, textarea:focus, select:focus{
    border-color:var(--brass);
    background:#fff;
    box-shadow:0 0 0 3px rgba(168,130,62,0.12);
  }
  textarea{ resize:vertical; min-height:70px; line-height:1.5; }
  select{ appearance:none; background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="%235B6472"><path d="M5.5 7.5l4.5 4.5 4.5-4.5"/></svg>'); background-repeat:no-repeat; background-position:right 10px center; background-size:14px; padding-right:30px; }

  .card{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 16px 6px;
    margin-bottom:14px;
    background:#FEFEFC;
    position:relative;
    transition:box-shadow .18s ease, border-color .18s ease;
    animation:cardIn .22s cubic-bezier(.16,1,.3,1) backwards;
  }
  .card:hover{ border-color:var(--brass); box-shadow:0 2px 12px -4px rgba(28,36,48,0.12); }
  .card-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
  }
  .card-head span{
    font-size:11px;
    font-weight:700;
    color:var(--brass-dark);
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  .remove-btn{
    border:none;
    background:none;
    color:var(--slate);
    cursor:pointer;
    font-size:12px;
    font-weight:600;
    padding:4px 6px;
    border-radius:5px;
    transition:color .15s ease, background .15s ease;
  }
  .remove-btn:hover{ color:var(--danger); background:rgba(180,72,59,0.08); }

  .bullets{ margin:8px 0 4px; }
  .bullet-row{ display:flex; gap:8px; margin-bottom:8px; align-items:flex-start; }
  .bullet-row input{ flex:1; }
  .bullet-row button{ flex-shrink:0; }

  .add-btn{
    width:100%;
    border:1px dashed var(--line);
    background:none;
    color:var(--slate);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
    margin-top:2px;
    margin-bottom:18px;
    transition:border-color .15s ease, color .15s ease, background .15s ease, transform .1s ease;
  }
  .add-btn:hover{ border-color:var(--brass); color:var(--brass-dark); }
  .add-btn:active{ transform:scale(0.98); }
  .add-btn.small{ margin-bottom:8px; padding:7px; font-size:12px; }

  .chip-input-wrap{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    border:1px solid var(--line);
    border-radius:7px;
    padding:9px;
    background:var(--paper);
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#fff;
    border:1px solid var(--line);
    color:var(--ink);
    font-size:12.5px;
    font-weight:500;
    padding:5px 6px 5px 10px;
    border-radius:16px;
  }
  .chip{ animation:cardIn .18s cubic-bezier(.16,1,.3,1); }
  .chip button{
    border:none; background:var(--line-soft); color:var(--slate);
    width:16px;height:16px;border-radius:50%;
    cursor:pointer; font-size:10px; line-height:1; display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, color .15s ease;
  }
  .chip button:hover{ background:var(--danger); color:#fff; }
  .chip-input-wrap input{
    border:none; background:none; flex:1; min-width:120px; padding:5px;
  }
  .hint{ font-size:11px; color:var(--slate); margin-top:6px; }

  .chat-box{
    max-height:360px;
    overflow-y:auto;
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px;
    margin:14px 0;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .chat-msg{ display:flex; align-items:flex-end; gap:7px; animation:chatIn .22s cubic-bezier(.16,1,.3,1); }
  .chat-msg.user{ justify-content:flex-end; }
  .chat-msg.assistant{ justify-content:flex-start; }
  .chat-avatar{
    width:24px;
    height:24px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    flex-shrink:0;
    margin-bottom:1px;
  }
  .chat-avatar svg{ width:13px; height:13px; }
  .chat-avatar.bot{ background:linear-gradient(135deg, var(--brass) 0%, #caa25c 100%); color:#fff; }
  .chat-avatar.user{ background:var(--ink); color:#fff; font-weight:700; }
  .chat-bubble{
    max-width:74%;
    padding:10px 14px;
    border-radius:16px;
    font-size:13px;
    line-height:1.5;
    white-space:pre-wrap;
    transition:transform .12s ease;
  }
  .chat-msg.user .chat-bubble{ background:linear-gradient(135deg, var(--ink) 0%, #2b3547 100%); color:#fff; border-bottom-right-radius:4px; }
  .chat-msg.assistant .chat-bubble{ background:#F1EEE5; color:var(--ink); border-bottom-left-radius:4px; }
  .chat-typing{ display:flex; align-items:center; gap:4px; padding:13px 16px !important; }
  .chat-typing span{ width:6px; height:6px; border-radius:50%; background:var(--slate); animation:typingBounce 1.2s ease-in-out infinite; }
  .chat-typing span:nth-child(2){ animation-delay:.15s; }
  .chat-typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes typingBounce{ 0%,60%,100%{ transform:translateY(0); opacity:.5; } 30%{ transform:translateY(-4px); opacity:1; } }
  .chat-input-row{
    display:flex;
    align-items:flex-end;
    gap:6px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:22px;
    padding:5px 5px 5px 15px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .chat-input-row:focus-within{ border-color:var(--brass); box-shadow:0 0 0 3px rgba(168,130,62,0.12); }
  .chat-input-row textarea{
    flex:1;
    border:none !important;
    background:none !important;
    box-shadow:none !important;
    min-height:22px;
    max-height:90px;
    padding:8px 0;
  }
  .chat-send-btn{
    width:34px;
    height:34px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg, var(--brass) 0%, var(--ink) 130%);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), opacity .15s ease;
  }
  .chat-send-btn svg{ width:15px; height:15px; margin-left:-1px; }
  .chat-send-btn:hover:not(:disabled){ transform:scale(1.08); }
  .chat-send-btn:active:not(:disabled){ transform:scale(0.92); }
  .chat-send-btn:disabled{ opacity:.35; cursor:default; }
  .chat-box::-webkit-scrollbar{ width:8px; }
  .chat-box::-webkit-scrollbar-track{ background:transparent; }
  .chat-box::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
  .chat-box::-webkit-scrollbar-thumb:hover{ background:var(--slate); }

  .preset-pills{ display:flex; flex-wrap:wrap; gap:7px; }
  .preset-pill{
    border:1px dashed var(--line);
    background:#fff;
    color:var(--slate);
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    font-weight:600;
    padding:6px 11px;
    border-radius:16px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease, transform .1s ease;
  }
  .preset-pill:hover{ border-color:var(--brass); color:var(--brass-dark); background:rgba(168,130,62,0.06); }
  .preset-pill:active{ transform:scale(0.96); }

  /* ---------- Right: Preview ---------- */
  .preview-pane{
    background:#EDEAE0;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 24px 60px;
    min-height:100vh;
  }
  .preview-bar{
    width:100%;
    max-width:816px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
  }
  .preview-bar-label{
    font-size:11.5px;
    color:var(--slate);
    letter-spacing:0.04em;
    text-transform:uppercase;
    font-weight:600;
  }
  .preview-bar-actions{
    display:flex;
    align-items:center;
    gap:10px;
    position:fixed;
    top:8px;
    right:24px;
    z-index:400;
  }
  .download-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--ink);
    color:#F6F4EE;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:13px;
    line-height:1;
    height:39px;
    padding:0 18px;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
    position:relative;
    overflow:hidden;
    isolation:isolate;
  }
  .download-btn::before{
    content:"";
    position:absolute;
    top:0; left:-60%;
    width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.22), transparent);
    transform:skewX(-20deg);
    animation:btnShimmer 3.2s ease-in-out infinite;
    z-index:-1;
  }
  @keyframes btnShimmer{ 0%{ left:-60%; } 35%,100%{ left:130%; } }
  .download-btn:hover{ background:var(--brass-dark); }
  .download-btn:active{ transform:scale(0.98); }
  .download-btn:disabled{ opacity:0.6; cursor:progress; }

  .export-wrap{ position:relative; }
  .export-menu{
    position:absolute;
    top:calc(100% + 6px);
    right:0;
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    box-shadow:0 10px 28px -10px rgba(28,36,48,0.3);
    min-width:170px;
    padding:6px;
    z-index:20;
    opacity:0;
    transform:translateY(-6px) scale(.98);
    pointer-events:none;
    transition:opacity .16s ease, transform .16s cubic-bezier(.16,1,.3,1);
  }
  .export-menu.show{ opacity:1; transform:none; pointer-events:auto; }
  .export-menu button:not(.download-btn){
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:9px 10px;
    border-radius:6px;
    transition:background .12s ease;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
  }
  .export-menu button:not(.download-btn):hover{ background:var(--paper); }

  .import-menu{
    width:380px;
    max-width:calc(100vw - 48px);
    max-height:70vh;
    overflow-y:auto;
    padding:16px;
  }

  .page-scaler{
    width:100%;
    max-width:816px;
    overflow:visible;
  }
  #resume-page{
    --r-scale: 1;
    width:816px;
    min-height:1056px;
    background:#fff;
    box-shadow:0 1px 3px rgba(28,36,48,0.08), 0 18px 40px -12px rgba(28,36,48,0.28);
    padding:58px 64px 70px;
    transform-origin:top left;
    font-family:'Inter',sans-serif;
    color:var(--resume-ink);
  }

  /* Resume content styles (prefixed r-). Font sizes and vertical spacing are
     driven by --r-scale (set by fitResumeToPage) so a long resume shrinks to
     fit a single page while the page padding above — the margin on every
     side — stays fixed. */
  .r-header{ margin-bottom:calc(16px * var(--r-scale)); }
  .r-name{
    font-size:calc(21px * var(--r-scale));
    font-weight:700;
    letter-spacing:0;
    margin:0 0 calc(3px * var(--r-scale));
    color:var(--resume-ink);
  }
  .r-title{
    font-size:calc(12px * var(--r-scale));
    font-weight:500;
    font-style:italic;
    color:var(--resume-slate);
    margin:0 0 calc(9px * var(--r-scale));
  }
  .r-contact{
    font-size:calc(11px * var(--r-scale));
    color:var(--resume-ink);
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:0;
  }
  .r-contact span{ display:inline-flex; align-items:center; gap:4px; }
  .r-contact span:not(:last-child)::after{
    content:"|";
    margin:0 8px;
    color:var(--resume-line);
  }
  .r-contact a{ color:var(--resume-ink); text-decoration:none; }
  .r-contact a:hover{ text-decoration:underline; }
  .r-summary{
    font-size:calc(12px * var(--r-scale));
    line-height:1.6;
    color:var(--resume-ink);
  }

  .r-section{ margin-top:calc(20px * var(--r-scale)); }
  .r-section-title{
    font-size:calc(13px * var(--r-scale));
    font-weight:700;
    letter-spacing:0;
    color:var(--resume-accent);
    padding-bottom:calc(4px * var(--r-scale));
    border-bottom:1px solid var(--resume-line);
    margin-bottom:calc(8px * var(--r-scale));
    break-after:avoid-page;
  }
  .r-entry{ margin-top:calc(11px * var(--r-scale)); break-inside:avoid-page; }
  .r-entry-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
  }
  .r-entry-role{ font-size:calc(12.5px * var(--r-scale)); font-weight:700; color:var(--resume-ink); }
  .r-entry-org{ font-weight:500; color:var(--resume-slate); }
  .r-entry-dates{
    font-size:calc(11px * var(--r-scale));
    color:var(--resume-slate);
    font-style:italic;
    white-space:nowrap;
    flex-shrink:0;
  }
  .r-entry-loc{ font-size:calc(11px * var(--r-scale)); color:var(--resume-slate); margin-top:1px; }
  .r-entry ul{
    margin:calc(5px * var(--r-scale)) 0 0;
    padding-left:0;
    list-style:none;
  }
  .r-entry ul li{
    position:relative;
    padding-left:14px;
    font-size:calc(11.5px * var(--r-scale));
    line-height:1.55;
    margin-bottom:calc(3px * var(--r-scale));
    color:var(--resume-ink);
  }
  .r-entry ul li::before{ content:"•"; position:absolute; left:0; color:var(--resume-accent); }
  .r-skills-list{
    margin:calc(6px * var(--r-scale)) 0 0;
    padding-left:0;
    list-style:none;
  }
  .r-skills-list li{
    position:relative;
    padding-left:14px;
    font-size:calc(11.5px * var(--r-scale));
    line-height:1.6;
    margin-bottom:calc(4px * var(--r-scale));
    color:var(--resume-ink);
    break-inside:avoid-page;
  }
  .r-skills-list li::before{ content:"•"; position:absolute; left:0; color:var(--resume-accent); }
  .r-empty{
    color:#B7BAC2;
    font-style:italic;
  }

  @media print{
    /* Margin lives on @page so it repeats on every printed page (matching
       the on-screen 58/64/70px padding) instead of only once around the
       whole flow — that's what kept a second page from getting the same
       side margins as the first.
       The editor panel is removed with display:none (not visibility:hidden)
       so it's taken out of layout entirely — visibility:hidden keeps its
       box's height reserved, which was silently padding out extra blank
       pages after the resume. */
    @page{ size: A4 portrait; margin: 15.3mm 16.9mm 18.5mm; }
    html, body{ background:#fff !important; }
    .editor{ display:none !important; }
    .resize-handle{ display:none !important; }
    .preview-bar{ display:none !important; }
    .preview-pane{ padding:0; min-height:0; background:#fff; display:block; }
    .page-scaler{ width:auto; height:auto !important; }
    #resume-page{
      width:100%; min-height:0;
      padding:0;
      box-shadow:none;
      transform:none !important;
    }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ============ EDITOR ============ -->
  <div class="editor">
    <div class="brand">
      <div class="brand-mark">
        <div class="brand-seal"></div>
        <div>
          <h1>myresume</h1>
          <p>A resume building service</p>
        </div>
      </div>
      <div class="brand-actions">
        <button class="icon-btn" onclick="loadSample()">Load sample</button>
        <button class="icon-btn" onclick="clearAll()">Clear all</button>
      </div>
    </div>

    <div class="tabs" id="tabs"></div>
    <div class="panels" id="panels"></div>
  </div>

  <div class="resize-handle" id="resizeHandle"></div>

  <!-- ============ PREVIEW ============ -->
  <div class="preview-pane">
    <div class="preview-bar">
      <span class="preview-bar-label">Live preview</span>
      <div class="preview-bar-actions">
        <div class="export-wrap">
          <button class="download-btn" id="importBtn" onclick="toggleImportMenu(event)">
            ⬆ Import ▾
          </button>
          <div class="export-menu import-menu" id="importMenu"></div>
        </div>
        <div class="export-wrap">
          <button class="download-btn" id="atsBtn" onclick="toggleAtsMenu(event)">
            📊 ATS Score ▾
          </button>
          <div class="export-menu import-menu" id="atsMenu"></div>
        </div>
        <div class="export-wrap">
          <button class="download-btn" id="exportBtn" onclick="toggleExportMenu(event)">
            ⬇ Export ▾
          </button>
          <div class="export-menu" id="exportMenu">
            <button onclick="exportAs('pdf')">PDF document (with clickable links)</button>
            <button onclick="exportAs('png')">PNG image (no links — images can't carry them)</button>
          </div>
        </div>
      </div>
    </div>
    <div class="page-scaler" id="pageScaler">
      <div id="resume-page"><div id="resume-inner"></div></div>
    </div>
  </div>

</div>

<!-- ============ ASK AI (floating widget) ============ -->
<div class="ai-widget">
  <div class="ai-panel" id="aiPanel">
    <div class="ai-panel-header">
      <div class="ai-panel-header-info">
        <span class="ai-avatar" id="aiAvatarIcon"></span>
        <div>
          <div class="ai-panel-title">Askme</div>
          <div class="ai-panel-status"><span class="ai-status-dot"></span>Online</div>
        </div>
      </div>
      <button class="ai-panel-close" onclick="toggleAiWidget()">✕</button>
    </div>
    <div class="ai-panel-body" id="aiPanelBody"></div>
  </div>
  <button class="ai-fab" id="aiFab" onclick="toggleAiWidget()">
    <span class="ai-fab-icon" id="aiFabIcon"></span>
  </button>
</div>

<script>
/* ================= STATE ================= */
let uid = 1;
const nextId = () => 'id' + (uid++);

let state = {
  personal: { fullName:'', title:'', email:'', phone:'', location:'', summary:'' },
  links: [],
  experience: [],
  education: [],
  certifications: [],
  awards: [],
  skills: [],
  projects: [],
  importText: ''
};

const LINK_TYPES = ['LinkedIn','GitHub','Portfolio','Twitter / X','Behance','Dribbble','Website','Other'];

/* ================= TABS ================= */
const TABS = [
  { key:'personal', label:'Personal' },
  { key:'links', label:'Links' },
  { key:'experience', label:'Experience' },
  { key:'education', label:'Education' },
  { key:'certifications', label:'Certifications' },
  { key:'awards', label:'Awards' },
  { key:'skills', label:'Skills' },
  { key:'projects', label:'Projects' },
];
let activeTab = 'personal';

function tabHasContent(key){
  switch(key){
    case 'personal': return !!(state.personal.fullName || state.personal.title || state.personal.summary);
    case 'links': return state.links.some(l => l.url);
    case 'experience': return state.experience.length > 0;
    case 'education': return state.education.length > 0;
    case 'certifications': return state.certifications.length > 0;
    case 'awards': return state.awards.length > 0;
    case 'skills': return state.skills.some(c => c.items.length);
    case 'projects': return state.projects.length > 0;
    default: return false;
  }
}
function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = TABS.map(t => `
    <button class="tab ${t.key===activeTab?'active':''}" onclick="setTab('${t.key}')">${t.label}${tabHasContent(t.key) ? '<span class="tab-dot"></span>' : ''}</button>
  `).join('') + '<span class="tab-indicator" id="tabIndicator"></span>';
  positionTabIndicator();
}
function positionTabIndicator(){
  const tabs = document.getElementById('tabs');
  const indicator = document.getElementById('tabIndicator');
  const active = tabs.querySelector('.tab.active');
  if(!active || !indicator) return;
  indicator.style.width = (active.offsetWidth - 20) + 'px';
  indicator.style.transform = `translateX(${active.offsetLeft + 10}px)`;
}
window.addEventListener('resize', positionTabIndicator);
function setTab(key){
  activeTab = key;
  renderTabs();
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + key));
}

/* ================= PANEL RENDERERS ================= */
function renderPanels(){
  const el = document.getElementById('panels');
  el.innerHTML = `
    ${panelPersonal()}
    ${panelLinks()}
    ${panelExperience()}
    ${panelEducation()}
    ${panelCertifications()}
    ${panelAwards()}
    ${panelSkills()}
    ${panelProjects()}
  `;
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + activeTab));
}

function panelPersonal(){
  const p = state.personal;
  return `
  <div class="panel" id="panel-personal">
    <div class="field"><label>Full name</label>
      <input type="text" value="${esc(p.fullName)}" oninput="updatePersonal('fullName', this.value)" placeholder="Jordan Rivera" />
    </div>
    <div class="field"><label>Title / role</label>
      <input type="text" value="${esc(p.title)}" oninput="updatePersonal('title', this.value)" placeholder="Product Designer" />
    </div>
    <div class="row2">
      <div class="field"><label>Email</label>
        <input type="email" value="${esc(p.email)}" oninput="updatePersonal('email', this.value)" placeholder="jordan@email.com" />
      </div>
      <div class="field"><label>Phone</label>
        <input type="tel" value="${esc(p.phone)}" oninput="updatePersonal('phone', this.value)" placeholder="+91 90000 00000" />
      </div>
    </div>
    <div class="field"><label>Location</label>
      <input type="text" value="${esc(p.location)}" oninput="updatePersonal('location', this.value)" placeholder="Bengaluru, India" />
    </div>
    <div class="field"><label>Summary</label>
      <textarea oninput="updatePersonal('summary', this.value)" placeholder="A short 2–3 line pitch about you.">${esc(p.summary)}</textarea>
      <p class="hint">Wrap text in **double asterisks** to bold it on the resume, e.g. **6 years of experience**.</p>
    </div>
  </div>`;
}

function renderImportPanel(){
  const el = document.getElementById('importMenu');
  if(!el) return;
  el.innerHTML = `
    <p class="hint" style="margin-top:0;">Upload an existing resume and myresume will scan it section by section and auto-fill Personal, Links, Summary, Experience, Education, Skills, Certifications, Awards, and Projects — review each tab afterward.</p>
    <div class="field">
      <label>Upload a resume file</label>
      <input type="file" accept=".txt,.md,text/plain,.pdf,application/pdf,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" onchange="handleImportFile(event)" />
      <p class="hint" id="importStatus">Supports .pdf, .docx, and .txt/.md files. Old .doc files and images aren't auto-read — open those and paste the text below instead.</p>
    </div>
    <div class="field">
      <label>Or paste resume text</label>
      <textarea id="importTextarea" style="min-height:160px;" placeholder="Paste the full resume text here...">${esc(state.importText)}</textarea>
    </div>
    <button class="download-btn" style="width:100%;justify-content:center;height:auto;padding:11px 18px;" onclick="runImport()">↥ Import &amp; auto-fill</button>
    ${state.importText ? `<p class="hint">Already imported once — importing again will add any newly found entries without duplicating ones already on your resume.</p>` : ''}
  `;
}

function panelLinks(){
  return `
  <div class="panel" id="panel-links">
    ${state.links.map((l, i) => `
      <div class="card" style="animation-delay:${Math.min(i * 40, 200)}ms">
        <div class="card-head">
          <span>Link</span>
          <button class="remove-btn" onclick="removeItem('links','${l.id}')">Remove</button>
        </div>
        <div class="row2">
          <div class="field"><label>Type</label>
            <select onchange="updateListField('links','${l.id}','type', this.value)">
              ${LINK_TYPES.map(t => `<option value="${t}" ${t===l.type?'selected':''}>${t}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Label (shown on resume)</label>
            <input type="text" value="${esc(l.label)}" oninput="updateListField('links','${l.id}','label', this.value)" placeholder="e.g. linkedin.com/in/jordan" />
          </div>
        </div>
        <div class="field"><label>URL</label>
          <input type="url" value="${esc(l.url)}" oninput="updateListField('links','${l.id}','url', this.value)" placeholder="https://..." />
        </div>
      </div>
    `).join('')}
    <button class="add-btn" onclick="addLink()">+ Add a link</button>
    <p class="hint">Add as many as you need — LinkedIn, GitHub, portfolio, X/Twitter, or any custom URL.</p>
  </div>`;
}

function panelExperience(){
  return `
  <div class="panel" id="panel-experience">
    ${state.experience.map((x, i) => `
      <div class="card" style="animation-delay:${Math.min(i * 40, 200)}ms">
        <div class="card-head">
          <span>Experience</span>
          <button class="remove-btn" onclick="removeItem('experience','${x.id}')">Remove</button>
        </div>
        <div class="row2">
          <div class="field"><label>Role</label>
            <input type="text" value="${esc(x.role)}" oninput="updateListField('experience','${x.id}','role', this.value)" placeholder="Senior Designer" />
          </div>
          <div class="field"><label>Company</label>
            <input type="text" value="${esc(x.company)}" oninput="updateListField('experience','${x.id}','company', this.value)" placeholder="Acme Co." />
          </div>
        </div>
        <div class="row3">
          <div class="field"><label>Location</label>
            <input type="text" value="${esc(x.location)}" oninput="updateListField('experience','${x.id}','location', this.value)" placeholder="Remote" />
          </div>
          <div class="field"><label>Start</label>
            <input type="text" value="${esc(x.start)}" oninput="updateListField('experience','${x.id}','start', this.value)" placeholder="Jan 2022" />
          </div>
          <div class="field"><label>End</label>
            <input type="text" value="${esc(x.end)}" oninput="updateListField('experience','${x.id}','end', this.value)" placeholder="Present" />
          </div>
        </div>
        <div class="field"><label>Link (optional)</label>
          <input type="url" value="${esc(x.url)}" oninput="updateListField('experience','${x.id}','url', this.value)" placeholder="https://... (certificate, offer letter, company page, etc.)" />
        </div>
        <div class="bullets">
          <label style="display:block;font-size:11px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;">Highlights</label>
          ${x.bullets.map((b,i) => `
            <div class="bullet-row">
              <input type="text" value="${esc(b)}" oninput="updateBullet('${x.id}', ${i}, this.value)" placeholder="Led a redesign that improved conversion by 18%" />
              <button class="remove-btn" onclick="removeBullet('${x.id}', ${i})">✕</button>
            </div>
          `).join('')}
          <button class="add-btn small" onclick="addBullet('${x.id}')">+ Add highlight</button>
          <p class="hint" style="margin-top:-4px;">Wrap text in **double asterisks** to bold it, e.g. **improved conversion by 18%**.</p>
        </div>
      </div>
    `).join('')}
    <button class="add-btn" onclick="addExperience()">+ Add experience</button>
  </div>`;
}

function panelEducation(){
  return `
  <div class="panel" id="panel-education">
    ${state.education.map((e, i) => `
      <div class="card" style="animation-delay:${Math.min(i * 40, 200)}ms">
        <div class="card-head">
          <span>Education</span>
          <button class="remove-btn" onclick="removeItem('education','${e.id}')">Remove</button>
        </div>
        <div class="field"><label>School</label>
          <input type="text" value="${esc(e.school)}" oninput="updateListField('education','${e.id}','school', this.value)" placeholder="State University" />
        </div>
        <div class="field"><label>Degree</label>
          <input type="text" value="${esc(e.degree)}" oninput="updateListField('education','${e.id}','degree', this.value)" placeholder="B.A. in Design" />
        </div>
        <div class="row3">
          <div class="field"><label>Location</label>
            <input type="text" value="${esc(e.location)}" oninput="updateListField('education','${e.id}','location', this.value)" placeholder="City" />
          </div>
          <div class="field"><label>Start</label>
            <input type="text" value="${esc(e.start)}" oninput="updateListField('education','${e.id}','start', this.value)" placeholder="2016" />
          </div>
          <div class="field"><label>End</label>
            <input type="text" value="${esc(e.end)}" oninput="updateListField('education','${e.id}','end', this.value)" placeholder="2020" />
          </div>
        </div>
        <div class="field"><label>Link (optional)</label>
          <input type="url" value="${esc(e.url)}" oninput="updateListField('education','${e.id}','url', this.value)" placeholder="https://... (degree certificate, transcript, etc.)" />
        </div>
      </div>
    `).join('')}
    <button class="add-btn" onclick="addEducation()">+ Add education</button>
  </div>`;
}

function panelCertifications(){
  return `
  <div class="panel" id="panel-certifications">
    ${state.certifications.map((c, i) => `
      <div class="card" style="animation-delay:${Math.min(i * 40, 200)}ms">
        <div class="card-head">
          <span>Certification</span>
          <button class="remove-btn" onclick="removeItem('certifications','${c.id}')">Remove</button>
        </div>
        <div class="row2">
          <div class="field"><label>Name</label>
            <input type="text" value="${esc(c.name)}" oninput="updateListField('certifications','${c.id}','name', this.value)" placeholder="AWS Certified Solutions Architect" />
          </div>
          <div class="field"><label>Issuer</label>
            <input type="text" value="${esc(c.issuer)}" oninput="updateListField('certifications','${c.id}','issuer', this.value)" placeholder="Amazon Web Services" />
          </div>
        </div>
        <div class="row2">
          <div class="field"><label>Date</label>

/* PDF.js hands back an unordered bag of text fragments with x/y coordinates —
   it does NOT give you line breaks. Reconstruct real lines by grouping
   fragments that share a y-position, then mark a big horizontal jump (e.g. a
   right-aligned date or location next to a left-aligned title) with a column
   separator so downstream parsing can tell the two columns apart.
   linkAnnots (optional): PDF link annotations for this page, each with a
   .url and .rect [x1,y1,x2,y2]. Each is matched to the row it visually sits
   on (by y-position) and injected there, tagged with IMPORT_ANNOT_LINK_MARKER,
   so a "Certificate" hyperlink lands in the exact line it belongs to (e.g.
   next to a specific job) instead of a page-level dump with no context. */
function pdfItemsToText(items, linkAnnots){
  if(!items.length) return '';
  const rows = [];
  items.forEach(it => {
    if(!it.str || !it.str.trim()) return;
    const y = Math.round(it.transform[5]);
    let row = rows.find(r => Math.abs(r.y - y) <= 2.5);
    if(!row){ row = { y, frags: [] }; rows.push(row); }
    row.frags.push({ x: it.transform[4], str: it.str, width: it.width || (it.str.length * (it.transform[0] || 5) * 0.5) });
  });
  (linkAnnots || []).forEach(a => {
    if(!a.url || !a.rect) return;
    const [x1, y1, x2, y2] = a.rect;
    const centerY = Math.round((y1 + y2) / 2);
    let row = rows.find(r => Math.abs(r.y - centerY) <= 6);
    if(!row){ row = { y: centerY, frags: [] }; rows.push(row); }
    row.frags.push({ x: x2, str: IMPORT_ANNOT_LINK_MARKER + a.url, width: 0 });
  });
  rows.sort((a,b) => b.y - a.y); // pdf y grows upward; read top -> bottom
  return rows.map(row => {
    row.frags.sort((a,b) => a.x - b.x);
    let line = '';
    let lastEndX = null;
    row.frags.forEach(f => {
      if(lastEndX !== null){
        const gap = f.x - lastEndX;
        line += gap > 28 ? '   |   ' : (gap > 1.5 ? ' ' : '');
      }
      line += f.str;
      lastEndX = f.x + f.width;
    });
    return line.trim();
  }).filter(Boolean).join('\n');
}

function extractPdfText(file){
  return new Promise((resolve, reject) => {
    if(typeof pdfjsLib === 'undefined'){ reject(new Error('PDF reader unavailable')); return; }
    const reader = new FileReader();
    reader.onload = async () => {
      try{
        const typedArray = new Uint8Array(reader.result);
        const pdf = await pdfjsLib.getDocument({ data: typedArray }).promise;
        let fullText = '';
        for(let i = 1; i <= pdf.numPages; i++){
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          let linkAnnots = [];
          try{
            const annots = await page.getAnnotations();
            linkAnnots = annots.filter(a => a.url && a.rect);
          } catch(annotErr){ /* link annotations are a bonus, not required */ }
          fullText += pdfItemsToText(content.items, linkAnnots) + '\n\n';
        }
        resolve(fullText.trim());
      } catch(err){ reject(err); }
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsArrayBuffer(file);
  });
}

function extractDocxText(file){
  return new Promise((resolve, reject) => {
    if(typeof mammoth === 'undefined'){ reject(new Error('Word reader unavailable')); return; }
    const reader = new FileReader();
    reader.onload = () => {
      mammoth.extractRawText({ arrayBuffer: reader.result })
        .then(result => resolve(result.value))
        .catch(reject);
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsArrayBuffer(file);
  });
}

async function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const ta = document.getElementById('importTextarea');
  const name = file.name.toLowerCase();

  try{
    let text;
    if(name.endsWith('.pdf') || file.type === 'application/pdf'){
      setImportStatus('Reading PDF…');
      text = await extractPdfText(file);
    } else if(name.endsWith('.docx') || file.type.includes('wordprocessingml')){
      setImportStatus('Reading Word document…');
      text = await extractDocxText(file);
    } else if(name.endsWith('.doc')){
      setImportStatus('Old .doc files can\'t be auto-read — open it, select all, copy, and paste the text below.', true);
      return;
    } else {
      setImportStatus('Reading file…');
      text = await file.text();
    }

    if(!text || !text.trim()){
      setImportStatus('No readable text found in that file — try pasting the text below instead.', true);
      return;
    }

    if(ta) ta.value = text;
    state.importText = text;
    setImportStatus('Text extracted ✓ — review it below, then click "Import & auto-fill."');
  } catch(err){
    console.error(err);
    setImportStatus('Could not read that file automatically — open it, select all, copy, and paste the text below instead.', true);
  }
}
/* ---- Section header recognizers ---- */
const IMPORT_SECTION_DEFS = [
  { key:'summary', patterns:[/^(professional\s+|career\s+)?summary$/i, /^objective$/i, /^profile$/i, /^about(\s+me)?$/i, /^personal\s+statement$/i] },
  { key:'experience', patterns:[/^(work\s+|professional\s+|relevant\s+)?experience$/i, /^employment(\s+history)?$/i, /^work\s+history$/i, /^career\s+history$/i, /^leadership(\s*(&|and)\s*organi[sz]ational(\s+experience)?)?$/i, /^extracurricular(\s+activities)?$/i, /^activities$/i, /^organi[sz]ations?(\s+(&|and)\s+leadership)?$/i, /^volunteer(ing)?(\s+experience)?$/i] },
  { key:'education', patterns:[/^education(al\s+background)?$/i, /^academic\s+background$/i, /^academic\s+qualifications?$/i] },
  { key:'skills', patterns:[/^(technical\s+|core\s+|key\s+)?skills$/i, /^skills\s*(&|and)\s*(tools|technologies)$/i, /^core\s+competencies$/i, /^technologies$/i, /^technical\s+proficienc(y|ies)$/i] },
  { key:'certifications', patterns:[/^certifications?$/i, /^certificates?$/i, /^licenses?(\s*(&|and)\s*certifications?)?$/i] },
  { key:'awards', patterns:[/^awards?(\s*(&|and)\s*honou?rs?)?$/i, /^honou?rs?$/i, /^achievements?$/i, /^accomplishments?$/i] },
  { key:'projects', patterns:[
    /^(personal\s+|academic\s+|key\s+)?projects?$/i,
    /^(research\s*(&|and)\s*)?projects?$/i,
    /^projects?\s*(&|and)\s*research$/i,
    /^research$/i,
    /^(cybersecurity\s*(&|and)?\s*)?hackathons?(\s+achievements?)?$/i,
    /^hackathon\s+achievements?$/i,
  ] },
];
function matchImportSection(line){
  const clean = line.trim().replace(/[:：]\s*$/,'');
  if(!clean || clean.length > 45) return null;
  for(const def of IMPORT_SECTION_DEFS){
    if(def.patterns.some(p => p.test(clean))) return def.key;
  }
  // Loose fallback: real resumes use all kinds of heading phrasing we won't
  // have an exact pattern for ("Cybersecurity & Hackathon Achievements",
  // "Research & Projects", etc). Only fire this on lines that are actually
  // shaped like a heading — short, no parenthetical, no embedded date, no
  // dash-separated subtitle, not a bullet — so real content lines that
  // happen to contain a trigger word (e.g. "NCSRC Hackathon (July 2025)",
  // an actual entry, not a heading) don't get mistaken for one.
  const looksLikeHeading = clean.length <= 40
    && clean.split(/\s+/).length <= 6
    && /^[A-Z0-9]/.test(clean)
    && !IMPORT_BULLET_RE.test(clean)
    && !/[()]/.test(clean)
    && !/\s[–—-]\s/.test(clean)
    && !importExtractDate(clean);
  if(looksLikeHeading){
    if(/\bhackathons?\b/i.test(clean)) return 'projects';
    if(/\bresearch\b/i.test(clean) && /\bproject/i.test(clean)) return 'projects';
    if(/\bproject(s)?\b/i.test(clean)) return 'projects';
    if(/\bleadership\b/i.test(clean) || /\borgani[sz]ation/i.test(clean) || /\bexperience\b/i.test(clean)) return 'experience';
    if(/\bskills?\b/i.test(clean) || /\btechnical\b/i.test(clean) || /\bcompetenc/i.test(clean)) return 'skills';
    if(/\bcertificat/i.test(clean) || /\blicense/i.test(clean)) return 'certifications';
    if(/\baward|\bhonou?r|\bachievement/i.test(clean)) return 'awards';
    if(/\beducation|\bacademic/i.test(clean)) return 'education';
    if(/\bsummary\b|\bobjective\b|\bprofile\b|^about\b/i.test(clean)) return 'summary';
  }
  return null;
}
/* Sentinel used to tag URLs pulled from PDF link annotations (see
   extractPdfText) so they're never confused with a URL the person actually
   typed under an entry in the resume text itself. */
const IMPORT_ANNOT_LINK_MARKER = '\u0000ANNOTLINK\u0000';
function isInjectedAnnotationLink(line){
  return line.includes(IMPORT_ANNOT_LINK_MARKER);
}
/* Finds a marker-tagged URL anywhere within a line (it may sit alongside
   real text, e.g. "Data Analyst Intern [MARKER]https://... New Delhi"),
   extracts it, and returns the line with the marker+URL cleanly removed so
   it doesn't clutter the role/title/bullet text it was embedded next to. */
function extractMarkedUrl(str){
  if(!str || !str.includes(IMPORT_ANNOT_LINK_MARKER)) return { clean: str, url: '' };
  const idx = str.indexOf(IMPORT_ANNOT_LINK_MARKER);
  const before = str.slice(0, idx);
  const after = str.slice(idx + IMPORT_ANNOT_LINK_MARKER.length);
  const m = after.match(/^\S+/);
  const url = m ? m[0] : '';
  const clean = (before + after.slice(url.length)).replace(/\s{2,}/g, ' ').trim();
  return { clean, url };
}
/* Lines that are nothing but a bare URL are usually a genuine proof link the
   person pasted under an entry, but can also be a plain (unmarked) URL with
   no home to go to — still filtered out of Header/Skills where it would
   otherwise corrupt parsing. */
function isPureUrlLine(line){
  return /^(mailto:|https?:\/\/|www\.)\S+$/i.test(line.trim());
}
/* Buckets raw resume text into a header block plus named sections */
function bucketImportText(text){
  const rawLines = text.split(/\r?\n/);
  const sections = { header: [] };
  let current = 'header';
  rawLines.forEach(line => {
    const sec = matchImportSection(line);
    if(sec){ current = sec; if(!sections[sec]) sections[sec] = []; return; }
    // A bare, un-marked URL line is a genuine proof link the person typed
    // directly under an entry. Header/Skills have no per-entry url field to
    // catch it (and it breaks Skills' colon-based parsing), so drop it
    // there; everywhere else, let it flow through so the entry-level URL
    // extraction below can pick it up as a proof link. Marker-tagged lines
    // (from PDF link annotations) are now positioned by pdfItemsToText to
    // land on the row they visually belong to, so they always flow through.
    if(!isInjectedAnnotationLink(line) && isPureUrlLine(line) && (current === 'header' || current === 'skills')) return;
    (sections[current] = sections[current] || []).push(line);
  });
  return sections;
}

const IMPORT_BULLET_RE = /^[•\-\*●▪◦‣►·o–—]\s+/;
const IMPORT_DATE_RE = /((?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+)?(\d{4})\s*(?:-|–|—|to)\s*((?:(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+)?\d{4}|Present|Current|Ongoing)/i;

function importExtractDate(line){
  const m = line.match(IMPORT_DATE_RE);
  if(!m) return null;
  return { full:m[0], start:(m[1]||'').trim()+(m[1]?' ':'')+m[2], end:m[3] };
}
/* Splits "Role — Company" / "Role | Company" / "Role, Company" into two parts.
   Uses regex separators so stray spacing around a pipe (e.g. "Name| Stack")
   still splits cleanly. */
function importSplitTitleLine(line){
  const sepPatterns = [/\s+—\s+/, /\s+–\s+/, /\s*\|\s*/, /\s+@\s+/, /\s+-\s+/, /,\s+/];
  for(const pat of sepPatterns){
    if(pat.test(line)){
      const parts = line.split(pat);
      return { a: parts[0].trim(), b: parts.slice(1).join(' ').trim() };
    }
  }
  return { a: line.trim(), b: '' };
}
function importSplitBlocks(lines){
  const blocks = [];
  let cur = [];
  lines.forEach(rawLine => {
    const line = rawLine.trim();
    if(!line){ if(cur.length){ blocks.push(cur); cur = []; } }
    else cur.push(line);
  });
  if(cur.length) blocks.push(cur);
  return blocks;
}
/* Some PDF extractions mark a big horizontal gap (e.g. a right-aligned date
   or location column) with "   |   ". When a line has one and the trailing
   piece isn't itself a date, treat it as a stray "Certificate"/"View" link
   label or a location and pull it out of the line. */
const IMPORT_STRAY_LINK_WORDS_RE = /\b(certificate|certification|view\s+certificate|view\s+project|read\s+more|link)\b/gi;
function importCleanLine(line){
  return line.replace(IMPORT_STRAY_LINK_WORDS_RE, '').replace(/\s{2,}/g,' ').trim();
}
function importSplitColumn(line){
  const cleaned = importCleanLine(line);
  if(!cleaned.includes('|')) return { line: cleaned, extra: '' };
  const parts = cleaned.split('|').map(s => s.trim()).filter(Boolean);
  if(parts.length < 2) return { line: cleaned.replace(/\|/g,'').trim(), extra: '' };
  const last = parts[parts.length - 1];
  if(importExtractDate(last)){
    // the right-hand column is itself a date range - keep it in the line so
    // the normal date-extraction path below still finds it
    return { line: parts.join(' ').trim(), extra: '' };
  }
  return { line: parts.slice(0, -1).join(' ').trim(), extra: last };
}
/* Job-title keywords used to figure out which of two same-row fields is the
   role vs. the organization, regardless of which one the resume lists first. */
const IMPORT_ROLE_KEYWORDS_RE = /\b(intern|engineer|manager|developer|analyst|coordinator|officer|specialist|lead|director|consultant|associate|designer|architect|scientist|assistant|executive|administrator|founder|co-founder|president|ceo|cto|cfo|coo|head|volunteer|trainee|researcher|freelanc\w*)\b/i;
function importFixExperienceOrder(entries){
  entries.forEach(e => {
    if(!IMPORT_ROLE_KEYWORDS_RE.test(e.role) && IMPORT_ROLE_KEYWORDS_RE.test(e.company)){
      const tmp = e.role; e.role = e.company; e.company = tmp;
    }
    e.role = importStripLabelPrefix(e.role);
    e.company = importStripLabelPrefix(e.company);
  });
  return entries;
}
/* Strips literal field-name labels some resumes print inline, e.g.
   "Role – AI/ML Engineer Intern" -> "AI/ML Engineer Intern". */
function importStripLabelPrefix(s){
  return (s || '').replace(/^(role|position|title|job\s*title|designation)\s*[:\-–—]\s*/i, '').trim();
}
/* Generic parser for "timeline" sections (experience / education): a role/degree
   line, a company/school line, an optional location, a date range, and — for
   experience — bullet highlights. */
function importParseTimeline(lines, roleKey, companyKey, withBullets){
  if(!lines) return [];
  const entries = [];
  let cur = null;
  const makeEntry = () => {
    const e = { id:nextId(), location:'', start:'', end:'', url:'' };
    e[roleKey] = ''; e[companyKey] = '';
    if(withBullets) e.bullets = [];
    return e;
  };
  lines.forEach(rawLine => {
    const { clean, url: markedUrl } = extractMarkedUrl(rawLine);
    let line = clean.trim();
    const attachMarkedUrl = () => { if(markedUrl && cur && !cur.url) cur.url = markedUrl; };
    if(!line){ attachMarkedUrl(); return; }
    if(withBullets && IMPORT_BULLET_RE.test(line)){
      if(!cur){ cur = makeEntry(); entries.push(cur); }
      cur.bullets.push(importCleanLine(line.replace(IMPORT_BULLET_RE,'')));
      attachMarkedUrl();
      return;
    }
    // A line that's nothing but a URL is a proof/credential link for the
    // entry currently being built — attach it directly rather than letting
    // it fall through and (for non-bulleted sections like Education) get
    // mistaken for the start of a whole new entry.
    const pureUrl = line.match(/^((https?:\/\/)|(www\.))\S+$/i);
    if(pureUrl && cur){
      if(!cur.url) cur.url = pureUrl[0].startsWith('http') ? pureUrl[0] : 'https://' + pureUrl[0];
      attachMarkedUrl();
      return;
    }
    // A wrapped bullet: the PDF line-broke mid-sentence, so this line has no
    // bullet marker of its own but is really the tail end of the previous
    // bullet. Signals: it starts lowercase, or the previous bullet doesn't
    // yet end with sentence-ending punctuation.
    if(withBullets && cur && cur.bullets.length && !importExtractDate(line)){
      const lastBullet = cur.bullets[cur.bullets.length - 1];
      const looksIncomplete = lastBullet && !/[.!?:;]$/.test(lastBullet.trim());
      const startsLower = /^[a-z]/.test(line);
      if(looksIncomplete || startsLower){
        cur.bullets[cur.bullets.length - 1] = importCleanLine((lastBullet + ' ' + line).trim());
        attachMarkedUrl();
        return;
      }
    }
    const split = importSplitColumn(line);
    line = split.line;
    if(!line){ attachMarkedUrl(); return; }
    const date = importExtractDate(line);
    if(date){
      const remainder = line.replace(date.full,'').replace(/^[|,–—-]+|[|,–—-]+$/g,'').trim();
      const curFull = cur && cur.start && cur.end;
      if(!cur || curFull){
        cur = makeEntry(); entries.push(cur);
        cur.start = date.start; cur.end = date.end;
        if(remainder){ const {a,b} = importSplitTitleLine(remainder); cur[roleKey] = a; if(b) cur[companyKey] = b; }
      } else {
        cur.start = date.start; cur.end = date.end;
        if(remainder && !cur[companyKey]) cur[companyKey] = remainder;
      }
      if(split.extra && cur && !cur.location) cur.location = split.extra;
      attachMarkedUrl();
      return;
    }
    const curFilled = cur && cur[roleKey] && cur[companyKey] && (!withBullets || cur.bullets.length);
    if(!cur || curFilled){ cur = makeEntry(); entries.push(cur); }
    if(!cur[roleKey] && !cur[companyKey]){
      const {a,b} = importSplitTitleLine(line);
      cur[roleKey] = a;
      if(b) cur[companyKey] = b;
    } else if(!cur[roleKey]){
      cur[roleKey] = line;
    } else if(!cur[companyKey]){
      cur[companyKey] = line;
    } else if(!cur.location){
      cur.location = line;
    }
    if(split.extra && !cur.location) cur.location = split.extra;
    attachMarkedUrl();
  });
  return entries
    .filter(e => e[roleKey] || e[companyKey] || (withBullets && e.bullets.length))
    .map(e => importExtractEntryUrl(e, [roleKey, companyKey, 'location']));
}
/* If a certificate/proof link is embedded in an entry's title, org, location,
   or a bullet, pull it out into the entry's own url field instead of leaving
   raw URL text cluttering the bullet or title line. */
function importExtractEntryUrl(entry, textFields){
  let foundUrl = '';
  const urlRe = /((https?:\/\/)|(www\.))[^\s,()<>]+/i;
  const stripFrom = (str) => {
    if(!str || foundUrl) return str;
    const m = str.match(urlRe);
    if(!m) return str;
    foundUrl = m[0].startsWith('http') ? m[0] : 'https://' + m[0];
    return str.replace(m[0], '').replace(/\s{2,}/g,' ').trim();
  };
  textFields.forEach(f => { entry[f] = stripFrom(entry[f]); });
  if(entry.bullets) entry.bullets = entry.bullets.map(stripFrom);
  if(foundUrl && !entry.url) entry.url = foundUrl;
  return entry;
}
/* Resumes list "School then Degree" or "Degree then School" in either order —
   use degree-ish keywords to make sure the fields land in the right box. */
function importFixEducationOrder(entries){
  const degreeRe = /\b(bachelor|master|ph\.?d|doctorate|b\.?tech|m\.?tech|b\.?sc|m\.?sc|b\.?a\b|m\.?a\b|b\.?e\b|m\.?e\b|mba|associate|diploma|degree)\b/i;
  entries.forEach(e => {
    if(!degreeRe.test(e.degree) && degreeRe.test(e.school)){
      const tmp = e.degree; e.degree = e.school; e.school = tmp;
    }
  });
  return entries;
}
/* Some resumes print two short entries side by side (e.g. two certificate
   names on one visual row) — a big-gap "|" marker splits those back into
   separate lines before block-grouping. */
function importExpandPipeColumns(lines){
  const out = [];
  (lines || []).forEach(l => {
    const cleaned = importCleanLine(l);
    if(cleaned.includes('|')){
      cleaned.split('|').map(s => s.trim()).filter(Boolean).forEach(p => out.push(p));
    } else if(cleaned) out.push(cleaned);
    else out.push('');
  });
  return out;
}
/* Parser for short "credential" blocks: certifications & awards */
function importParseCredBlock(block){
  const joinedRaw = block.join(' ');
  const { clean: joined, url: markedUrl } = extractMarkedUrl(joinedRaw);
  const urlM = joined.match(/((https?:\/\/)|(www\.))[^\s,()<>]+/i);
  const url = markedUrl || (urlM ? (urlM[0].startsWith('http') ? urlM[0] : 'https://' + urlM[0]) : '');
  let rest = urlM ? joined.replace(urlM[0], '') : joined;
  const dateM = rest.match(/((?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+)?(19|20)\d{2}/i);
  const date = dateM ? dateM[0].trim() : '';
  if(date) rest = rest.replace(dateM[0], '');
  rest = rest.trim().replace(/^[|,–—-]+|[|,–—-]+$/g,'').replace(/\(\s*\)/g,'').trim();
  const { a, b } = importSplitTitleLine(rest);
  return { name:a, issuer:b, date, url };
}
/* Projects rarely have dates to anchor on, and often run back-to-back with no
   blank line between them — so a new project starts wherever a plain title
   line follows a project that already has bullet content. */
function importParseProjects(lines){
  if(!lines) return [];
  const projects = [];
  let cur = null;
  lines.forEach(rawLine => {
    const { clean: rawClean, url: markedUrl } = extractMarkedUrl(rawLine);
    const line = importCleanLine(rawClean);
    const attachMarkedUrl = () => { if(markedUrl && cur && !cur.url) cur.url = markedUrl; };
    if(!line){ attachMarkedUrl(); return; }
    if(IMPORT_BULLET_RE.test(line)){
      if(!cur){ cur = { name:'', url:'', descLines:[] }; projects.push(cur); }
      cur.descLines.push(line.replace(IMPORT_BULLET_RE,'').trim());
      attachMarkedUrl();
      return;
    }
    // Wrapped continuation of the previous bullet/description line (same
    // reasoning as importParseTimeline — a PDF line-wrap, not a new project).
    if(cur && cur.descLines.length){
      const last = cur.descLines[cur.descLines.length - 1];
      const looksIncomplete = last && !/[.!?:;]$/.test(last.trim());
      const startsLower = /^[a-z]/.test(line);
      if(looksIncomplete || startsLower){
        cur.descLines[cur.descLines.length - 1] = (last + ' ' + line).trim();
        attachMarkedUrl();
        return;
      }
    }
    if(!cur || cur.descLines.length){
      cur = { name:'', url:'', descLines:[] };
      projects.push(cur);
      const titleLine = line.replace(/^\d+[.)]\s+/, ''); // "1. Project Name" -> "Project Name"
      const { a, b } = importSplitTitleLine(titleLine);
      cur.name = a;
      if(b) cur.descLines.push(b);
    } else {
      cur.descLines.push(line);
    }
    attachMarkedUrl();
  });
  return projects.map(p => {
    const joined = p.descLines.join(' ');
    const urlM = joined.match(/((https?:\/\/)|(www\.))[^\s,()<>]+/i);
    const url = p.url || (urlM ? (urlM[0].startsWith('http') ? urlM[0] : 'https://' + urlM[0]) : '');
    const description = (urlM ? joined.replace(urlM[0], '') : joined).trim();
    return { name: p.name.replace(/[|,–—-]+$/,'').trim(), url, description };
  }).filter(p => p.name);
}
/* Splits a skill list on commas/semicolons/pipes, but keeps parenthesised
   content like "AWS (EC2, S3)" intact as one item instead of splitting on
   the comma inside the parens. */
function importSplitSkillItems(str){
  const protectedStr = str.replace(/\([^()]*\)/g, m => m.replace(/,/g, '\u0000'));
  return protectedStr.split(/,|;|\||•/).map(s => s.replace(/\u0000/g, ',').trim()).filter(Boolean);
}
/* A line in the Skills section with no colon is almost always a PDF line-wrap
   continuation of the previous "Category: item, item" line (or of a flat,
   no-category list), not a genuinely new entry — so fold it back in. */
function importMergeWrappedSkillLines(lines){
  const merged = [];
  (lines || []).forEach(rawLine => {
    const line = extractMarkedUrl(rawLine).clean.replace(IMPORT_BULLET_RE, '').trim();
    if(!line) return;
    if(!line.includes(':') && merged.length){
      merged[merged.length - 1] = (merged[merged.length - 1] + ' ' + line).trim();
    } else {
      merged.push(line);
    }
  });
  return merged;
}
function importParseSkills(lines){
  if(!lines) return [];
  const cats = [];
  let genericItems = [];
  importMergeWrappedSkillLines(lines).forEach(clean => {
    const colonIdx = clean.indexOf(':');
    if(colonIdx > -1 && colonIdx < 40){
      const category = clean.slice(0, colonIdx).trim();
      const items = importSplitSkillItems(clean.slice(colonIdx+1));
      if(category && items.length) cats.push({ id:nextId(), category, items });
    } else {
      genericItems.push(...importSplitSkillItems(clean));
    }
  });
  if(genericItems.length) cats.push({ id:nextId(), category:'Skills', items:[...new Set(genericItems)] });
  return cats;
}

function runImport(){
  const ta = document.getElementById('importTextarea');
  const text = ta ? ta.value : '';
  if(!text.trim()){ alert('Paste or upload some resume text first.'); return; }

  const sections = bucketImportText(text);
  const filled = [];

  /* ---------- Personal + links (from the header block, before the first
     recognized section) ---------- */
  const headerLines = (sections.header || []).map(l => l.trim());
  const headerNonEmpty = headerLines.filter(Boolean);
  const emailMatch = text.match(/[\w.+-]+@[\w-]+\.[a-zA-Z]{2,}/);
  const phoneMatch = text.match(/(\+?\d[\d\s().-]{7,}\d)/);
  // Scoped to the header only — this is deliberate. A certificate/proof link
  // that lives under a specific job, degree, or project should end up on
  // that entry's own Link field (handled per-section below), not dumped
  // into the header's personal Links list just because it's a URL somewhere
  // in the document.
  const urlMatches = Array.from((sections.header || []).join('\n').matchAll(/((https?:\/\/)|(www\.))[^\s,()<>]+/gi)).map(m => m[0].replace(/[.,;:]+$/,''));

  if(headerNonEmpty[0]){ state.personal.fullName = headerNonEmpty[0]; filled.push('personal info'); }
  if(headerNonEmpty[1] && !/@/.test(headerNonEmpty[1]) && !urlMatches.some(u => headerNonEmpty[1].includes(u)) && !/\d{3}/.test(headerNonEmpty[1])){
    state.personal.title = headerNonEmpty[1];
  }
  if(emailMatch) state.personal.email = emailMatch[0];
  if(phoneMatch) state.personal.phone = phoneMatch[0].trim();
  const locLine = headerNonEmpty.find(l => /,/.test(l) && !/@/.test(l) && !urlMatches.some(u => l.includes(u)) && l !== state.personal.fullName && l !== state.personal.title && l.length < 60 && !/\d{3}.*\d{3}/.test(l));
  if(locLine) state.personal.location = locLine;

  let addedLinks = false;
  urlMatches.forEach(u => {
    const url = u.startsWith('http') ? u : 'https://' + u;
    if(!state.links.some(l => l.url === url)){
      let type = 'Other';
      if(/linkedin/i.test(url)) type = 'LinkedIn';
      else if(/github/i.test(url)) type = 'GitHub';
      else if(/twitter|x\.com/i.test(url)) type = 'Twitter / X';
      else if(/behance/i.test(url)) type = 'Behance';
      else if(/dribbble/i.test(url)) type = 'Dribbble';
      else if(/portfolio|\.design|\.dev/i.test(url)) type = 'Portfolio';
      state.links.push({ id:nextId(), type, label:url.replace(/^https?:\/\//,''), url });
      addedLinks = true;
    }
  });
  if(addedLinks) filled.push('links');

  /* ---------- Summary ---------- */
  if(sections.summary && sections.summary.some(l => l.trim())){
    const summaryText = sections.summary.map(l => l.trim()).filter(Boolean).join(' ');
    if(summaryText){ state.personal.summary = summaryText; filled.push('summary'); }
  }

  /* ---------- Experience ---------- */
  const newExperience = importFixExperienceOrder(importParseTimeline(sections.experience, 'role', 'company', true));
  newExperience.forEach(entry => {
    const dup = state.experience.find(e => e.role.toLowerCase() === entry.role.toLowerCase() && e.company.toLowerCase() === entry.company.toLowerCase());
    if(!dup) state.experience.push(entry);
  });
  if(newExperience.length) filled.push('experience');

  /* ---------- Education ---------- */
  const newEducation = importFixEducationOrder(importParseTimeline(sections.education, 'degree', 'school', false));
  newEducation.forEach(entry => {
    const dup = state.education.find(e => e.degree.toLowerCase() === entry.degree.toLowerCase() && e.school.toLowerCase() === entry.school.toLowerCase());
    if(!dup) state.education.push(entry);
  });
  if(newEducation.length) filled.push('education');

  /* ---------- Skills ---------- */
  const newSkillCats = importParseSkills(sections.skills);
  newSkillCats.forEach(cat => {
    const existing = state.skills.find(c => c.category.toLowerCase() === cat.category.toLowerCase());
    if(existing){
      cat.items.forEach(item => { if(!existing.items.some(i => i.toLowerCase() === item.toLowerCase())) existing.items.push(item); });
    } else {
      state.skills.push(cat);
    }
  });
  if(newSkillCats.length) filled.push('skills');

  /* ---------- Certifications ---------- */
  let certBlocks = importSplitBlocks(importExpandPipeColumns(sections.certifications || []));
  if(certBlocks.length === 1 && certBlocks[0].length > 1) certBlocks = certBlocks[0].map(l => [l]);
  const newCerts = certBlocks.map(importParseCredBlock).filter(c => c.name);
  newCerts.forEach(c => {
    const dup = state.certifications.find(x => x.name.toLowerCase() === c.name.toLowerCase());
    if(!dup) state.certifications.push({ id:nextId(), name:c.name, issuer:c.issuer, date:c.date, url:c.url });
  });
  if(newCerts.length) filled.push('certifications');

  /* ---------- Awards ---------- */
  let awardBlocks = importSplitBlocks(importExpandPipeColumns(sections.awards || []));
  if(awardBlocks.length === 1 && awardBlocks[0].length > 1) awardBlocks = awardBlocks[0].map(l => [l]);
  const newAwards = awardBlocks.map(importParseCredBlock).filter(a => a.name);
  newAwards.forEach(a => {
    const dup = state.awards.find(x => x.name.toLowerCase() === a.name.toLowerCase());
    if(!dup) state.awards.push({ id:nextId(), name:a.name, issuer:a.issuer, date:a.date, url:a.url });
  });
  if(newAwards.length) filled.push('awards');

  /* ---------- Projects ---------- */
  const newProjects = importParseProjects(sections.projects || []);
  newProjects.forEach(p => {
    const dup = state.projects.find(x => x.name.toLowerCase() === p.name.toLowerCase());
    if(!dup) state.projects.push({ id:nextId(), name:p.name, url:p.url, description:p.description });
  });
  if(newProjects.length) filled.push('projects');

  state.importText = text;
  renderPanels(); renderPreview(); renderImportPanel();
  setTab('personal');
  setImportStatus(filled.length ? `Imported ✓ — auto-filled: ${filled.join(', ')}. Review each tab and adjust anything that needs a human touch.` : 'Text imported, but no recognizable sections were found — try filling the tabs in manually.');
}

/* ================= PREVIEW RENDER ================= */
function renderPreview(){
  const p = state.personal;
  const page = document.getElementById('resume-inner');

  const contactBits = [p.email, p.phone, p.location].filter(Boolean);
  const metaItems = [];
  if(p.location) metaItems.push(`<span>📍 ${esc(p.location)}</span>`);
  if(p.phone) metaItems.push(`<span>📞 ${esc(p.phone)}</span>`);
  if(p.email) metaItems.push(`<span>✉️ <a href="mailto:${esc(p.email)}">${esc(p.email)}</a></span>`);
  state.links.filter(l => l.url).forEach(l => {
    metaItems.push(`<span>🔗 <a href="${esc(l.url)}" target="_blank">${esc(l.label || l.type)}</a></span>`);
  });
  const contactHtml = metaItems.length ? `<div class="r-contact">${metaItems.join('')}</div>` : '';

  const summaryHtml = p.summary ? `
    <div class="r-section">
      <div class="r-section-title">Professional Summary</div>
      <div class="r-summary">${mdBold(p.summary)}</div>
    </div>` : '';

  const expHtml = state.experience.length ? `
    <div class="r-section">
      <div class="r-section-title">Experience</div>
      ${state.experience.map(x => `
        <div class="r-entry">
          <div class="r-entry-top">
            <div class="r-entry-role">${esc(x.role)||'Role'}${x.company?` <span class="r-entry-org">— ${esc(x.company)}</span>`:''}</div>
            <div class="r-entry-dates">${[x.start,x.end].filter(Boolean).join(' – ')}</div>
          </div>
          ${x.location?`<div class="r-entry-loc">${esc(x.location)}</div>`:''}
          ${x.url?`<div class="r-entry-loc"><a href="${esc(x.url)}" target="_blank" style="color:var(--resume-accent);text-decoration:none;font-weight:600;">${esc(x.url.replace(/^https?:\/\//,''))}</a></div>`:''}
          ${x.bullets.filter(b=>b.trim()).length ? `<ul>${x.bullets.filter(b=>b.trim()).map(b=>`<li>${mdBold(b)}</li>`).join('')}</ul>` : ''}
        </div>
      `).join('')}
    </div>` : '';

  const eduHtml = state.education.length ? `
    <div class="r-section">
      <div class="r-section-title">Education</div>
      ${state.education.map(e => `
