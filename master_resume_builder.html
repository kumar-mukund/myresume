/* PDF.js hands back an unordered bag of text fragments with x/y coordinates —
   it does NOT give you line breaks. Reconstruct real lines by grouping
   fragments that share a y-position, then mark a big horizontal jump (e.g. a
   right-aligned date or location next to a left-aligned title) with a column
   separator so downstream parsing can tell the two columns apart.
   linkAnnots (optional): PDF link annotations for this page, each with a
   .url and .rect [x1,y1,x2,y2]. Each is matched to the row it visually sits
   on (by y-position) and injected there, tagged with IMPORT_ANNOT_LINK_MARKER,
   so a "Certificate" hyperlink lands in the exact line it belongs to (e.g.
   next to a specific job) instead of a page-level dump with no context. */
function pdfItemsToText(items, linkAnnots){
  if(!items.length) return '';
  const rows = [];
  items.forEach(it => {
    if(!it.str || !it.str.trim()) return;
    const y = Math.round(it.transform[5]);
    let row = rows.find(r => Math.abs(r.y - y) <= 2.5);
    if(!row){ row = { y, frags: [] }; rows.push(row); }
    row.frags.push({ x: it.transform[4], str: it.str, width: it.width || (it.str.length * (it.transform[0] || 5) * 0.5) });
  });
  (linkAnnots || []).forEach(a => {
    if(!a.url || !a.rect) return;
    const [x1, y1, x2, y2] = a.rect;
    const centerY = Math.round((y1 + y2) / 2);
    let row = rows.find(r => Math.abs(r.y - centerY) <= 6);
    if(!row){ row = { y: centerY, frags: [] }; rows.push(row); }
    row.frags.push({ x: x2, str: IMPORT_ANNOT_LINK_MARKER + a.url, width: 0 });
  });
  rows.sort((a,b) => b.y - a.y); // pdf y grows upward; read top -> bottom
  return rows.map(row => {
    row.frags.sort((a,b) => a.x - b.x);
    let line = '';
    let lastEndX = null;
    row.frags.forEach(f => {
      if(lastEndX !== null){
        const gap = f.x - lastEndX;
        line += gap > 28 ? '   |   ' : (gap > 1.5 ? ' ' : '');
      }
      line += f.str;
      lastEndX = f.x + f.width;
    });
    return line.trim();
  }).filter(Boolean).join('\n');
}

function extractPdfText(file){
  return new Promise((resolve, reject) => {
    if(typeof pdfjsLib === 'undefined'){ reject(new Error('PDF reader unavailable')); return; }
    const reader = new FileReader();
    reader.onload = async () => {
      try{
        const typedArray = new Uint8Array(reader.result);
        const pdf = await pdfjsLib.getDocument({ data: typedArray }).promise;
        let fullText = '';
        for(let i = 1; i <= pdf.numPages; i++){
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          let linkAnnots = [];
          try{
            const annots = await page.getAnnotations();
            linkAnnots = annots.filter(a => a.url && a.rect);
          } catch(annotErr){ /* link annotations are a bonus, not required */ }
          fullText += pdfItemsToText(content.items, linkAnnots) + '\n\n';
        }
        resolve(fullText.trim());
      } catch(err){ reject(err); }
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsArrayBuffer(file);
  });
}

function extractDocxText(file){
  return new Promise((resolve, reject) => {
    if(typeof mammoth === 'undefined'){ reject(new Error('Word reader unavailable')); return; }
    const reader = new FileReader();
    reader.onload = () => {
      mammoth.extractRawText({ arrayBuffer: reader.result })
        .then(result => resolve(result.value))
        .catch(reject);
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsArrayBuffer(file);
  });
}

async function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const ta = document.getElementById('importTextarea');
  const name = file.name.toLowerCase();

  try{
    let text;
    if(name.endsWith('.pdf') || file.type === 'application/pdf'){
      setImportStatus('Reading PDF…');
      text = await extractPdfText(file);
    } else if(name.endsWith('.docx') || file.type.includes('wordprocessingml')){
      setImportStatus('Reading Word document…');
      text = await extractDocxText(file);
    } else if(name.endsWith('.doc')){
      setImportStatus('Old .doc files can\'t be auto-read — open it, select all, copy, and paste the text below.', true);
      return;
    } else {
      setImportStatus('Reading file…');
      text = await file.text();
    }

    if(!text || !text.trim()){
      setImportStatus('No readable text found in that file — try pasting the text below instead.', true);
      return;
    }

    if(ta) ta.value = text;
    state.importText = text;
    setImportStatus('Text extracted ✓ — review it below, then click "Import & auto-fill."');
  } catch(err){
    console.error(err);
    setImportStatus('Could not read that file automatically — open it, select all, copy, and paste the text below instead.', true);
  }
}
/* ---- Section header recognizers ---- */
const IMPORT_SECTION_DEFS = [
  { key:'summary', patterns:[/^(professional\s+|career\s+)?summary$/i, /^objective$/i, /^profile$/i, /^about(\s+me)?$/i, /^personal\s+statement$/i] },
  { key:'experience', patterns:[/^(work\s+|professional\s+|relevant\s+)?experience$/i, /^employment(\s+history)?$/i, /^work\s+history$/i, /^career\s+history$/i, /^leadership(\s*(&|and)\s*organi[sz]ational(\s+experience)?)?$/i, /^extracurricular(\s+activities)?$/i, /^activities$/i, /^organi[sz]ations?(\s+(&|and)\s+leadership)?$/i, /^volunteer(ing)?(\s+experience)?$/i] },
  { key:'education', patterns:[/^education(al\s+background)?$/i, /^academic\s+background$/i, /^academic\s+qualifications?$/i] },
  { key:'skills', patterns:[/^(technical\s+|core\s+|key\s+)?skills$/i, /^skills\s*(&|and)\s*(tools|technologies)$/i, /^core\s+competencies$/i, /^technologies$/i, /^technical\s+proficienc(y|ies)$/i] },
  { key:'certifications', patterns:[/^certifications?$/i, /^certificates?$/i, /^licenses?(\s*(&|and)\s*certifications?)?$/i] },
  { key:'awards', patterns:[/^awards?(\s*(&|and)\s*honou?rs?)?$/i, /^honou?rs?$/i, /^achievements?$/i, /^accomplishments?$/i] },
  { key:'projects', patterns:[
    /^(personal\s+|academic\s+|key\s+)?projects?$/i,
    /^(research\s*(&|and)\s*)?projects?$/i,
    /^projects?\s*(&|and)\s*research$/i,
    /^research$/i,
    /^(cybersecurity\s*(&|and)?\s*)?hackathons?(\s+achievements?)?$/i,
    /^hackathon\s+achievements?$/i,
  ] },
];
function matchImportSection(line){
  const clean = line.trim().replace(/[:：]\s*$/,'');
  if(!clean || clean.length > 45) return null;
  for(const def of IMPORT_SECTION_DEFS){
    if(def.patterns.some(p => p.test(clean))) return def.key;
  }
  // Loose fallback: real resumes use all kinds of heading phrasing we won't
  // have an exact pattern for ("Cybersecurity & Hackathon Achievements",
  // "Research & Projects", etc). Only fire this on lines that are actually
  // shaped like a heading — short, no parenthetical, no embedded date, no
  // dash-separated subtitle, not a bullet — so real content lines that
  // happen to contain a trigger word (e.g. "NCSRC Hackathon (July 2025)",
  // an actual entry, not a heading) don't get mistaken for one.
  const looksLikeHeading = clean.length <= 40
    && clean.split(/\s+/).length <= 6
    && /^[A-Z0-9]/.test(clean)
    && !IMPORT_BULLET_RE.test(clean)
    && !/[()]/.test(clean)
    && !/\s[–—-]\s/.test(clean)
    && !importExtractDate(clean);
  if(looksLikeHeading){
    if(/\bhackathons?\b/i.test(clean)) return 'projects';
    if(/\bresearch\b/i.test(clean) && /\bproject/i.test(clean)) return 'projects';
    if(/\bproject(s)?\b/i.test(clean)) return 'projects';
    if(/\bleadership\b/i.test(clean) || /\borgani[sz]ation/i.test(clean) || /\bexperience\b/i.test(clean)) return 'experience';
    if(/\bskills?\b/i.test(clean) || /\btechnical\b/i.test(clean) || /\bcompetenc/i.test(clean)) return 'skills';
    if(/\bcertificat/i.test(clean) || /\blicense/i.test(clean)) return 'certifications';
    if(/\baward|\bhonou?r|\bachievement/i.test(clean)) return 'awards';
    if(/\beducation|\bacademic/i.test(clean)) return 'education';
    if(/\bsummary\b|\bobjective\b|\bprofile\b|^about\b/i.test(clean)) return 'summary';
  }
  return null;
}
/* Sentinel used to tag URLs pulled from PDF link annotations (see
   extractPdfText) so they're never confused with a URL the person actually
   typed under an entry in the resume text itself. */
const IMPORT_ANNOT_LINK_MARKER = '\u0000ANNOTLINK\u0000';
function isInjectedAnnotationLink(line){
  return line.includes(IMPORT_ANNOT_LINK_MARKER);
}
/* Finds a marker-tagged URL anywhere within a line (it may sit alongside
   real text, e.g. "Data Analyst Intern [MARKER]https://... New Delhi"),
   extracts it, and returns the line with the marker+URL cleanly removed so
   it doesn't clutter the role/title/bullet text it was embedded next to. */
function extractMarkedUrl(str){
  if(!str || !str.includes(IMPORT_ANNOT_LINK_MARKER)) return { clean: str, url: '' };
  const idx = str.indexOf(IMPORT_ANNOT_LINK_MARKER);
  const before = str.slice(0, idx);
  const after = str.slice(idx + IMPORT_ANNOT_LINK_MARKER.length);
  const m = after.match(/^\S+/);
  const url = m ? m[0] : '';
  const clean = (before + after.slice(url.length)).replace(/\s{2,}/g, ' ').trim();
  return { clean, url };
}
/* Lines that are nothing but a bare URL are usually a genuine proof link the
   person pasted under an entry, but can also be a plain (unmarked) URL with
   no home to go to — still filtered out of Header/Skills where it would
   otherwise corrupt parsing. */
function isPureUrlLine(line){
  return /^(mailto:|https?:\/\/|www\.)\S+$/i.test(line.trim());
}
/* Buckets raw resume text into a header block plus named sections */
function bucketImportText(text){
  const rawLines = text.split(/\r?\n/);
  const sections = { header: [] };
  let current = 'header';
  rawLines.forEach(line => {
    const sec = matchImportSection(line);
    if(sec){ current = sec; if(!sections[sec]) sections[sec] = []; return; }
    // A bare, un-marked URL line is a genuine proof link the person typed
    // directly under an entry. Header/Skills have no per-entry url field to
    // catch it (and it breaks Skills' colon-based parsing), so drop it
    // there; everywhere else, let it flow through so the entry-level URL
    // extraction below can pick it up as a proof link. Marker-tagged lines
    // (from PDF link annotations) are now positioned by pdfItemsToText to
    // land on the row they visually belong to, so they always flow through.
    if(!isInjectedAnnotationLink(line) && isPureUrlLine(line) && (current === 'header' || current === 'skills')) return;
    (sections[current] = sections[current] || []).push(line);
  });
  return sections;
}

const IMPORT_BULLET_RE = /^[•\-\*●▪◦‣►·o–—]\s+/;
const IMPORT_DATE_RE = /((?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+)?(\d{4})\s*(?:-|–|—|to)\s*((?:(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+)?\d{4}|Present|Current|Ongoing)/i;

function importExtractDate(line){
  const m = line.match(IMPORT_DATE_RE);
  if(!m) return null;
  return { full:m[0], start:(m[1]||'').trim()+(m[1]?' ':'')+m[2], end:m[3] };
}
/* Splits "Role — Company" / "Role | Company" / "Role, Company" into two parts.
   Uses regex separators so stray spacing around a pipe (e.g. "Name| Stack")
   still splits cleanly. */
function importSplitTitleLine(line){
  const sepPatterns = [/\s+—\s+/, /\s+–\s+/, /\s*\|\s*/, /\s+@\s+/, /\s+-\s+/, /,\s+/];
  for(const pat of sepPatterns){
    if(pat.test(line)){
      const parts = line.split(pat);
      return { a: parts[0].trim(), b: parts.slice(1).join(' ').trim() };
    }
  }
  return { a: line.trim(), b: '' };
}
function importSplitBlocks(lines){
  const blocks = [];
  let cur = [];
  lines.forEach(rawLine => {
    const line = rawLine.trim();
    if(!line){ if(cur.length){ blocks.push(cur); cur = []; } }
    else cur.push(line);
  });
  if(cur.length) blocks.push(cur);
  return blocks;
}
/* Some PDF extractions mark a big horizontal gap (e.g. a right-aligned date
   or location column) with "   |   ". When a line has one and the trailing
   piece isn't itself a date, treat it as a stray "Certificate"/"View" link
   label or a location and pull it out of the line. */
const IMPORT_STRAY_LINK_WORDS_RE = /\b(certificate|certification|view\s+certificate|view\s+project|read\s+more|link)\b/gi;
function importCleanLine(line){
  return line.replace(IMPORT_STRAY_LINK_WORDS_RE, '').replace(/\s{2,}/g,' ').trim();
}
function importSplitColumn(line){
  const cleaned = importCleanLine(line);
  if(!cleaned.includes('|')) return { line: cleaned, extra: '' };
  const parts = cleaned.split('|').map(s => s.trim()).filter(Boolean);
  if(parts.length < 2) return { line: cleaned.replace(/\|/g,'').trim(), extra: '' };
  const last = parts[parts.length - 1];
  if(importExtractDate(last)){
    // the right-hand column is itself a date range - keep it in the line so
    // the normal date-extraction path below still finds it
    return { line: parts.join(' ').trim(), extra: '' };
  }
  return { line: parts.slice(0, -1).join(' ').trim(), extra: last };
}
/* Job-title keywords used to figure out which of two same-row fields is the
   role vs. the organization, regardless of which one the resume lists first. */
const IMPORT_ROLE_KEYWORDS_RE = /\b(intern|engineer|manager|developer|analyst|coordinator|officer|specialist|lead|director|consultant|associate|designer|architect|scientist|assistant|executive|administrator|founder|co-founder|president|ceo|cto|cfo|coo|head|volunteer|trainee|researcher|freelanc\w*)\b/i;
function importFixExperienceOrder(entries){
  entries.forEach(e => {
    if(!IMPORT_ROLE_KEYWORDS_RE.test(e.role) && IMPORT_ROLE_KEYWORDS_RE.test(e.company)){
      const tmp = e.role; e.role = e.company; e.company = tmp;
    }
    e.role = importStripLabelPrefix(e.role);
    e.company = importStripLabelPrefix(e.company);
  });
  return entries;
}
/* Strips literal field-name labels some resumes print inline, e.g.
   "Role – AI/ML Engineer Intern" -> "AI/ML Engineer Intern". */
function importStripLabelPrefix(s){
  return (s || '').replace(/^(role|position|title|job\s*title|designation)\s*[:\-–—]\s*/i, '').trim();
}
/* Generic parser for "timeline" sections (experience / education): a role/degree
   line, a company/school line, an optional location, a date range, and — for
   experience — bullet highlights. */
function importParseTimeline(lines, roleKey, companyKey, withBullets){
  if(!lines) return [];
  const entries = [];
  let cur = null;
  const makeEntry = () => {
    const e = { id:nextId(), location:'', start:'', end:'', url:'' };
    e[roleKey] = ''; e[companyKey] = '';
    if(withBullets) e.bullets = [];
    return e;
  };
  lines.forEach(rawLine => {
    const { clean, url: markedUrl } = extractMarkedUrl(rawLine);
    let line = clean.trim();
    const attachMarkedUrl = () => { if(markedUrl && cur && !cur.url) cur.url = markedUrl; };
    if(!line){ attachMarkedUrl(); return; }
    if(withBullets && IMPORT_BULLET_RE.test(line)){
      if(!cur){ cur = makeEntry(); entries.push(cur); }
      cur.bullets.push(importCleanLine(line.replace(IMPORT_BULLET_RE,'')));
      attachMarkedUrl();
      return;
    }
    // A line that's nothing but a URL is a proof/credential link for the
    // entry currently being built — attach it directly rather than letting
    // it fall through and (for non-bulleted sections like Education) get
    // mistaken for the start of a whole new entry.
    const pureUrl = line.match(/^((https?:\/\/)|(www\.))\S+$/i);
    if(pureUrl && cur){
      if(!cur.url) cur.url = pureUrl[0].startsWith('http') ? pureUrl[0] : 'https://' + pureUrl[0];
      attachMarkedUrl();
      return;
    }
    // A wrapped bullet: the PDF line-broke mid-sentence, so this line has no
    // bullet marker of its own but is really the tail end of the previous
    // bullet. Signals: it starts lowercase, or the previous bullet doesn't
    // yet end with sentence-ending punctuation.
    if(withBullets && cur && cur.bullets.length && !importExtractDate(line)){
      const lastBullet = cur.bullets[cur.bullets.length - 1];
      const looksIncomplete = lastBullet && !/[.!?:;]$/.test(lastBullet.trim());
      const startsLower = /^[a-z]/.test(line);
      if(looksIncomplete || startsLower){
        cur.bullets[cur.bullets.length - 1] = importCleanLine((lastBullet + ' ' + line).trim());
        attachMarkedUrl();
        return;
      }
    }
    const split = importSplitColumn(line);
    line = split.line;
    if(!line){ attachMarkedUrl(); return; }
    const date = importExtractDate(line);
    if(date){
      const remainder = line.replace(date.full,'').replace(/^[|,–—-]+|[|,–—-]+$/g,'').trim();
      const curFull = cur && cur.start && cur.end;
      if(!cur || curFull){
        cur = makeEntry(); entries.push(cur);
        cur.start = date.start; cur.end = date.end;
        if(remainder){ const {a,b} = importSplitTitleLine(remainder); cur[roleKey] = a; if(b) cur[companyKey] = b; }
      } else {
        cur.start = date.start; cur.end = date.end;
        if(remainder && !cur[companyKey]) cur[companyKey] = remainder;
      }
      if(split.extra && cur && !cur.location) cur.location = split.extra;
      attachMarkedUrl();
      return;
    }
    const curFilled = cur && cur[roleKey] && cur[companyKey] && (!withBullets || cur.bullets.length);
    if(!cur || curFilled){ cur = makeEntry(); entries.push(cur); }
    if(!cur[roleKey] && !cur[companyKey]){
      const {a,b} = importSplitTitleLine(line);
      cur[roleKey] = a;
      if(b) cur[companyKey] = b;
    } else if(!cur[roleKey]){
      cur[roleKey] = line;
    } else if(!cur[companyKey]){
      cur[companyKey] = line;
    } else if(!cur.location){
      cur.location = line;
    }
    if(split.extra && !cur.location) cur.location = split.extra;
    attachMarkedUrl();
  });
  return entries
    .filter(e => e[roleKey] || e[companyKey] || (withBullets && e.bullets.length))
    .map(e => importExtractEntryUrl(e, [roleKey, companyKey, 'location']));
}
/* If a certificate/proof link is embedded in an entry's title, org, location,
   or a bullet, pull it out into the entry's own url field instead of leaving
   raw URL text cluttering the bullet or title line. */
function importExtractEntryUrl(entry, textFields){
  let foundUrl = '';
  const urlRe = /((https?:\/\/)|(www\.))[^\s,()<>]+/i;
  const stripFrom = (str) => {
    if(!str || foundUrl) return str;
    const m = str.match(urlRe);
    if(!m) return str;
    foundUrl = m[0].startsWith('http') ? m[0] : 'https://' + m[0];
    return str.replace(m[0], '').replace(/\s{2,}/g,' ').trim();
  };
  textFields.forEach(f => { entry[f] = stripFrom(entry[f]); });
  if(entry.bullets) entry.bullets = entry.bullets.map(stripFrom);
  if(foundUrl && !entry.url) entry.url = foundUrl;
  return entry;
}
/* Resumes list "School then Degree" or "Degree then School" in either order —
   use degree-ish keywords to make sure the fields land in the right box. */
function importFixEducationOrder(entries){
  const degreeRe = /\b(bachelor|master|ph\.?d|doctorate|b\.?tech|m\.?tech|b\.?sc|m\.?sc|b\.?a\b|m\.?a\b|b\.?e\b|m\.?e\b|mba|associate|diploma|degree)\b/i;
  entries.forEach(e => {
    if(!degreeRe.test(e.degree) && degreeRe.test(e.school)){
      const tmp = e.degree; e.degree = e.school; e.school = tmp;
    }
  });
  return entries;
}
/* Some resumes print two short entries side by side (e.g. two certificate
   names on one visual row) — a big-gap "|" marker splits those back into
   separate lines before block-grouping. */
function importExpandPipeColumns(lines){
  const out = [];
  (lines || []).forEach(l => {
    const cleaned = importCleanLine(l);
    if(cleaned.includes('|')){
      cleaned.split('|').map(s => s.trim()).filter(Boolean).forEach(p => out.push(p));
    } else if(cleaned) out.push(cleaned);
    else out.push('');
  });
  return out;
}
/* Parser for short "credential" blocks: certifications & awards */
function importParseCredBlock(block){
  const joinedRaw = block.join(' ');
  const { clean: joined, url: markedUrl } = extractMarkedUrl(joinedRaw);
  const urlM = joined.match(/((https?:\/\/)|(www\.))[^\s,()<>]+/i);
  const url = markedUrl || (urlM ? (urlM[0].startsWith('http') ? urlM[0] : 'https://' + urlM[0]) : '');
  let rest = urlM ? joined.replace(urlM[0], '') : joined;
  const dateM = rest.match(/((?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+)?(19|20)\d{2}/i);
  const date = dateM ? dateM[0].trim() : '';
  if(date) rest = rest.replace(dateM[0], '');
  rest = rest.trim().replace(/^[|,–—-]+|[|,–—-]+$/g,'').replace(/\(\s*\)/g,'').trim();
  const { a, b } = importSplitTitleLine(rest);
  return { name:a, issuer:b, date, url };
}
/* Projects rarely have dates to anchor on, and often run back-to-back with no
   blank line between them — so a new project starts wherever a plain title
   line follows a project that already has bullet content. */
function importParseProjects(lines){
  if(!lines) return [];
  const projects = [];
  let cur = null;
  lines.forEach(rawLine => {
    const { clean: rawClean, url: markedUrl } = extractMarkedUrl(rawLine);
    const line = importCleanLine(rawClean);
    const attachMarkedUrl = () => { if(markedUrl && cur && !cur.url) cur.url = markedUrl; };
    if(!line){ attachMarkedUrl(); return; }
    if(IMPORT_BULLET_RE.test(line)){
      if(!cur){ cur = { name:'', url:'', descLines:[] }; projects.push(cur); }
      cur.descLines.push(line.replace(IMPORT_BULLET_RE,'').trim());
      attachMarkedUrl();
      return;
    }
    // Wrapped continuation of the previous bullet/description line (same
    // reasoning as importParseTimeline — a PDF line-wrap, not a new project).
    if(cur && cur.descLines.length){
      const last = cur.descLines[cur.descLines.length - 1];
      const looksIncomplete = last && !/[.!?:;]$/.test(last.trim());
      const startsLower = /^[a-z]/.test(line);
      if(looksIncomplete || startsLower){
        cur.descLines[cur.descLines.length - 1] = (last + ' ' + line).trim();
        attachMarkedUrl();
        return;
      }
    }
    if(!cur || cur.descLines.length){
      cur = { name:'', url:'', descLines:[] };
      projects.push(cur);
      const titleLine = line.replace(/^\d+[.)]\s+/, ''); // "1. Project Name" -> "Project Name"
      const { a, b } = importSplitTitleLine(titleLine);
      cur.name = a;
      if(b) cur.descLines.push(b);
    } else {
      cur.descLines.push(line);
    }
    attachMarkedUrl();
  });
  return projects.map(p => {
    const joined = p.descLines.join(' ');
    const urlM = joined.match(/((https?:\/\/)|(www\.))[^\s,()<>]+/i);
    const url = p.url || (urlM ? (urlM[0].startsWith('http') ? urlM[0] : 'https://' + urlM[0]) : '');
    const description = (urlM ? joined.replace(urlM[0], '') : joined).trim();
    return { name: p.name.replace(/[|,–—-]+$/,'').trim(), url, description };
  }).filter(p => p.name);
}
/* Splits a skill list on commas/semicolons/pipes, but keeps parenthesised
   content like "AWS (EC2, S3)" intact as one item instead of splitting on
   the comma inside the parens. */
function importSplitSkillItems(str){
  const protectedStr = str.replace(/\([^()]*\)/g, m => m.replace(/,/g, '\u0000'));
  return protectedStr.split(/,|;|\||•/).map(s => s.replace(/\u0000/g, ',').trim()).filter(Boolean);
}
/* A line in the Skills section with no colon is almost always a PDF line-wrap
   continuation of the previous "Category: item, item" line (or of a flat,
   no-category list), not a genuinely new entry — so fold it back in. */
function importMergeWrappedSkillLines(lines){
  const merged = [];
  (lines || []).forEach(rawLine => {
    const line = extractMarkedUrl(rawLine).clean.replace(IMPORT_BULLET_RE, '').trim();
    if(!line) return;
    if(!line.includes(':') && merged.length){
      merged[merged.length - 1] = (merged[merged.length - 1] + ' ' + line).trim();
    } else {
      merged.push(line);
    }
  });
  return merged;
}
function importParseSkills(lines){
  if(!lines) return [];
  const cats = [];
  let genericItems = [];
  importMergeWrappedSkillLines(lines).forEach(clean => {
    const colonIdx = clean.indexOf(':');
    if(colonIdx > -1 && colonIdx < 40){
      const category = clean.slice(0, colonIdx).trim();
      const items = importSplitSkillItems(clean.slice(colonIdx+1));
      if(category && items.length) cats.push({ id:nextId(), category, items });
    } else {
      genericItems.push(...importSplitSkillItems(clean));
    }
  });
  if(genericItems.length) cats.push({ id:nextId(), category:'Skills', items:[...new Set(genericItems)] });
  return cats;
}

function runImport(){
  const ta = document.getElementById('importTextarea');
  const text = ta ? ta.value : '';
  if(!text.trim()){ alert('Paste or upload some resume text first.'); return; }

  const sections = bucketImportText(text);
  const filled = [];

  /* ---------- Personal + links (from the header block, before the first
     recognized section) ---------- */
  const headerLines = (sections.header || []).map(l => l.trim());
  const headerNonEmpty = headerLines.filter(Boolean);
  const emailMatch = text.match(/[\w.+-]+@[\w-]+\.[a-zA-Z]{2,}/);
  const phoneMatch = text.match(/(\+?\d[\d\s().-]{7,}\d)/);
  // Scoped to the header only — this is deliberate. A certificate/proof link
  // that lives under a specific job, degree, or project should end up on
  // that entry's own Link field (handled per-section below), not dumped
  // into the header's personal Links list just because it's a URL somewhere
  // in the document.
  const urlMatches = Array.from((sections.header || []).join('\n').matchAll(/((https?:\/\/)|(www\.))[^\s,()<>]+/gi)).map(m => m[0].replace(/[.,;:]+$/,''));

  if(headerNonEmpty[0]){ state.personal.fullName = headerNonEmpty[0]; filled.push('personal info'); }
  if(headerNonEmpty[1] && !/@/.test(headerNonEmpty[1]) && !urlMatches.some(u => headerNonEmpty[1].includes(u)) && !/\d{3}/.test(headerNonEmpty[1])){
    state.personal.title = headerNonEmpty[1];
  }
  if(emailMatch) state.personal.email = emailMatch[0];
  if(phoneMatch) state.personal.phone = phoneMatch[0].trim();
  const locLine = headerNonEmpty.find(l => /,/.test(l) && !/@/.test(l) && !urlMatches.some(u => l.includes(u)) && l !== state.personal.fullName && l !== state.personal.title && l.length < 60 && !/\d{3}.*\d{3}/.test(l));
  if(locLine) state.personal.location = locLine;

  let addedLinks = false;
  urlMatches.forEach(u => {
    const url = u.startsWith('http') ? u : 'https://' + u;
    if(!state.links.some(l => l.url === url)){
      let type = 'Other';
      if(/linkedin/i.test(url)) type = 'LinkedIn';
      else if(/github/i.test(url)) type = 'GitHub';
      else if(/twitter|x\.com/i.test(url)) type = 'Twitter / X';
      else if(/behance/i.test(url)) type = 'Behance';
      else if(/dribbble/i.test(url)) type = 'Dribbble';
      else if(/portfolio|\.design|\.dev/i.test(url)) type = 'Portfolio';
      state.links.push({ id:nextId(), type, label:url.replace(/^https?:\/\//,''), url });
      addedLinks = true;
    }
  });
  if(addedLinks) filled.push('links');

  /* ---------- Summary ---------- */
  if(sections.summary && sections.summary.some(l => l.trim())){
    const summaryText = sections.summary.map(l => l.trim()).filter(Boolean).join(' ');
    if(summaryText){ state.personal.summary = summaryText; filled.push('summary'); }
  }

  /* ---------- Experience ---------- */
  const newExperience = importFixExperienceOrder(importParseTimeline(sections.experience, 'role', 'company', true));
  newExperience.forEach(entry => {
    const dup = state.experience.find(e => e.role.toLowerCase() === entry.role.toLowerCase() && e.company.toLowerCase() === entry.company.toLowerCase());
    if(!dup) state.experience.push(entry);
  });
  if(newExperience.length) filled.push('experience');

  /* ---------- Education ---------- */
  const newEducation = importFixEducationOrder(importParseTimeline(sections.education, 'degree', 'school', false));
  newEducation.forEach(entry => {
    const dup = state.education.find(e => e.degree.toLowerCase() === entry.degree.toLowerCase() && e.school.toLowerCase() === entry.school.toLowerCase());
    if(!dup) state.education.push(entry);
  });
  if(newEducation.length) filled.push('education');

  /* ---------- Skills ---------- */
  const newSkillCats = importParseSkills(sections.skills);
  newSkillCats.forEach(cat => {
    const existing = state.skills.find(c => c.category.toLowerCase() === cat.category.toLowerCase());
    if(existing){
      cat.items.forEach(item => { if(!existing.items.some(i => i.toLowerCase() === item.toLowerCase())) existing.items.push(item); });
    } else {
      state.skills.push(cat);
    }
  });
  if(newSkillCats.length) filled.push('skills');

  /* ---------- Certifications ---------- */
  let certBlocks = importSplitBlocks(importExpandPipeColumns(sections.certifications || []));
  if(certBlocks.length === 1 && certBlocks[0].length > 1) certBlocks = certBlocks[0].map(l => [l]);
  const newCerts = certBlocks.map(importParseCredBlock).filter(c => c.name);
  newCerts.forEach(c => {
    const dup = state.certifications.find(x => x.name.toLowerCase() === c.name.toLowerCase());
    if(!dup) state.certifications.push({ id:nextId(), name:c.name, issuer:c.issuer, date:c.date, url:c.url });
  });
  if(newCerts.length) filled.push('certifications');

  /* ---------- Awards ---------- */
  let awardBlocks = importSplitBlocks(importExpandPipeColumns(sections.awards || []));
  if(awardBlocks.length === 1 && awardBlocks[0].length > 1) awardBlocks = awardBlocks[0].map(l => [l]);
  const newAwards = awardBlocks.map(importParseCredBlock).filter(a => a.name);
  newAwards.forEach(a => {
    const dup = state.awards.find(x => x.name.toLowerCase() === a.name.toLowerCase());
    if(!dup) state.awards.push({ id:nextId(), name:a.name, issuer:a.issuer, date:a.date, url:a.url });
  });
  if(newAwards.length) filled.push('awards');

  /* ---------- Projects ---------- */
  const newProjects = importParseProjects(sections.projects || []);
  newProjects.forEach(p => {
    const dup = state.projects.find(x => x.name.toLowerCase() === p.name.toLowerCase());
    if(!dup) state.projects.push({ id:nextId(), name:p.name, url:p.url, description:p.description });
  });
  if(newProjects.length) filled.push('projects');

  state.importText = text;
  renderPanels(); renderPreview(); renderImportPanel();
  setTab('personal');
  setImportStatus(filled.length ? `Imported ✓ — auto-filled: ${filled.join(', ')}. Review each tab and adjust anything that needs a human touch.` : 'Text imported, but no recognizable sections were found — try filling the tabs in manually.');
}

/* ================= FIT TO ONE PAGE ================= */
const RESUME_PAGE_HEIGHT = 1056; // the single-page box height (screen and print share the same padding, so this stays valid for both)
const RESUME_MIN_SCALE = 0.8; // don't shrink text past readable
function fitResumeToPage(){
  const page = document.getElementById('resume-page');
  if(!page) return;
  page.style.setProperty('--r-scale', 1);
  if(page.scrollHeight <= RESUME_PAGE_HEIGHT) return;
  let lo = RESUME_MIN_SCALE, hi = 1, best = RESUME_MIN_SCALE;
  for(let i = 0; i < 10; i++){
    const mid = (lo + hi) / 2;
    page.style.setProperty('--r-scale', mid);
    if(page.scrollHeight <= RESUME_PAGE_HEIGHT){ best = mid; lo = mid; } else { hi = mid; }
  }
  page.style.setProperty('--r-scale', best);
}

/* ================= EXPORT (PDF / PNG, generated client-side) =================
   Renders the exact live DOM to a canvas with html2canvas — pixel-identical
   to what's on screen, so there's no separate layout engine that can drift
   from it or mis-measure text (that's what broke the earlier hand-drawn PDF
   text). Links are placed as real clickable PDF annotations using each
   <a>'s actual measured position on the page, not reconstructed from text
   width, so they land correctly regardless of what the link text contains.
   No browser print dialog is involved, so there's no header/footer to fight.

   PDF math: #resume-page carries the on-screen margin as real CSS padding
   (58/64/70px). For the PDF we capture #resume-inner instead — the content
   with NO padding — and apply that same margin ourselves as the PDF page
   margin. Capturing the padded box and then also adding a page margin
   around it (the earlier bug) double-counts the margin. The PDF page is
   'letter' format because #resume-page's own box (816x1056 CSS px @96dpi)
   IS 8.5x11in — that's exactly letter size at 72pt/in, giving a clean 0.75
   px-to-pt ratio with zero leftover slack from an aspect-ratio mismatch. */
const EXPORT_MARGIN_TOP = 43.5, EXPORT_MARGIN_SIDE = 48, EXPORT_MARGIN_BOTTOM = 52.5;
const EXPORT_CAPTURE_SCALE = 3; // raster px per css px — resume text quality depends directly on this

/* jsPDF's standard fonts use WinAnsi encoding (safe up to U+00FF) — normalize
   punctuation that has an ASCII equivalent, then drop anything above that
   range (emoji, CJK, etc.) rather than let jsPDF choke or mangle it. This
   text is never seen (see textRuns below), so losing decorative glyphs
   costs nothing. */
function sanitizeForPdfText(s){
  return s
    .replace(/[‐-―]/g, '-')
    .replace(/[‘’]/g, "'")
    .replace(/[“”]/g, '"')
    .replace(/[^ -ÿ]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

async function captureElement(elId){
  const page = document.getElementById('resume-page');
  const el = document.getElementById(elId);
  const prevTransform = page.style.transform;
  page.style.transform = 'none'; // ignore the responsive on-screen shrink so capture matches full resolution
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  const rect = el.getBoundingClientRect();
  const links = Array.from(el.querySelectorAll('a[href]')).map(a => {
    const r = a.getBoundingClientRect();
    return { url: a.getAttribute('href'), x: r.left - rect.left, y: r.top - rect.top, w: r.width, h: r.height };
  }).filter(l => l.url && l.w > 0 && l.h > 0);
  /* The visible export is a raster image (below) — with no text layer, no ATS
     can read it. This walks the subtree in true document order, recursing
     into a child element exactly when it's encountered among its parent's
     childNodes, so e.g. "<strong>Category</strong>: a, b" yields "Category"
     before ": a, b" — matching reading order — rather than a parent's own
     text before its children's. Each text node gets its own Range-measured
     position, so an invisible, selectable, ATS-extractable text layer can be
     placed underneath the image at export time. */
  const textRuns = [];
  (function walk(node){
    node.childNodes.forEach(child => {
      if(child.nodeType === 3){
        const raw = child.textContent.trim();
        const text = raw ? sanitizeForPdfText(raw) : '';
        if(!text) return;
        const range = document.createRange();
        range.selectNodeContents(child);
        const r = range.getBoundingClientRect();
        if(r.width > 0 && r.height > 0){
          textRuns.push({ text, x: r.left - rect.left, y: r.top - rect.top, w: r.width, h: r.height });
        }
      } else if(child.nodeType === 1){
        walk(child);
      }
    });
  })(el);
  const canvas = await html2canvas(el, { scale: EXPORT_CAPTURE_SCALE, backgroundColor: '#ffffff', useCORS: true, logging: false });
  page.style.transform = prevTransform;
  return { canvas, links, textRuns, cssWidth: rect.width, cssHeight: rect.height };
}

async function buildResumePdfDoc(){
  const { canvas, links, textRuns, cssWidth, cssHeight } = await captureElement('resume-inner');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'letter' });
  doc.setFontSize(9);
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const contentW = pageW - EXPORT_MARGIN_SIDE * 2;
  const contentH = pageH - EXPORT_MARGIN_TOP - EXPORT_MARGIN_BOTTOM;

  const scale = contentW / cssWidth;             // pt per css-px, uniform on both axes (0.75 exactly for the letter-sized page)
  const pxPerCssPx = canvas.width / cssWidth;     // raster px per css px (html2canvas's `scale` option)
  const pageContentCssHeight = contentH / scale;  // how many css px of content fit on one pdf page

  let offsetCss = 0, first = true;
  while(offsetCss < cssHeight - 0.5){
    if(!first) doc.addPage();
    first = false;

    const sliceCssHeight = Math.min(pageContentCssHeight, cssHeight - offsetCss);
    const sliceCanvas = document.createElement('canvas');
    sliceCanvas.width = canvas.width;
    sliceCanvas.height = Math.max(1, Math.round(sliceCssHeight * pxPerCssPx));
    sliceCanvas.getContext('2d').drawImage(
      canvas,
      0, Math.round(offsetCss * pxPerCssPx), canvas.width, sliceCanvas.height,
      0, 0, canvas.width, sliceCanvas.height
    );
    const sliceHeightPt = sliceCssHeight * scale;
    doc.addImage(sliceCanvas.toDataURL('image/jpeg', 0.95), 'JPEG', EXPORT_MARGIN_SIDE, EXPORT_MARGIN_TOP, contentW, sliceHeightPt);

    links.forEach(l => {
      const linkTop = l.y, linkBottom = l.y + l.h;
      if(linkBottom > offsetCss && linkTop < offsetCss + sliceCssHeight){
        const clippedTop = Math.max(linkTop, offsetCss);
        const clippedBottom = Math.min(linkBottom, offsetCss + sliceCssHeight);
        const lh = (clippedBottom - clippedTop) * scale;
        if(lh > 0){
          doc.link(
            EXPORT_MARGIN_SIDE + l.x * scale,
            EXPORT_MARGIN_TOP + (clippedTop - offsetCss) * scale,
            l.w * scale, lh,
            { url: l.url }
          );
        }
      }
    });

    // Invisible ATS text layer: same coordinate math as the links above, but
    // placed as renderingMode:'invisible' text so the visible page stays the
    // pixel-perfect raster image while a real, selectable/extractable text
    // layer sits underneath it for ATS parsers, copy-paste, and PDF search.
    textRuns.forEach(t => {
      const baselineCss = t.y + t.h * 0.82;
      if(baselineCss >= offsetCss && baselineCss < offsetCss + sliceCssHeight){
        doc.text(
          t.text,
          EXPORT_MARGIN_SIDE + t.x * scale,
          EXPORT_MARGIN_TOP + (baselineCss - offsetCss) * scale,
          { renderingMode: 'invisible' }
        );
      }
    });

    offsetCss += sliceCssHeight;
  }
  return doc;
}

function showToast(message, type){
  let container = document.getElementById('toastContainer');
  if(!container){
    container = document.createElement('div');
    container.id = 'toastContainer';
    container.className = 'toast-container';
    document.body.appendChild(container);
  }
  const toast = document.createElement('div');
  toast.className = 'toast' + (type ? ' ' + type : '');
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('leaving');
    setTimeout(() => toast.remove(), 220);
  }, 2600);
}

async function exportAs(type){
  closeExportMenu();
  if(!unlockIdentity){
    openUnlockModal(type);
    return;
  }
  const btn = document.getElementById('exportBtn');
  if(typeof html2canvas === 'undefined' || (type === 'pdf' && typeof window.jspdf === 'undefined')){
    alert('The export library did not load (check your internet connection) — try again.');
    return;
  }
  const originalLabel = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = 'Exporting…';
  try{
    const filenameBase = (state.personal.fullName || 'resume').trim().replace(/\s+/g,'_').toLowerCase() + '_resume';
    if(type === 'pdf'){
      const doc = await buildResumePdfDoc();
      doc.save(filenameBase + '.pdf');
      showToast('✓ Downloaded ' + filenameBase + '.pdf', 'success');
      logDownloadEvent('pdf');
    } else if(type === 'png'){
      // Full padded box (not resume-inner) so the standalone image keeps its margin, matching the on-screen look.
      const { canvas } = await captureElement('resume-page');
      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/png');
      link.download = filenameBase + '.png';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('✓ Downloaded ' + filenameBase + '.png', 'success');
      logDownloadEvent('png');
    }
  } catch(err){
    console.error(err);
    showToast('Could not export the resume — please try again.', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalLabel;
  }
}

const CHAT_PROXY_URL = (location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')

// Hardcoded at the user's request so Ask AI works with no setup step. This is a

const CHAT_DEFAULT_API_KEY = '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';

function summarizeResumeForChat(){
  const p = state.personal;

  if(p.title) lines.push(`Title: ${p.title}`);

  if(state.experience.length){
    lines.push('Experience:');
    state.experience.forEach(x => {
      lines.push(`- ${x.role || 'Role'} at ${x.company || ''} (${[x.start, x.end].filter(Boolean).join(' - ')})`);

  if(state.education.length){

async function sendChatMessage(){
  const input = document.getElementById('chatInput');
  const text = (input.value || '').trim();
  if(!text || chatSending) return;
  if(!chatApiKey.trim()){
    alert('Add your NVIDIA API key above first — get a free one at build.nvidia.com.');
    return;
  }

  chatMessages.push({ role: 'user', content: text });
  input.value = '';
  chatSending = true;
  updateSendBtnState();
  renderChatBox();

  let systemPrompt = 'You are a concise, practical resume and career advisor embedded inside a resume-building tool. Help the user write stronger bullet points, decide which skills or experience to highlight, phrase achievements, and answer general resume/job-search questions. Keep answers focused and actionable — short paragraphs or a few bullet points, not long essays, unless the user asks for more depth.';
  if(chatIncludeResume){
    const summary = summarizeResumeForChat();
    if(summary) systemPrompt += `\n\nHere is the resume the user is currently building, for context on their specific situation:\n${summary}`;
  }

  try{
    const res = await fetch(CHAT_PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        apiKey: chatApiKey.trim(),
        model: chatModel.trim() || CHAT_DEFAULT_MODEL,
        // Nemotron 3.5 Lightning is a reasoning model — it spends tokens on
        // visible chain-of-thought before the final answer, so a low budget
        // can cut it off mid-thought with no answer at all (verified: 2048
        // wasn't enough; 4096 reliably finishes). 8192 leaves real headroom.
        max_tokens: 8192,
        messages: [
          { role: 'system', content: systemPrompt },
          ...chatMessages.map(m => ({ role: m.role, content: m.content }))
        ]
      })
    });

    if(!res.ok){
      const errBody = await res.json().catch(() => null);
      // NVIDIA uses RFC 7807 problem+json ({status,title,detail}); a plain
      // {error:{message}} shape is kept as a fallback for other providers/paths.
      let msg = `Request failed (${res.status})`;
      if(errBody){
        if(errBody.detail) msg = errBody.detail;
        else if(errBody.error) msg = typeof errBody.error === 'string' ? errBody.error : (errBody.error.message || JSON.stringify(errBody.error));
        else if(errBody.title) msg = errBody.title;
      }
      throw new Error(msg);
    }

    const data = await res.json();
    const replyText = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content || '').trim() || '(No text in response.)';
    chatMessages.push({ role: 'assistant', content: replyText });
  } catch(err){
    console.error(err);
    const msg = (err instanceof TypeError)
      ? 'Could not reach the local proxy — open a terminal in the MasterResume folder, run "node proxy.js", and leave it running.'
      : (err.message || 'Something went wrong reaching the API — check your key and connection.');
    chatMessages.push({ role: 'assistant', content: `⚠️ ${msg}` });
  } finally {
    chatSending = false;
    renderChatBox();
  }
}

  chatMessages = [];
  renderAiPanel();
  showToast('Conversation cleared');
}

/* ================= ATS SCORE =================
   Two layers: instant client-side heuristic checks (no API, no cost — based
   on well-established ATS-friendliness factors: contact completeness,
   action verbs, quantified achievements, keyword-bearing sections), plus an
   optional AI-powered deep review that reuses the same NVIDIA proxy path as
   the chat widget. The AI is asked to return JSON for structured display,
   with a plain-text fallback if a model doesn't comply exactly. */
let atsTargetRole = '';
const ATS_ACTION_VERBS = ['led','built','developed','managed','designed','implemented','created','improved','increased','reduced','launched','achieved','delivered','optimized','streamlined','spearheaded','coordinated','analyzed','established','executed','generated','architected','automated','mentored','negotiated','resolved','deployed','engineered','drove','scaled','authored','owned','partnered','pioneered','presented','researched','trained','transformed','built','shipped','grew','cut','saved'];

function computeAtsChecks(){
  const checks = [];
  const p = state.personal;

  const hasContact = !!(p.email && p.phone);
  checks.push({ label:'Contact info complete', status: hasContact ? 'pass' : 'fail',
    detail: hasContact ? 'Email and phone are both present.' : 'Add both an email and phone number — ATS systems and recruiters expect both.' });

  const hasSummary = !!(p.summary && p.summary.trim().length > 40);
  checks.push({ label:'Professional summary', status: hasSummary ? 'pass' : 'warn',
    detail: hasSummary ? 'A summary is present.' : "Add a 2–3 line summary — it helps ATS keyword matching and a recruiter's first scan." });

  const bulletTexts = state.experience.flatMap(x => x.bullets.filter(b => b.trim()));
  const hasExperience = state.experience.length > 0 && bulletTexts.length > 0;
  checks.push({ label:'Work experience with bullet points', status: hasExperience ? 'pass' : 'fail',
    detail: hasExperience ? `${state.experience.length} entr${state.experience.length===1?'y':'ies'}, ${bulletTexts.length} bullet${bulletTexts.length===1?'':'s'}.` : 'Add at least one experience entry with highlight bullets.' });

  if(bulletTexts.length){
    const startsWithVerb = bulletTexts.filter(b => {
      const firstWord = b.trim().replace(/^\*+/,'').split(/\s+/)[0].toLowerCase().replace(/[^a-z]/g,'');
      return ATS_ACTION_VERBS.includes(firstWord);
    }).length;
    const pct = Math.round((startsWithVerb / bulletTexts.length) * 100);
    checks.push({ label:'Bullets start with action verbs', status: pct >= 70 ? 'pass' : (pct >= 35 ? 'warn' : 'fail'),
      detail: `${pct}% of your bullets start with a strong action verb (e.g. Led, Built, Improved).` });

    const quantified = bulletTexts.filter(b => /\d/.test(b)).length;
    const qPct = Math.round((quantified / bulletTexts.length) * 100);
    checks.push({ label:'Quantified achievements', status: qPct >= 50 ? 'pass' : (qPct >= 20 ? 'warn' : 'fail'),
      detail: `${qPct}% of your bullets include a number, percentage, or metric.` });

    const tooLong = bulletTexts.filter(b => b.length > 220).length;
    checks.push({ label:'Bullet length is readable', status: tooLong === 0 ? 'pass' : 'warn',
      detail: tooLong === 0 ? 'All bullets are a reasonable length.' : `${tooLong} bullet${tooLong===1?'':'s'} ${tooLong===1?'is':'are'} quite long — consider trimming to one line.` });
  }

  const skillCount = state.skills.reduce((sum,c) => sum + c.items.length, 0);
  checks.push({ label:'Skills section', status: skillCount >= 5 ? 'pass' : (skillCount > 0 ? 'warn' : 'fail'),
    detail: skillCount > 0 ? `${skillCount} skill${skillCount===1?'':'s'} listed.` : 'Add a Skills section — ATS keyword matching relies heavily on this.' });

  checks.push({ label:'Education section', status: state.education.length > 0 ? 'pass' : 'warn',
    detail: state.education.length > 0 ? `${state.education.length} entr${state.education.length===1?'y':'ies'}.` : 'Add your education — most ATS templates expect this section.' });

  const hasLinkedIn = state.links.some(l => l.url && /linkedin\.com/i.test(l.url));
  checks.push({ label:'LinkedIn profile linked', status: hasLinkedIn ? 'pass' : 'warn',
    detail: hasLinkedIn ? 'LinkedIn is linked.' : 'Add your LinkedIn — many recruiters and ATS profiles expect it.' });

  const isSidebarTemplate = state.template === 'sidebar';
  checks.push({ label:'Single-column layout', status: isSidebarTemplate ? 'warn' : 'pass',
    detail: isSidebarTemplate
      ? 'Two-column layouts (like Sidebar) can parse out of order or lose content in some ATS systems. Switch to Classic, Minimal, Bold Header, Timeline, Compact, or Elegant for maximum compatibility.'
      : 'This template reads top-to-bottom in one column — the safest structure for ATS parsers.' });

  const resumePageEl = document.getElementById('resume-page');
  const fitsOnePage = !resumePageEl || resumePageEl.scrollHeight <= RESUME_PAGE_HEIGHT + 1;
  checks.push({ label:'Fits on one page', status: fitsOnePage ? 'pass' : 'warn',
    detail: fitsOnePage
      ? 'Your resume fits on a single page — the format ATS systems and recruiters strongly prefer.'
      : 'Your content is long even at minimum font size and will spill onto a second page — consider trimming older roles or tightening bullets.' });

  const DATE_FORMATS = [
    { name:'"Mon YYYY"', re:/^[A-Za-z]{3,9}\.?\s+\d{4}$/ },
    { name:'"MM/YYYY"', re:/^\d{1,2}[\/\-]\d{4}$/ },
    { name:'"YYYY"', re:/^\d{4}$/ },
    { name:'"MM/DD/YYYY"', re:/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}$/ },
  ];
  const classifyDate = (s) => {
    const v = (s || '').trim();
    if(!v || /^(present|current|now|ongoing)$/i.test(v)) return null;
    const found = DATE_FORMATS.find(f => f.re.test(v));
    return found ? found.name : 'other';
  };
  const dateFormatsUsed = [
    ...state.experience.flatMap(x => [x.start, x.end]),
    ...state.education.flatMap(e => [e.start, e.end]),
  ].map(classifyDate).filter(f => f && f !== 'other');
  if(dateFormatsUsed.length > 1){
    const distinct = Array.from(new Set(dateFormatsUsed));
    checks.push({ label:'Consistent date formatting', status: distinct.length <= 1 ? 'pass' : 'warn',
      detail: distinct.length <= 1 ? 'Dates use a consistent format throughout.' : `Dates mix formats (${distinct.join(', ')}) — pick one style, e.g. "Jan 2022", so ATS date-range parsing stays reliable.` });
  }

  return checks;
}

function atsScoreFromChecks(checks){
  const weights = { pass: 1, warn: 0.5, fail: 0 };
  const total = checks.reduce((sum,c) => sum + weights[c.status], 0);
  return Math.round((total / checks.length) * 100);
}

function atsScoreColor(score){
  return score >= 80 ? '#157F59' : (score >= 50 ? '#C08A2E' : '#E0524B');
}

function renderAtsChecks(){
  const el = document.getElementById('atsChecklist');
  if(!el) return;
  const checks = computeAtsChecks();
  const score = atsScoreFromChecks(checks);
  const color = atsScoreColor(score);
  const scoreLabel = score >= 80 ? 'Strong ATS match' : (score >= 50 ? 'Needs work' : 'Weak ATS match');

  el.innerHTML = `
    <div class="ats-score-badge">
      <div class="ats-score-circle" style="background:${color};">${score}</div>
      <div>
        <div class="ats-score-title">${scoreLabel}</div>
        <div class="ats-score-label">Based on ${checks.length} structural checks — instant, no API call. Exported PDFs also include a hidden, ATS-readable text layer.</div>
      </div>
    </div>
    ${checks.map((c, i) => `
      <div class="ats-check-row" style="animation-delay:${Math.min(i * 30, 200)}ms">
        <div class="ats-check-icon ${c.status}">${c.status === 'pass' ? '✓' : (c.status === 'warn' ? '!' : '✕')}</div>
        <div>
          <div class="ats-check-label">${esc(c.label)}</div>
          <div class="ats-check-detail">${esc(c.detail)}</div>
        </div>
      </div>
    `).join('')}
  `;
}

async function runAtsAiReview(){
  const btn = document.getElementById('atsAiBtn');
  const resultEl = document.getElementById('atsAiResult');
  const roleInput = document.getElementById('atsTargetRole');
  if(!atsTargetRole.trim()){
    roleInput.reportValidity();
    roleInput.focus();

  }

    alert('Add your NVIDIA API key in the Askme widget (bottom right) first.');

  }
  const originalLabel = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = 'Analyzing…';
  resultEl.innerHTML = '';
  try{
    const resumeSummary = summarizeResumeForChat();
    const roleContext = `The candidate is targeting this specific role: "${atsTargetRole.trim()}". Judge keyword and skill relevance against that role.`;
    const prompt = `You are an ATS (Applicant Tracking System) resume screener and career coach. Analyze the resume below and respond with ONLY a JSON object (no markdown code fences, no extra commentary) in exactly this shape:
{"score": <integer 0-100>, "summary": "<one sentence overall verdict>", "suggestions": ["<specific actionable suggestion>", "..."], "skills_to_learn": ["<skill name>", "..."]}
Give 3-5 suggestions and 3-6 skills_to_learn.

${roleContext}

Resume content:
${resumeSummary}`;

    const res = await fetch(CHAT_PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        apiKey: chatApiKey.trim(),
        model: chatModel.trim() || CHAT_DEFAULT_MODEL,
        max_tokens: 8192,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if(!res.ok){
      const errBody = await res.json().catch(() => null);
      let msg = `Request failed (${res.status})`;
      if(errBody){
        if(errBody.detail) msg = errBody.detail;
        else if(errBody.error) msg = typeof errBody.error === 'string' ? errBody.error : (errBody.error.message || JSON.stringify(errBody.error));
      }
      throw new Error(msg);
    }

    const data = await res.json();
    const raw = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content || '').trim();
    let parsed = null;
    const jsonMatch = raw.match(/\{[\s\S]*\}/);
    if(jsonMatch){
      try{ parsed = JSON.parse(jsonMatch[0]); }catch(e){ parsed = null; }
    }

    if(parsed && typeof parsed.score === 'number'){
      const color = atsScoreColor(parsed.score);
      resultEl.innerHTML = `
        <div class="ats-score-badge" style="margin-top:16px;">
          <div class="ats-score-circle" style="background:${color};">${Math.round(parsed.score)}</div>
          <div>
            <div class="ats-score-title">AI review</div>
            <div class="ats-score-label">${mdBold(parsed.summary || '')}</div>
          </div>
        </div>
        ${Array.isArray(parsed.suggestions) && parsed.suggestions.length ? `
          <div class="field"><label>Suggestions</label>
            <ul class="ats-suggestion-list">
              ${parsed.suggestions.map(s => `<li>${mdBold(String(s))}</li>`).join('')}
            </ul>
          </div>` : ''}
        ${Array.isArray(parsed.skills_to_learn) && parsed.skills_to_learn.length ? `
          <div class="field"><label>Skills to learn</label>
            <div>${parsed.skills_to_learn.map(s => `<span class="ats-skill-pill">${esc(String(s))}</span>`).join('')}</div>
          </div>` : ''}
      `;
    } else {
      resultEl.innerHTML = `
        <div class="field" style="margin-top:16px;"><label>AI review</label>
          <div class="chat-bubble" style="background:#fff;border:1px solid var(--line);max-width:100%;color:var(--ink);">${mdBold(raw)}</div>
        </div>`;
    }
  } catch(err){
    console.error(err);
    resultEl.innerHTML = `<p class="hint" style="color:var(--danger);margin-top:12px;">⚠️ ${esc(err.message || 'Could not complete the AI review — try again.')}</p>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalLabel;
  }
}

/* ================= RESIZABLE EDITOR PANEL =================
   The editor column's width used to be a fixed grid-template-columns value.
   Drag #resizeHandle to resize it — the width lives in the --editor-width
   CSS custom property (read by .app's grid-template-columns) and persists
   to localStorage so it's remembered next time. */
function initResizablePanel(){
  const handle = document.getElementById('resizeHandle');
  if(!handle) return;
  const root = document.documentElement;
  const MIN_WIDTH = 320, MAX_WIDTH = Math.max(900, window.innerWidth - 420);

  let saved = null;
  try{ saved = localStorage.getItem('editorPanelWidth'); }catch(e){}
  if(saved) root.style.setProperty('--editor-width', saved + 'px');

  let dragging = false;
  handle.addEventListener('mousedown', (e) => {
    dragging = true;
    handle.classList.add('dragging');
    document.body.classList.add('resizing-panel');
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if(!dragging) return;
    const w = Math.min(MAX_WIDTH, Math.max(MIN_WIDTH, e.clientX));
    root.style.setProperty('--editor-width', w + 'px');
  });
  window.addEventListener('mouseup', () => {
    if(!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.classList.remove('resizing-panel');
    const w = getComputedStyle(root).getPropertyValue('--editor-width').trim();
    try{ localStorage.setItem('editorPanelWidth', parseInt(w, 10)); }catch(e){}
    scalePreview();
  });
}

/* Recovers { iso2, localNumber } from a stored "+<dial> <digits>" phone
   string (or any legacy free-typed value) for redisplay in the country
   selector + number pair. Tries known dial codes longest-first so e.g.
   "+1268…" resolves to Antigua rather than the plain "+1" NANP countries.
   Falls back to India with whatever digits are present, capped to its
   expected length — this is best-effort re-hydration of old/free-typed
   data, not validation (the maxlength + handlePersonalPhoneChange enforce
   the real length going forward). */
function parsePersonalPhone(phoneStr){
  const raw = (phoneStr || '').trim();
  const allDigits = raw.replace(/\D/g, '');
  if(raw.startsWith('+') && allDigits){
    const dialsLongestFirst = Array.from(new Set(COUNTRY_CODES.map(c => c[1]))).sort((a, b) => b.length - a.length);
    for(const dial of dialsLongestFirst){
      if(allDigits.startsWith(dial)){
        const country = COUNTRY_CODES.find(c => c[1] === dial);
        return { iso2: country[0], localNumber: allDigits.slice(dial.length, dial.length + country[3]), len: country[3] };
      }
    }
  }
  const fallbackLen = COUNTRY_PHONE_LENGTH.IN;
  return { iso2: 'IN', localNumber: allDigits.slice(0, fallbackLen), len: fallbackLen };
}

   you type, and re-clips on country switch) rather than only rejecting on
   submit — this is what actually stops the "unlimited digits" bug, the
   submit-time length check is just a backstop for an incomplete number. */
function handleCountryPhoneInput(countrySelectId, numberInputId, hintElId){
  const sel = document.getElementById(countrySelectId);
  const numInput = document.getElementById(numberInputId);
  if(!sel || !numInput) return { dial: '', digits: '' };
  const dial = sel.value;
  const len = Number(sel.selectedOptions[0].dataset.len) || 10;
  const digits = (numInput.value || '').replace(/\D/g, '').slice(0, len);
  if(numInput.value !== digits) numInput.value = digits;
  numInput.maxLength = len;
  const hintEl = document.getElementById(hintElId);
  if(hintEl) hintEl.textContent = 'Enter ' + len + ' digits (excluding the country code).';
  return { dial, digits };
}

  const dialCode = countrySelect.value;
  const expectedLen = Number(countrySelect.selectedOptions[0].dataset.len) || 10;
  const localNumber = (document.getElementById('signupPhone').value || '').trim();
  const email = (document.getElementById('signupEmail').value || '').trim();
  if(!name){ showToast('Enter your full name.', 'error'); return; }
  const digitsOnly = localNumber.replace(/\D/g, '');
  if(digitsOnly.length !== expectedLen){
    const article = [8, 11].includes(expectedLen) ? 'an' : 'a';
    showToast('Enter ' + article + ' ' + expectedLen + '-digit phone number for the selected country.', 'error');
    return;
  }
  const phone = '+' + dialCode + ' ' + digitsOnly;
  const match = /^[^\s@]+@([^\s@]+)$/.exec(email);
  const domain = match ? match[1].toLowerCase() : '';
  if(!match || !EMAIL_UNLOCK_DOMAINS.includes(domain)){ showToast('Only Gmail or Yahoo email addresses are accepted.', 'error'); return; }
  const howHeard = readHowHeard('signup');
  if(!howHeard){ showToast('Please tell us how you heard about us.', 'error'); return; }

  unlockIdentity = { method: 'email', label: email, name, phone, howHeard };
  persistUnlock();
  reportSignupToNetlifyForms(unlockIdentity);
  if(!state.personal.fullName) state.personal.fullName = name;
  if(!state.personal.email) state.personal.email = email;
  if(!state.personal.phone) state.personal.phone = phone;
  renderPreview();
  renderPanels();
  showToast('Account created — export enabled.', 'success');
  continueAfterUnlock();
}

/* ---------- Modal step 2: mandatory for GitHub only ---------- */
function renderHowHeardStep(){
  const body = document.getElementById('unlockModalBody');
  body.innerHTML = `
    <h2>One last thing</h2>
    <p class="hint" style="margin:0 0 14px;">${esc(pendingIdentity ? pendingIdentity.label : '')} — before you continue:</p>
    ${howHeardFieldHtml('pending')}
    <button class="download-btn" style="width:100%;justify-content:center;height:auto;padding:11px 18px;margin-top:16px;" onclick="submitHowHeard()">Continue</button>
  `;
}

function submitHowHeard(){
  const howHeard = readHowHeard('pending');
  if(!howHeard){ showToast('Please tell us how you heard about us.', 'error'); return; }
  if(!pendingIdentity){ closeUnlockModal(); return; }
  unlockIdentity = Object.assign({}, pendingIdentity, { howHeard });
  pendingIdentity = null;
  persistUnlock();
  reportSignupToNetlifyForms(unlockIdentity);
  showToast('Signed in as ' + unlockIdentity.label + ' — export enabled.', 'success');
  continueAfterUnlock();
}

/* Records every completed sign-in (whichever of the 3 methods) as a Netlify
   Forms submission — the ONLY place this data goes; unlockIdentity itself
   still lives only in the visitor's own localStorage. Requires the hidden
   <form name="signups" data-netlify="true"> near the end of <body> so
   Netlify's build-time scanner registers the field schema; view/export
   submissions from the Netlify dashboard → Forms tab. This is a no-op
   (silently fails, caught below) when not served from a real deployed
   Netlify site — e.g. over file:// during local testing. */
function reportSignupToNetlifyForms(identity){
  try{
    const body = new URLSearchParams({
      'form-name': 'signups',
      method: identity.method || '',
      fullName: identity.name || '',
      identityLabel: identity.label || '',
      phone: identity.phone || '',
      email: identity.method === 'email' ? identity.label : '',
      howHeard: identity.howHeard || '',
    }).toString();
    fetch('/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body
    }).catch(() => {});
  }catch(e){}
}

/* Logs one row per completed download (not just at sign-in) to the
   Netlify Blobs store via log-download.mjs — a separate, queryable record
   from the Netlify Forms signup entries above. View it at /admin.html. */
function logDownloadEvent(exportType){
  if(!unlockIdentity) return;
  try{
    fetch('/log-download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        method: unlockIdentity.method || '',
        label: unlockIdentity.label || '',
        name: unlockIdentity.name || '',
        phone: unlockIdentity.phone || '',
        email: unlockIdentity.method === 'email' ? unlockIdentity.label : '',
        howHeard: unlockIdentity.howHeard || '',
        exportType
      })
    }).catch(() => {});
  }catch(e){}
}

function openUnlockModal(afterType){
  pendingExportType = afterType || null;
  renderUnlockStep1();
  document.getElementById('unlockModalOverlay').classList.add('open');
}

function closeUnlockModal(){
  document.getElementById('unlockModalOverlay').classList.remove('open');
  pendingExportType = null;
  pendingIdentity = null;
}

document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && document.getElementById('unlockModalOverlay').classList.contains('open')) closeUnlockModal();
});

/* Called right after unlockIdentity is actually finalized (post how-heard
   step, or the email form which asks it inline) — closes the modal and, if
   it was opened by an actual export attempt (not just opened standalone),
   resumes that exact download immediately. */
function continueAfterUnlock(){
  const resumeType = pendingExportType;
  closeUnlockModal(); // also clears pendingExportType — resumeType already captured above
  updateUnlockUI();
  if(resumeType) exportAs(resumeType);
}

/* ---------- GitHub OAuth (redirect-based — no popup library needed) ---------- */
function startGithubOAuth(){
  if(!GITHUB_SIGNIN_CONFIGURED){
    showToast("GitHub Sign-In isn't configured yet.", 'error');
    return;
  }
  const oauthState = Math.random().toString(36).slice(2) + Date.now().toString(36);
  try{ sessionStorage.setItem('githubOAuthState', oauthState); }catch(e){}
  try{
    if(pendingExportType) sessionStorage.setItem('githubOAuthPendingExport', pendingExportType);
    else sessionStorage.removeItem('githubOAuthPendingExport');
  }catch(e){}
  const authUrl = 'https://github.com/login/oauth/authorize?client_id=' + encodeURIComponent(GITHUB_CLIENT_ID)
    + '&redirect_uri=' + encodeURIComponent(GITHUB_REDIRECT_URI)
    + '&scope=' + encodeURIComponent('read:user user:email')
    + '&state=' + encodeURIComponent(oauthState);
  location.href = authUrl;
}

async function handleGithubRedirectReturn(){
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const returnedState = params.get('state');
  if(!code) return;

  // Clean the URL immediately regardless of outcome, so a refresh or back
  // navigation can't replay the same code.
  history.replaceState(null, '', location.pathname + location.hash);

  let savedState = null;
  try{ savedState = sessionStorage.getItem('githubOAuthState'); sessionStorage.removeItem('githubOAuthState'); }catch(e){}
  if(!savedState || returnedState !== savedState){
    showToast('GitHub sign-in could not be verified — please try again.', 'error');
    return;
  }
  let savedPendingExport = null;
  try{ savedPendingExport = sessionStorage.getItem('githubOAuthPendingExport'); sessionStorage.removeItem('githubOAuthPendingExport'); }catch(e){}
  pendingExportType = savedPendingExport || null;

  try{
    const res = await fetch(GITHUB_OAUTH_FUNCTION_URL + '?code=' + encodeURIComponent(code));
    const data = await res.json();
    if(!res.ok || !data.login){
      showToast(data.error || 'GitHub sign-in failed — please try again.', 'error');
      return;
    }
    pendingIdentity = { method: 'github', label: '@' + data.login };
    if(data.name && !state.personal.fullName){ state.personal.fullName = data.name; renderPanels(); renderPreview(); }
    document.getElementById('unlockModalOverlay').classList.add('open');
    renderHowHeardStep();
  } catch(e){
    console.error(e);
    showToast('GitHub sign-in failed — please try again.', 'error');
  }
}

function resetUnlock(){
  unlockIdentity = null;
  persistUnlock();
  updateUnlockUI();
}

/* ================= CONTACT SUPPORT =================
   A simple contact form — name, email, message — reachable from the "Contact
   support" link in the footer. Submissions go to the same place the sign-in
   data does: a Netlify Forms entry (see the hidden <form name="contact">
   near the end of <body>), viewable/exportable from the Netlify dashboard →
   Forms tab. To actually get emailed at SUPPORT_EMAIL when one comes in,
   turn on a form notification for it: Netlify dashboard → this site → Forms
   → Form notifications → Add notification → Email notification → that
   address (dashboard-only, not something the CLI can set). The mailto link
   shown in the modal works immediately regardless, with zero setup. */
const SUPPORT_EMAIL = 'support@myresumeease.com';

function openContactModal(){
  const body = document.getElementById('contactModalBody');
  body.innerHTML = `
    <h2>💬 Contact support</h2>
    <p class="hint" style="margin:0 0 16px;">We'll get back to you as soon as we can — or email us directly at <a href="mailto:${SUPPORT_EMAIL}" style="color:var(--brass-dark);font-weight:600;">${SUPPORT_EMAIL}</a>.</p>
    <div class="field"><label>Your name</label>
      <input type="text" id="contactName" placeholder="Jordan Rivera" required />
    </div>
    <div class="field"><label>Your email</label>
      <input type="email" id="contactEmail" placeholder="you@email.com" required />
    </div>
    <div class="field"><label>Message</label>
      <textarea id="contactMessage" placeholder="How can we help?" style="min-height:100px;" required></textarea>
    </div>
    <button class="download-btn" style="width:100%;justify-content:center;height:auto;padding:11px 18px;margin-top:6px;" onclick="submitContactForm()">Send message</button>
  `;
  document.getElementById('contactModalOverlay').classList.add('open');
}

function closeContactModal(){
  document.getElementById('contactModalOverlay').classList.remove('open');
}

document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && document.getElementById('contactModalOverlay')?.classList.contains('open')) closeContactModal();
});

function submitContactForm(){
  const name = (document.getElementById('contactName').value || '').trim();
  const email = (document.getElementById('contactEmail').value || '').trim();
  const message = (document.getElementById('contactMessage').value || '').trim();
  if(!name){ showToast('Enter your name.', 'error'); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showToast('Enter a valid email address.', 'error'); return; }
  if(!message){ showToast('Enter a message.', 'error'); return; }

  try{
    const body = new URLSearchParams({ 'form-name': 'contact', name, email, message }).toString();
    fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body }).catch(() => {});
  }catch(e){}

  closeContactModal();
  showToast("Message sent — we'll get back to you soon.", 'success');
}
