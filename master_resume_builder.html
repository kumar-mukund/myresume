<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>myresume — Resume Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#182430;
    --paper:#F5F7FA;
    --panel:#FFFFFF;
    --brass:#2F6FED;
    --brass-dark:#1E54C7;
    --brass-light:#5B93F5;
    --accent-green:#1DAB79;
    --accent-green-dark:#157F59;
    --slate:#64748B;
    --line:#E2E8F0;
    --line-soft:#EDF1F6;
    --danger:#E0524B;
    --resume-ink:#1F2937;
    --resume-slate:#64748B;
    --resume-accent:#1D4ED8;
    --resume-line:#DDE3EC;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(47,111,237,0.25);}

  /* ---------- App shell ---------- */
  .app{
    display:grid;
    grid-template-columns: var(--editor-width, 420px) 6px 1fr;
    min-height:100vh;
  }
  @media (max-width: 980px){
    .app{ grid-template-columns: 1fr; }
    .resize-handle{ display:none; }
  }
  .resize-handle{
    cursor:col-resize;
    background:var(--line);
    position:relative;
    transition:background .15s ease;
  }
  .resize-handle:hover, .resize-handle.dragging{ background:var(--brass); }
  .resize-handle::after{
    content:"";
    position:absolute;
    top:0; bottom:0;
    left:-4px; right:-4px;
  }
  body.resizing-panel, body.resizing-panel *{ cursor:col-resize !important; user-select:none; }

  /* ---------- Left: Editor ---------- */
  .editor{
    background:var(--panel);
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-width:0;
  }
  .brand{
    padding:22px 28px 16px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .brand-mark{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-logo{
    display:block;
    height:34px;
    width:auto;
    animation:sealFloat 3.5s ease-in-out infinite;
  }
  @keyframes sealFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-3px); } }
  .brand p{
    margin:2px 0 0;
    font-size:11.5px;
    color:var(--slate);
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .brand-actions{
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:8px;
  }
  #authBtn{ max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex-shrink:0; }
  .icon-btn{
    border:1px solid var(--line);
    background:transparent;
    color:var(--slate);
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    font-weight:600;
    padding:7px 10px;
    border-radius:7px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .icon-btn:hover{ border-color:var(--brass); color:var(--brass-dark); background:rgba(47,111,237,0.06); }
  .icon-btn{ transition:border-color .15s ease, color .15s ease, background .15s ease, transform .1s ease; }
  .icon-btn:active{ transform:scale(0.96); }

  /* Tabs */
  .tabs{
    display:flex;
    gap:2px;
    padding:14px 28px 0;
    border-bottom:1px solid var(--line);
    overflow-x:auto;
    position:relative;
  }
  .tab{
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:600;
    color:var(--slate);
    background:none;
    border:none;
    padding:8px 12px 12px;
    cursor:pointer;
    position:relative;
    white-space:nowrap;
    letter-spacing:0.01em;
    transition:color .18s ease;
  }
  .tab:hover{ color:var(--ink); }
  .tab.active{ color:var(--ink); }
  .tab-dot{
    display:inline-block;
    width:5px; height:5px;
    border-radius:50%;
    background:var(--brass);
    margin-left:5px;
    vertical-align:middle;
  }
  .tab-indicator{
    position:absolute;
    left:0;
    top:auto;
    bottom:-1px;
    height:2px;
    background:var(--brass);
    border-radius:2px;
    transition:transform .28s cubic-bezier(.4,0,.2,1), width .28s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
  }

  .panels{
    flex:1;
    overflow-y:auto;
    padding:22px 28px 100px;
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  .panels::-webkit-scrollbar{ width:8px; }
  .panels::-webkit-scrollbar-track{ background:transparent; }
  .panels::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
  .panels::-webkit-scrollbar-thumb:hover{ background:var(--slate); }
  .app-footer{
    flex-shrink:0;
    padding:9px 28px;
    border-top:1px solid var(--line);
    font-size:11px;
    color:var(--slate);
    text-align:center;
  }
  .panel{ display:none; }
  .panel.active{ display:block; animation:fade .3s cubic-bezier(.16,1,.3,1); }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  @keyframes cardIn{ from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:none;} }
  @keyframes chatIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  .toast-container{
    position:fixed;
    bottom:20px;
    right:20px;
    display:flex;
    flex-direction:column;
    gap:8px;
    z-index:9999;
    pointer-events:none;
  }
  .toast{
    background:var(--ink);
    color:#F5F7FA;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:600;
    padding:11px 16px;
    border-radius:8px;
    box-shadow:0 10px 28px -8px rgba(28,36,48,0.35);
    animation:toastIn .3s cubic-bezier(.16,1,.3,1);
    pointer-events:auto;
  }
  .toast.leaving{ animation:toastOut .22s ease forwards; }
  .toast.success{ background:var(--accent-green-dark); }
  .toast.error{ background:var(--danger); }
  @keyframes toastIn{ from{opacity:0; transform:translateY(12px) scale(.95);} to{opacity:1; transform:none;} }
  @keyframes toastOut{ from{opacity:1; transform:none;} to{opacity:0; transform:translateY(8px) scale(.95);} }

  /* ---------- Askme floating widget ---------- */
  .ai-widget{
    position:fixed;
    /* 90px, not 24px: platforms like Netlify inject their own "powered by"
       badge fixed to the exact bottom-right corner with an unbeatable
       z-index (~2147483645) — this clears it instead of fighting it. */
    bottom:90px;
    right:24px;
    z-index:500;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:14px;
    pointer-events:none;
  }
  .ai-fab{
    width:58px;
    height:58px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    pointer-events:auto;
    background:linear-gradient(135deg, var(--brass) 0%, var(--ink) 130%);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 10px 30px -8px rgba(28,36,48,0.5);
    position:relative;
    transition:transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
  }
  .ai-fab:hover{ transform:scale(1.08); box-shadow:0 14px 36px -8px rgba(28,36,48,0.6); }
  .ai-fab:active{ transform:scale(0.94); }
  .ai-fab-icon{ display:flex; filter:drop-shadow(0 1px 2px rgba(0,0,0,0.25)); }
  .ai-fab-icon svg{ width:26px; height:26px; }

  .ai-panel{
    width:380px;
    max-width:calc(100vw - 48px);
    max-height:min(600px, calc(100vh - 120px));
    background:#fff;
    border-radius:16px;
    box-shadow:0 24px 64px -14px rgba(28,36,48,0.4);
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    opacity:0;
    transform:translateY(16px) scale(.96);
    pointer-events:none;
    transition:opacity .22s ease, transform .22s cubic-bezier(.16,1,.3,1);
    transform-origin:bottom right;
  }
  .ai-panel.open{ opacity:1; transform:none; pointer-events:auto; }
  .ai-panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    background:linear-gradient(135deg, var(--ink) 0%, #223247 100%);
    color:#fff;
    flex-shrink:0;
  }
  .ai-panel-header-info{ display:flex; align-items:center; gap:10px; }
  .ai-avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--brass) 0%, var(--brass-light) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
  }
  .ai-avatar svg{ width:17px; height:17px; }
  .ai-panel-title{ font-size:14px; font-weight:700; line-height:1.3; }
  .ai-panel-status{
    font-size:10.5px;
    color:rgba(255,255,255,0.65);
    display:flex;
    align-items:center;
    gap:5px;
    margin-top:2px;
  }
  .ai-status-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#4ADE80;
    box-shadow:0 0 0 3px rgba(74,222,128,0.2);
  }
  .ai-panel-close{
    background:none;
    border:none;
    color:#fff;
    opacity:.7;
    cursor:pointer;
    font-size:14px;
    padding:4px;
    transition:opacity .15s ease;
  }
  .ai-panel-close:hover{ opacity:1; }
  .ai-panel-body{
    padding:14px 16px;
    overflow-y:auto;
    flex:1;
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  .ai-panel-body::-webkit-scrollbar{ width:8px; }
  .ai-panel-body::-webkit-scrollbar-track{ background:transparent; }
  .ai-panel-body::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }

  /* ---------- ATS score ---------- */
  .ats-score-badge{
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#FEFEFC;
    margin-bottom:14px;
    animation:cardIn .22s cubic-bezier(.16,1,.3,1);
  }
  .ats-score-circle{
    width:64px;
    height:64px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    font-family:'Inter',sans-serif;
    font-weight:800;
    font-size:20px;
    color:#fff;
    transition:background .3s ease;
  }
  .ats-score-title{ font-size:14px; font-weight:700; color:var(--ink); margin-bottom:2px; }
  .ats-score-label{ font-size:11.5px; color:var(--slate); line-height:1.5; }
  .ats-check-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line-soft);
    animation:cardIn .2s cubic-bezier(.16,1,.3,1) backwards;
  }
  .ats-check-row:last-child{ border-bottom:none; }
  .ats-check-icon{
    flex-shrink:0;
    width:19px;
    height:19px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10.5px;
    font-weight:700;
    color:#fff;
    margin-top:1px;
  }
  .ats-check-icon.pass{ background:var(--accent-green-dark); }
  .ats-check-icon.warn{ background:#C08A2E; }
  .ats-check-icon.fail{ background:var(--danger); }
  .ats-check-label{ font-size:12.5px; font-weight:600; color:var(--ink); }
  .ats-check-detail{ font-size:11.5px; color:var(--slate); margin-top:2px; line-height:1.4; }
  .ats-suggestion-list{ margin:8px 0 0; padding-left:18px; }
  .ats-suggestion-list li{ font-size:12.5px; line-height:1.55; margin-bottom:6px; color:var(--ink); }
  .ats-skill-pill{
    display:inline-block;
    background:#fff;
    border:1px solid var(--line);
    color:var(--ink);
    font-size:11.5px;
    font-weight:600;
    padding:5px 11px;
    border-radius:16px;
    margin:0 6px 6px 0;
  }

  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:11px;
    font-weight:600;
    color:var(--slate);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:6px;
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }

  input[type=text], input[type=email], input[type=tel], input[type=url], input[type=month], textarea, select{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:7px;
    padding:9px 11px;
    outline:none;
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  input:focus, textarea:focus, select:focus{
    border-color:var(--brass);
    background:#fff;
    box-shadow:0 0 0 3px rgba(47,111,237,0.12);
  }
  textarea{ resize:vertical; min-height:70px; line-height:1.5; }
  select{ appearance:none; background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="%235B6472"><path d="M5.5 7.5l4.5 4.5 4.5-4.5"/></svg>'); background-repeat:no-repeat; background-position:right 10px center; background-size:14px; padding-right:30px; }

  .card{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 16px 6px;
    margin-bottom:14px;
    background:#FEFEFC;
    position:relative;
    transition:box-shadow .18s ease, border-color .18s ease;
    animation:cardIn .22s cubic-bezier(.16,1,.3,1) backwards;
  }
  .card:hover{ border-color:var(--brass); box-shadow:0 2px 12px -4px rgba(28,36,48,0.12); }
  .card-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
  }
  .card-head span{
    font-size:11px;
    font-weight:700;
    color:var(--brass-dark);
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  .remove-btn{
    border:none;
    background:none;
    color:var(--slate);
    cursor:pointer;
    font-size:12px;
    font-weight:600;
    padding:4px 6px;
    border-radius:5px;
    transition:color .15s ease, background .15s ease;
  }
  .remove-btn:hover{ color:var(--danger); background:rgba(180,72,59,0.08); }

  .bullets{ margin:8px 0 4px; }
  .bullet-row{ display:flex; gap:8px; margin-bottom:8px; align-items:flex-start; }
  .bullet-row input{ flex:1; }
  .bullet-row button{ flex-shrink:0; }

  .add-btn{
    width:100%;
    border:1px dashed var(--line);
    background:none;
    color:var(--slate);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
    margin-top:2px;
    margin-bottom:18px;
    transition:border-color .15s ease, color .15s ease, background .15s ease, transform .1s ease;
  }
  .add-btn:hover{ border-color:var(--brass); color:var(--brass-dark); }
  .add-btn:active{ transform:scale(0.98); }
  .add-btn.small{ margin-bottom:8px; padding:7px; font-size:12px; }

  .chip-input-wrap{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    border:1px solid var(--line);
    border-radius:7px;
    padding:9px;
    background:var(--paper);
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#fff;
    border:1px solid var(--line);
    color:var(--ink);
    font-size:12.5px;
    font-weight:500;
    padding:5px 6px 5px 10px;
    border-radius:16px;
  }
  .chip{ animation:cardIn .18s cubic-bezier(.16,1,.3,1); }
  .chip button{
    border:none; background:var(--line-soft); color:var(--slate);
    width:16px;height:16px;border-radius:50%;
    cursor:pointer; font-size:10px; line-height:1; display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, color .15s ease;
  }
  .chip button:hover{ background:var(--danger); color:#fff; }
  .chip-input-wrap input{
    border:none; background:none; flex:1; min-width:120px; padding:5px;
  }
  .hint{ font-size:11px; color:var(--slate); margin-top:6px; }

  .chat-box{
    max-height:360px;
    overflow-y:auto;
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px;
    margin:14px 0;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .chat-msg{ display:flex; align-items:flex-end; gap:7px; animation:chatIn .22s cubic-bezier(.16,1,.3,1); }
  .chat-msg.user{ justify-content:flex-end; }
  .chat-msg.assistant{ justify-content:flex-start; }
  .chat-avatar{
    width:24px;
    height:24px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    flex-shrink:0;
    margin-bottom:1px;
  }
  .chat-avatar svg{ width:13px; height:13px; }
  .chat-avatar.bot{ background:linear-gradient(135deg, var(--brass) 0%, var(--brass-light) 100%); color:#fff; }
  .chat-avatar.user{ background:var(--ink); color:#fff; font-weight:700; }
  .chat-bubble{
    max-width:74%;
    padding:10px 14px;
    border-radius:16px;
    font-size:13px;
    line-height:1.5;
    white-space:pre-wrap;
    transition:transform .12s ease;
  }
  .chat-msg.user .chat-bubble{ background:linear-gradient(135deg, var(--ink) 0%, #223247 100%); color:#fff; border-bottom-right-radius:4px; }
  .chat-msg.assistant .chat-bubble{ background:var(--line-soft); color:var(--ink); border-bottom-left-radius:4px; }
  .chat-typing{ display:flex; align-items:center; gap:4px; padding:13px 16px !important; }
  .chat-typing span{ width:6px; height:6px; border-radius:50%; background:var(--slate); animation:typingBounce 1.2s ease-in-out infinite; }
  .chat-typing span:nth-child(2){ animation-delay:.15s; }
  .chat-typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes typingBounce{ 0%,60%,100%{ transform:translateY(0); opacity:.5; } 30%{ transform:translateY(-4px); opacity:1; } }
  .chat-input-row{
    display:flex;
    align-items:flex-end;
    gap:6px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:22px;
    padding:5px 5px 5px 15px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .chat-input-row:focus-within{ border-color:var(--brass); box-shadow:0 0 0 3px rgba(47,111,237,0.12); }
  .chat-input-row textarea{
    flex:1;
    border:none !important;
    background:none !important;
    box-shadow:none !important;
    min-height:22px;
    max-height:90px;
    padding:8px 0;
  }
  .chat-send-btn{
    width:34px;
    height:34px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg, var(--brass) 0%, var(--ink) 130%);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), opacity .15s ease;
  }
  .chat-send-btn svg{ width:15px; height:15px; margin-left:-1px; }
  .chat-send-btn:hover:not(:disabled){ transform:scale(1.08); }
  .chat-send-btn:active:not(:disabled){ transform:scale(0.92); }
  .chat-send-btn:disabled{ opacity:.35; cursor:default; }
  .chat-box::-webkit-scrollbar{ width:8px; }
  .chat-box::-webkit-scrollbar-track{ background:transparent; }
  .chat-box::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
  .chat-box::-webkit-scrollbar-thumb:hover{ background:var(--slate); }

  .preset-pills{ display:flex; flex-wrap:wrap; gap:7px; }
  .preset-pill{
    border:1px dashed var(--line);
    background:#fff;
    color:var(--slate);
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    font-weight:600;
    padding:6px 11px;
    border-radius:16px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease, transform .1s ease;
  }
  .preset-pill:hover{ border-color:var(--brass); color:var(--brass-dark); background:rgba(47,111,237,0.06); }
  .preset-pill:active{ transform:scale(0.96); }

  /* ---------- Right: Preview ---------- */
  .preview-pane{
    background:#EAEFF6;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 24px 60px;
    min-height:100vh;
  }
  .preview-bar{
    width:100%;
    max-width:816px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
  }
  .preview-bar-label{
    font-size:11.5px;
    color:var(--slate);
    letter-spacing:0.04em;
    text-transform:uppercase;
    font-weight:600;
  }
  .preview-bar-actions{
    display:flex;
    align-items:center;
    gap:10px;
    position:fixed;
    top:8px;
    right:24px;
    z-index:400;
  }
  .download-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--ink);
    color:#F5F7FA;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:13px;
    line-height:1;
    height:39px;
    padding:0 18px;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
    position:relative;
    overflow:hidden;
    isolation:isolate;
  }
  .download-btn::before{
    content:"";
    position:absolute;
    top:0; left:-60%;
    width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.22), transparent);
    transform:skewX(-20deg);
    animation:btnShimmer 3.2s ease-in-out infinite;
    z-index:-1;
  }
  @keyframes btnShimmer{ 0%{ left:-60%; } 35%,100%{ left:130%; } }
  .download-btn:hover{ background:var(--brass-dark); }
  .download-btn:active{ transform:scale(0.98); }
  .download-btn:disabled{ opacity:0.6; cursor:progress; }

  .export-wrap{ position:relative; }
  .export-menu{
    position:absolute;
    top:calc(100% + 6px);
    right:0;
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    box-shadow:0 10px 28px -10px rgba(28,36,48,0.3);
    min-width:170px;
    padding:6px;
    z-index:20;
    opacity:0;
    transform:translateY(-6px) scale(.98);
    pointer-events:none;
    transition:opacity .16s ease, transform .16s cubic-bezier(.16,1,.3,1);
  }
  .export-menu.show{ opacity:1; transform:none; pointer-events:auto; }
  .export-menu button:not(.download-btn){
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:9px 10px;
    border-radius:6px;
    transition:background .12s ease;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
  }
  .export-menu button:not(.download-btn):hover{ background:var(--paper); }

  .import-menu{
    width:380px;
    max-width:calc(100vw - 48px);
    max-height:70vh;
    overflow-y:auto;
    padding:16px;
  }

  .page-scaler{
    width:100%;
    max-width:816px;
    overflow:visible;
  }
  #resume-page{
    --r-scale: 1;
    width:816px;
    min-height:1056px;
    background:#fff;
    box-shadow:0 1px 3px rgba(28,36,48,0.08), 0 18px 40px -12px rgba(28,36,48,0.28);
    padding:58px 64px 70px;
    transform-origin:top left;
    font-family:'Inter',sans-serif;
    color:var(--resume-ink);
  }

  /* Resume content styles (prefixed r-). Font sizes and vertical spacing are
     driven by --r-scale (set by fitResumeToPage) so a long resume shrinks to
     fit a single page while the page padding above — the margin on every
     side — stays fixed. */
  .r-header{ margin-bottom:calc(16px * var(--r-scale)); }
  .r-name{
    font-size:calc(21px * var(--r-scale));
    font-weight:700;
    letter-spacing:0;
    margin:0 0 calc(3px * var(--r-scale));
    color:var(--resume-ink);
  }
  .r-title{
    font-size:calc(12px * var(--r-scale));
    font-weight:500;
    font-style:italic;
    color:var(--resume-slate);
    margin:0 0 calc(9px * var(--r-scale));
  }
  .r-contact{
    font-size:calc(11px * var(--r-scale));
    color:var(--resume-ink);
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:0;
  }
  .r-contact span{ display:inline-flex; align-items:center; gap:4px; }
  .r-contact span:not(:last-child)::after{
    content:"|";
    margin:0 8px;
    color:var(--resume-line);
  }
  .r-contact a{ color:var(--resume-ink); text-decoration:none; }
  .r-contact a:hover{ text-decoration:underline; }
  .r-summary{
    font-size:calc(12px * var(--r-scale));
    line-height:1.6;
    color:var(--resume-ink);
  }

  .r-section{ margin-top:calc(20px * var(--r-scale)); }
  .r-section-title{
    font-size:calc(13px * var(--r-scale));
    font-weight:700;
    letter-spacing:0;
    color:var(--resume-accent);
    padding-bottom:calc(4px * var(--r-scale));
    border-bottom:1px solid var(--resume-line);
    margin-bottom:calc(8px * var(--r-scale));
    break-after:avoid-page;
  }
  .r-entry{ margin-top:calc(11px * var(--r-scale)); break-inside:avoid-page; }
  .r-entry-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
  }
  .r-entry-role{ font-size:calc(12.5px * var(--r-scale)); font-weight:700; color:var(--resume-ink); }
  .r-entry-org{ font-weight:500; color:var(--resume-slate); }
  .r-entry-dates{
    font-size:calc(11px * var(--r-scale));
    color:var(--resume-slate);
    font-style:italic;
    white-space:nowrap;
    flex-shrink:0;
  }
  .r-entry-loc{ font-size:calc(11px * var(--r-scale)); color:var(--resume-slate); margin-top:1px; }
  .r-entry ul{
    margin:calc(5px * var(--r-scale)) 0 0;
    padding-left:0;
    list-style:none;
  }
  .r-entry ul li{
    position:relative;
    padding-left:14px;
    font-size:calc(11.5px * var(--r-scale));
    line-height:1.55;
    margin-bottom:calc(3px * var(--r-scale));
    color:var(--resume-ink);
  }
  .r-entry ul li::before{ content:"•"; position:absolute; left:0; color:var(--resume-accent); }
  .r-skills-list{
    margin:calc(6px * var(--r-scale)) 0 0;
    padding-left:0;
    list-style:none;
  }
  .r-skills-list li{
    position:relative;
    padding-left:14px;
    font-size:calc(11.5px * var(--r-scale));
    line-height:1.6;
    margin-bottom:calc(4px * var(--r-scale));
    color:var(--resume-ink);
    break-inside:avoid-page;
  }
  .r-skills-list li::before{ content:"•"; position:absolute; left:0; color:var(--resume-accent); }
  .r-empty{
    color:#B7BAC2;
    font-style:italic;
  }

  /* ---------- Templates ----------
     All four share the same markup from renderPreview(); only #resume-page's
     tpl-<name> class differs. Bold/Sidebar stay inset within the page's
     existing padding (no bleed to the page edge) so the same rules hold
     whether the content is captured on-screen for PDF/PNG export or run
     through an actual browser print. */
  .tpl-bold .r-header{
    background:linear-gradient(135deg, var(--resume-accent) 0%, #17307A 100%);
    color:#fff;
    padding:calc(18px * var(--r-scale)) calc(20px * var(--r-scale));
    border-radius:10px;
    margin-bottom:calc(20px * var(--r-scale));
  }
  .tpl-bold .r-name, .tpl-bold .r-title, .tpl-bold .r-contact, .tpl-bold .r-contact a{ color:#fff; }
  .tpl-bold .r-title{ color:rgba(255,255,255,0.82); }
  .tpl-bold .r-contact span:not(:last-child)::after{ color:rgba(255,255,255,0.4); }
  .tpl-bold .r-section-title{ color:var(--resume-ink); border-bottom:2px solid var(--resume-accent); }

  .tpl-minimal{ --resume-accent:#1F2937; }
  .tpl-minimal .r-section-title{ text-transform:uppercase; letter-spacing:0.07em; font-size:calc(11px * var(--r-scale)); }

  .tpl-sidebar .r-layout{ display:flex; gap:calc(22px * var(--r-scale)); }
  .tpl-sidebar .r-main{ flex:1; min-width:0; }
  .tpl-sidebar .r-side{
    flex:0 0 calc(180px * var(--r-scale));
    background:var(--resume-ink);
    color:#fff;
    padding:calc(18px * var(--r-scale));
    border-radius:8px;
  }
  .tpl-sidebar .r-side .r-header{ margin-bottom:calc(18px * var(--r-scale)); }
  .tpl-sidebar .r-side .r-name{ color:#fff; font-size:calc(17px * var(--r-scale)); }
  .tpl-sidebar .r-side .r-title{ color:rgba(255,255,255,0.75); }
  .tpl-sidebar .r-side .r-contact{ flex-direction:column; align-items:flex-start; gap:calc(6px * var(--r-scale)); color:#fff; }
  .tpl-sidebar .r-side .r-contact a{ color:#fff; }
  .tpl-sidebar .r-side .r-contact span:not(:last-child)::after{ content:none; }
  .tpl-sidebar .r-side .r-section-title{ color:#fff; border-bottom-color:rgba(255,255,255,0.25); }
  .tpl-sidebar .r-side .r-entry-role, .tpl-sidebar .r-side .r-entry-org,
  .tpl-sidebar .r-side .r-entry-dates, .tpl-sidebar .r-side .r-entry-loc,
  .tpl-sidebar .r-side .r-skills-list li{ color:rgba(255,255,255,0.92); }
  .tpl-sidebar .r-side .r-entry-top{ flex-direction:column; align-items:flex-start; gap:1px; }
  .tpl-sidebar .r-side .r-entry-dates{ font-size:calc(10px * var(--r-scale)); }
  .tpl-sidebar .r-side .r-skills-list li::before, .tpl-sidebar .r-side .r-entry ul li::before{ color:var(--brass-light); }

  .tpl-elegant .r-header{ position:relative; text-align:center; padding-bottom:calc(14px * var(--r-scale)); }
  .tpl-elegant .r-header::after{
    content:"";
    position:absolute; left:50%; bottom:0;
    transform:translateX(-50%);
    width:64px; height:2px;
    background:var(--resume-accent);
  }
  .tpl-elegant .r-name{ font-family:'Lora',serif; font-weight:700; font-size:calc(25px * var(--r-scale)); }
  .tpl-elegant .r-title{ font-family:'Lora',serif; font-style:italic; }
  .tpl-elegant .r-contact{ justify-content:center; }
  .tpl-elegant .r-section-title{
    font-family:'Lora',serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.06em;
    font-size:calc(11.5px * var(--r-scale));
    text-align:center;
    border-bottom:none;
  }
  .tpl-elegant .r-section-title::after{
    content:"";
    display:block;
    width:34px; height:2px;
    background:var(--resume-accent);
    margin:calc(5px * var(--r-scale)) auto 0;
  }
  .tpl-elegant .r-summary{ text-align:center; }

  .tpl-timeline .r-section .r-entry{
    position:relative;
    padding-left:calc(16px * var(--r-scale));
    margin-left:calc(4px * var(--r-scale));
    border-left:2px solid var(--resume-line);
  }
  .tpl-timeline .r-section .r-entry::before{
    content:"";
    position:absolute;
    left:calc(-5px * var(--r-scale)); top:calc(4px * var(--r-scale));
    width:8px; height:8px;
    border-radius:50%;
    background:var(--resume-accent);
    border:2px solid #fff;
  }
  .tpl-timeline .r-section .r-entry:last-child{ border-left-color:transparent; }

  .tpl-compact .r-section{ margin-top:calc(13px * var(--r-scale)); }
  .tpl-compact .r-entry{ margin-top:calc(7px * var(--r-scale)); }
  .tpl-compact .r-section-title{ margin-bottom:calc(5px * var(--r-scale)); padding-bottom:calc(2px * var(--r-scale)); }
  .tpl-compact .r-entry ul li, .tpl-compact .r-skills-list li{ line-height:1.4; margin-bottom:calc(2px * var(--r-scale)); }
  .tpl-compact .r-summary{ line-height:1.45; }
  .tpl-compact .r-header{ margin-bottom:calc(11px * var(--r-scale)); }

  /* ---------- Template picker thumbnails ---------- */
  .template-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .template-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 8px 12px;
    background:#fff;
    cursor:pointer;
    text-align:center;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .template-card:hover{ border-color:var(--brass); box-shadow:0 4px 14px -6px rgba(28,36,48,0.18); }
  .template-card.active{ border-color:var(--brass); background:rgba(47,111,237,0.06); }
  .template-card-name{ font-size:12px; font-weight:700; color:var(--ink); }
  .template-card-tag{ font-size:10.5px; color:var(--slate); }
  .tpl-thumb{
    width:56px; height:68px;
    border:1px solid var(--line);
    border-radius:4px;
    background:#fff;
    padding:6px;
    display:flex;
    flex-direction:column;
    gap:4px;
    flex-shrink:0;
  }
  .tpl-thumb .tt-bar{ height:6px; border-radius:1px; background:var(--brass); width:70%; }
  .tpl-thumb .tt-line{ height:3px; border-radius:1px; background:var(--line); }
  .tpl-thumb .tt-line.short{ width:60%; }
  .tpl-thumb-bold .tt-bar{ height:16px; width:100%; border-radius:2px; }
  .tpl-thumb-minimal .tt-bar{ background:var(--resume-ink); width:50%; }
  .tpl-thumb-sidebar{ flex-direction:row; gap:5px; }
  .tpl-thumb-sidebar .tt-side{ width:14px; background:var(--ink); border-radius:2px; }
  .tpl-thumb-sidebar .tt-body{ display:flex; flex-direction:column; gap:4px; flex:1; justify-content:center; }
  .tpl-thumb-elegant{ align-items:center; }
  .tpl-thumb-elegant .tt-bar{ width:44%; height:5px; }
  .tpl-thumb-elegant .tt-line{ width:75%; }
  .tpl-thumb-elegant .tt-line.short{ width:45%; }
  .tpl-thumb-timeline .tt-dot-row{ display:flex; align-items:center; gap:4px; }
  .tpl-thumb-timeline .tt-dot{ width:5px; height:5px; border-radius:50%; background:var(--brass); flex-shrink:0; }
  .tpl-thumb-timeline .tt-dot-row .tt-line{ flex:1; }
  .tpl-thumb-compact{ gap:2px; padding:5px; }
  .tpl-thumb-compact .tt-line{ height:2px; }

  /* ---------- Feature strip (above the app grid) ---------- */
  .feature-strip{
    background:var(--ink);
    color:rgba(255,255,255,0.92);
    display:flex;
    align-items:center;
    gap:22px;
    padding:9px 24px;
    font-size:12px;
    font-weight:600;
    overflow-x:auto;
    white-space:nowrap;
  }
  .feature-strip::-webkit-scrollbar{ display:none; }
  .feature-strip span{ display:inline-flex; align-items:center; gap:6px; flex-shrink:0; }
  .feature-strip b{ color:var(--brass-light); font-weight:700; }

  /* ---------- Export unlock modal ---------- */
  .unlock-modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(24,36,48,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:2000;
    padding:20px;
  }
  .unlock-modal-overlay.open{ display:flex; }
  .unlock-modal{
    background:#fff;
    border-radius:16px;
    padding:28px 24px 24px;
    width:400px;
    max-width:100%;
    max-height:85vh;
    overflow-y:auto;
    position:relative;
    box-shadow:0 24px 64px -14px rgba(28,36,48,0.4);
    animation:cardIn .22s cubic-bezier(.16,1,.3,1);
  }
  .unlock-modal h2{ margin:0 0 6px; font-size:17px; font-weight:800; color:var(--ink); }
  .github-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:#171515;
    color:#fff;
    border:none;
    border-radius:999px;
    height:40px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    margin-bottom:10px;
    transition:background .15s ease, transform .1s ease;
  }
  .github-btn:hover{ background:#2b2b2b; }
  .github-btn:active{ transform:scale(0.98); }
  .github-btn svg{ width:18px; height:18px; flex-shrink:0; }

  @media print{
    /* Margin lives on @page so it repeats on every printed page (matching
       the on-screen 58/64/70px padding) instead of only once around the
       whole flow — that's what kept a second page from getting the same
       side margins as the first.
       The editor panel is removed with display:none (not visibility:hidden)
       so it's taken out of layout entirely — visibility:hidden keeps its
       box's height reserved, which was silently padding out extra blank
       pages after the resume. */
    @page{ size: A4 portrait; margin: 15.3mm 16.9mm 18.5mm; }
    html, body{ background:#fff !important; }
    .feature-strip{ display:none !important; }
    .editor{ display:none !important; }
    .resize-handle{ display:none !important; }
    .preview-bar{ display:none !important; }
    .preview-pane{ padding:0; min-height:0; background:#fff; display:block; }
    .page-scaler{ width:auto; height:auto !important; }
    #resume-page{
      width:100%; min-height:0;
      padding:0;
      box-shadow:none;
      transform:none !important;
    }
  }
</style>
</head>

<script>
/* ================= STATE ================= */
let uid = 1;
const nextId = () => 'id' + (uid++);

let state = {
  personal: { fullName:'', title:'', email:'', phone:'', location:'', summary:'' },
  links: [],
  experience: [],
  education: [],
  certifications: [],
  awards: [],
  skills: [],
  projects: [],
  importText: '',
  template: 'classic'
};
try{
  const savedTemplate = localStorage.getItem('resumeBuilderTemplate');
  if(savedTemplate) state.template = savedTemplate;
}catch(e){}

const TEMPLATES = [
  { id:'classic', name:'Classic', tagline:'Most popular · single column' },
  { id:'bold', name:'Bold Header', tagline:'Bold & modern' },
  { id:'minimal', name:'Minimal', tagline:'Safest for ATS' },
  { id:'sidebar', name:'Sidebar', tagline:'Two-column' },
  { id:'elegant', name:'Elegant', tagline:'Editorial serif accent' },
  { id:'timeline', name:'Timeline', tagline:'Visual career timeline' },
  { id:'compact', name:'Compact', tagline:'Fits more in less space' },
];

const LINK_TYPES = ['LinkedIn','GitHub','Portfolio','Twitter / X','Behance','Dribbble','Website','Other'];

/* ================= TABS ================= */
const TABS = [
  { key:'personal', label:'Personal' },
  { key:'links', label:'Links' },
  { key:'experience', label:'Experience' },
  { key:'education', label:'Education' },
  { key:'certifications', label:'Certifications' },
  { key:'awards', label:'Awards' },
  { key:'skills', label:'Skills' },
  { key:'projects', label:'Projects' },
];
let activeTab = 'personal';

function tabHasContent(key){
  switch(key){
    case 'personal': return !!(state.personal.fullName || state.personal.title || state.personal.summary);
    case 'links': return state.links.some(l => l.url);
    case 'experience': return state.experience.length > 0;
    case 'education': return state.education.length > 0;
    case 'certifications': return state.certifications.length > 0;
    case 'awards': return state.awards.length > 0;
    case 'skills': return state.skills.some(c => c.items.length);
    case 'projects': return state.projects.length > 0;
    default: return false;
  }
}
function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = TABS.map(t => `
    <button class="tab ${t.key===activeTab?'active':''}" onclick="setTab('${t.key}')">${t.label}${tabHasContent(t.key) ? '<span class="tab-dot"></span>' : ''}</button>
  `).join('') + '<span class="tab-indicator" id="tabIndicator"></span>';
  positionTabIndicator();
}
function positionTabIndicator(){
  const tabs = document.getElementById('tabs');
  const indicator = document.getElementById('tabIndicator');
  const active = tabs.querySelector('.tab.active');
  if(!active || !indicator) return;
  indicator.style.width = (active.offsetWidth - 20) + 'px';
  indicator.style.transform = `translateX(${active.offsetLeft + 10}px)`;
}
window.addEventListener('resize', positionTabIndicator);
function setTab(key){
  activeTab = key;
  renderTabs();
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + key));
}

/* ================= PANEL RENDERERS ================= */
function renderPanels(){
  const el = document.getElementById('panels');
  el.innerHTML = `
    ${panelPersonal()}
    ${panelLinks()}
    ${panelExperience()}
    ${panelEducation()}
    ${panelCertifications()}
    ${panelAwards()}
    ${panelSkills()}
    ${panelProjects()}
  `;
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + activeTab));
}

function panelPersonal(){
  const p = state.personal;
  return `
  <div class="panel" id="panel-personal">
    <div class="field"><label>Full name</label>
      <input type="text" value="${esc(p.fullName)}" oninput="updatePersonal('fullName', this.value)" placeholder="Jordan Rivera" />
    </div>
    <div class="field"><label>Title / role</label>
      <input type="text" value="${esc(p.title)}" oninput="updatePersonal('title', this.value)" placeholder="Product Designer" />
    </div>
    <div class="row2">
      <div class="field"><label>Email</label>
        <input type="email" value="${esc(p.email)}" oninput="updatePersonal('email', this.value)" placeholder="jordan@email.com" />
      </div>
      <div class="field"><label>Phone</label>
        <input type="tel" value="${esc(p.phone)}" oninput="updatePersonal('phone', this.value)" placeholder="+91 90000 00000" />
      </div>
    </div>
    <div class="field"><label>Location</label>
      <input type="text" value="${esc(p.location)}" oninput="updatePersonal('location', this.value)" placeholder="Bengaluru, India" />
    </div>
    <div class="field"><label>Summary</label>
      <textarea oninput="updatePersonal('summary', this.value)" placeholder="A short 2–3 line pitch about you.">${esc(p.summary)}</textarea>
      <p class="hint">Wrap text in **double asterisks** to bold it on the resume, e.g. **6 years of experience**.</p>
    </div>
  </div>`;
}

function renderImportPanel(){
  const el = document.getElementById('importMenu');
  if(!el) return;
  el.innerHTML = `
    <p class="hint" style="margin-top:0;">Upload an existing resume and myresume will scan it section by section and auto-fill Personal, Links, Summary, Experience, Education, Skills, Certifications, Awards, and Projects — review each tab afterward.</p>
    <div class="field">
      <label>Upload a resume file</label>
      <input type="file" accept=".txt,.md,text/plain,.pdf,application/pdf,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" onchange="handleImportFile(event)" />
      <p class="hint" id="importStatus">Supports .pdf, .docx, and .txt/.md files. Old .doc files and images aren't auto-read — open those and paste the text below instead.</p>
    </div>
    <div class="field">
      <label>Or paste resume text</label>
      <textarea id="importTextarea" style="min-height:160px;" placeholder="Paste the full resume text here...">${esc(state.importText)}</textarea>
    </div>
    <button class="download-btn" style="width:100%;justify-content:center;height:auto;padding:11px 18px;" onclick="runImport()">↥ Import &amp; auto-fill</button>
    ${state.importText ? `<p class="hint">Already imported once — importing again will add any newly found entries without duplicating ones already on your resume.</p>` : ''}
  `;
}

function panelLinks(){
  return `
  <div class="panel" id="panel-links">
    ${state.links.map((l, i) => `
      <div class="card" style="animation-delay:${Math.min(i * 40, 200)}ms">
        <div class="card-head">
          <span>Link</span>
          <button class="remove-btn" onclick="removeItem('links','${l.id}')">Remove</button>
        </div>
        <div class="row2">
          <div class="field"><label>Type</label>
            <select onchange="updateListField('links','${l.id}','type', this.value)">
              ${LINK_TYPES.map(t => `<option value="${t}" ${t===l.type?'selected':''}>${t}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Label (shown on resume)</label>
            <input type="text" value="${esc(l.label)}" oninput="updateListField('links','${l.id}','label', this.value)" placeholder="e.g. linkedin.com/in/jordan" />
          </div>
        </div>
        <div class="field"><label>URL</label>
          <input type="url" value="${esc(l.url)}" oninput="updateListField('links','${l.id}','url', this.value)" placeholder="https://..." />
        </div>
      </div>
    `).join('')}
    <button class="add-btn" onclick="addLink()">+ Add a link</button>
    <p class="hint">Add as many as you need — LinkedIn, GitHub, portfolio, X/Twitter, or any custom URL.</p>
  </div>`;
}

function panelExperience(){
  return `
  <div class="panel" id="panel-experience">
    ${state.experience.map((x, i) => `
      <div class="card" style="animation-delay:${Math.min(i * 40, 200)}ms">
        <div class="card-head">
          <span>Experience</span>
          <button class="remove-btn" onclick="removeItem('experience','${x.id}')">Remove</button>
        </div>
        <div class="row2">
          <div class="field"><label>Role</label>
            <input type="text" value="${esc(x.role)}" oninput="updateListField('experience','${x.id}','role', this.value)" placeholder="Senior Designer" />
          </div>
          <div class="field"><label>Company</label>
            <input type="text" value="${esc(x.company)}" oninput="updateListField('experience','${x.id}','company', this.value)" placeholder="Acme Co." />
          </div>
        </div>
        <div class="row3">
          <div class="field"><label>Location</label>
            <input type="text" value="${esc(x.location)}" oninput="updateListField('experience','${x.id}','location', this.value)" placeholder="Remote" />
          </div>
          <div class="field"><label>Start</label>
            <input type="text" value="${esc(x.start)}" oninput="updateListField('experience','${x.id}','start', this.value)" placeholder="Jan 2022" />
          </div>
          <div class="field"><label>End</label>
            <input type="text" value="${esc(x.end)}" oninput="updateListField('experience','${x.id}','end', this.value)" placeholder="Present" />
          </div>
        </div>
        <div class="field"><label>Link (optional)</label>
          <input type="url" value="${esc(x.url)}" oninput="updateListField('experience','${x.id}','url', this.value)" placeholder="https://... (certificate, offer letter, company page, etc.)" />
        </div>
        <div class="bullets">
          <label style="display:block;font-size:11px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;">Highlights</label>
          ${x.bullets.map((b,i) => `
            <div class="bullet-row">
              <input type="text" value="${esc(b)}" oninput="updateBullet('${x.id}', ${i}, this.value)" placeholder="Led a redesign that improved conversion by 18%" />
              <button class="remove-btn" onclick="removeBullet('${x.id}', ${i})">✕</button>
            </div>
          `).join('')}
          <button class="add-btn small" onclick="addBullet('${x.id}')">+ Add highlight</button>
          <p class="hint" style="margin-top:-4px;">Wrap text in **double asterisks** to bold it, e.g. **improved conversion by 18%**.</p>
        </div>
      </div>
    `).join('')}
    <button class="add-btn" onclick="addExperience()">+ Add experience</button>
  </div>`;
}

function panelEducation(){
  return `
  <div class="panel" id="panel-education">
    ${state.education.map((e, i) => `
      <div class="card" style="animation-delay:${Math.min(i * 40, 200)}ms">
        <div class="card-head">
          <span>Education</span>
          <button class="remove-btn" onclick="removeItem('education','${e.id}')">Remove</button>
        </div>
        <div class="field"><label>School</label>

        </div>
        <div class="field"><label>Degree</label>
          <input type="text" value="${esc(e.degree)}" oninput="updateListField('education','${e.id}','degree', this.value)" placeholder="B.A. in Design" />
        </div>
        <div class="row3">
          <div class="field"><label>Location</label>
            <input type="text" value="${esc(e.location)}" oninput="updateListField('education','${e.id}','location', this.value)" placeholder="City" />
          </div>
          <div class="field"><label>Start</label>
            <input type="text" value="${esc(e.start)}" oninput="updateListField('education','${e.id}','start', this.value)" placeholder="2016" />
          </div>
          <div class="field"><label>End</label>
            <input type="text" value="${esc(e.end)}" oninput="updateListField('education','${e.id}','end', this.value)" placeholder="2020" />
          </div>
        </div>
        <div class="field"><label>Link (optional)</label>
          <input type="url" value="${esc(e.url)}" oninput="updateListField('education','${e.id}','url', this.value)" placeholder="https://... (degree certificate, transcript, etc.)" />
        </div>
      </div>
    `).join('')}
    <button class="add-btn" onclick="addEducation()">+ Add education</button>
  </div>`;
}

function panelCertifications(){
  return `
  <div class="panel" id="panel-certifications">
    ${state.certifications.map((c, i) => `
      <div class="card" style="animation-delay:${Math.min(i * 40, 200)}ms">
        <div class="card-head">
          <span>Certification</span>
          <button class="remove-btn" onclick="removeItem('certifications','${c.id}')">Remove</button>
        </div>
        <div class="row2">
          <div class="field"><label>Name</label>
            <input type="text" value="${esc(c.name)}" oninput="updateListField('certifications','${c.id}','name', this.value)" placeholder="AWS Certified Solutions Architect" />
          </div>
          <div class="field"><label>Issuer</label>
            <input type="text" value="${esc(c.issuer)}" oninput="updateListField('certifications','${c.id}','issuer', this.value)" placeholder="Amazon Web Services" />
          </div>
        </div>
        <div class="row2">

            <input type="text" value="${esc(c.date)}" oninput="updateListField('certifications','${c.id}','date', this.value)" placeholder="Mar 2024" />

          <div class="field"><label>Credential URL</label>
            <input type="url" value="${esc(c.url)}" oninput="updateListField('certifications','${c.id}','url', this.value)" placeholder="https://..." />
          </div>
        </div>
      </div>
    `).join('')}
    <button class="add-btn" onclick="addCertification()">+ Add certification</button>
    <p class="hint">Use this for any credential — include a verification link if you have one.</p>
  </div>`;
}

function panelAwards(){
  return `
  <div class="panel" id="panel-awards">
    ${state.awards.map((a, i) => `
      <div class="card" style="animation-delay:${Math.min(i * 40, 200)}ms">
        <div class="card-head">
          <span>Award</span>
          <button class="remove-btn" onclick="removeItem('awards','${a.id}')">Remove</button>
        </div>
        <div class="row2">
          <div class="field"><label>Name</label>
            <input type="text" value="${esc(a.name)}" oninput="updateListField('awards','${a.id}','name', this.value)" placeholder="Employee of the Year" />
          </div>
          <div class="field"><label>Presented by</label>
            <input type="text" value="${esc(a.issuer)}" oninput="updateListField('awards','${a.id}','issuer', this.value)" placeholder="Acme Co." />

        </div>

    `).join('')}
    <button class="add-btn" onclick="addAward()">+ Add award</button>
    <p class="hint">Any custom recognition — competitions, honors, scholarships — goes here.</p>
  </div>`;
}

function panelSkills(){
  return `
  <div class="panel" id="panel-skills">
    <div class="field">
      <label>Quick add a category</label>
      <div class="preset-pills">
        ${SKILL_PRESETS.map((p,i) => `<button type="button" class="preset-pill" onclick="addSkillCategoryFromPreset(${i})">+ ${esc(p.category)}</button>`).join('')}
      </div>
      <p class="hint">Click any of these to drop in a ready-made category — then edit or remove skills inside it to match you.</p>
