<style>
  :root{
    --ink:#182430;
    --paper:#F5F7FA;
    --panel:#FFFFFF;
    --brass:#2F6FED;
    --brass-dark:#1E54C7;
    --brass-light:#5B93F5;
    --accent-green:#1DAB79;
    --accent-green-dark:#157F59;
    --slate:#64748B;
    --line:#E2E8F0;
    --line-soft:#EDF1F6;
    --danger:#E0524B;
    --resume-ink:#1F2937;
    --resume-slate:#64748B;
    --resume-accent:#1D4ED8;
    --resume-line:#DDE3EC;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(47,111,237,0.25);}

  /* ---------- App shell ---------- */
  .app{
    display:grid;
    grid-template-columns: var(--editor-width, minmax(0, 1fr)) 6px minmax(0, 1fr);
    min-height:100vh;
  }
  @media (max-width: 980px){
    .app{ grid-template-columns: 1fr; }
    .resize-handle{ display:none; }
  }
  .resize-handle{
    cursor:col-resize;
    background:var(--line);
    position:relative;
    transition:background .15s ease;
  }
  .resize-handle:hover, .resize-handle.dragging{ background:var(--brass); }
  .resize-handle::after{
    content:"";
    position:absolute;
    top:0; bottom:0;
    left:-4px; right:-4px;
  }
  body.resizing-panel, body.resizing-panel *{ cursor:col-resize !important; user-select:none; }

  /* ---------- Left: Editor ---------- */
  .editor{
    background:var(--panel);
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-width:0;
  }
  .brand{
    padding:22px 28px 16px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .brand-mark{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-logo{
    display:block;
    height:34px;
    width:auto;
    animation:sealFloat 3.5s ease-in-out infinite;
  }
  @keyframes sealFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-3px); } }
  .brand p{
    display:flex;
    align-items:center;
    gap:6px;
    margin:5px 0 0;
    font-size:10.5px;
    font-weight:800;
    color:var(--brass-dark);
    letter-spacing:0.14em;
    text-transform:uppercase;
  }
  .brand p::before{
    content:"";
    width:14px;
    height:2px;
    flex-shrink:0;
    border-radius:2px;
    background:linear-gradient(90deg, var(--brass) 0%, var(--brass-light) 100%);
  }
  .brand-actions{
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:8px;
  }
  #authBtn{ max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex-shrink:0; }
  .icon-btn{
    border:1px solid var(--line);
    background:transparent;
    color:var(--slate);
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    font-weight:600;
    padding:7px 10px;
    border-radius:7px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .icon-btn:hover{ border-color:var(--brass); color:var(--brass-dark); background:rgba(47,111,237,0.06); }
  .icon-btn{ transition:border-color .15s ease, color .15s ease, background .15s ease, transform .1s ease; }
  .icon-btn:active{ transform:scale(0.96); }

  /* Tabs */
  .tabs{
    display:flex;
    gap:2px;
    padding:14px 28px 0;
    border-bottom:1px solid var(--line);
    overflow-x:auto;
    position:relative;
  }
  .tab{
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:600;
    color:var(--slate);
    background:none;
    border:none;
    padding:8px 12px 12px;
    cursor:pointer;
    position:relative;
    white-space:nowrap;
    letter-spacing:0.01em;
    transition:color .18s ease;
  }
  .tab:hover{ color:var(--ink); }
  .tab.active{ color:var(--ink); }
  .tab[data-section-key]{ cursor:grab; touch-action:none; }
  .tab.dragging{
    opacity:0.97; cursor:grabbing; color:var(--ink); position:relative; z-index:20;
    background:#fff; border-radius:7px;
    box-shadow:0 10px 22px -8px rgba(28,36,48,0.35), 0 2px 6px rgba(28,36,48,0.1);
    transition:box-shadow .12s ease;
  }
  .tab.drag-over{ box-shadow:inset 0 -2px 0 var(--brass); color:var(--ink); }
  .tab-dot{
    display:inline-block;
    width:5px; height:5px;
    border-radius:50%;
    background:var(--brass);
    margin-left:5px;
    vertical-align:middle;
  }
  .tab-indicator{
    position:absolute;
    left:0;
    top:auto;
    bottom:-1px;
    height:2px;
    background:var(--brass);
    border-radius:2px;
    transition:transform .28s cubic-bezier(.4,0,.2,1), width .28s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
  }

  .panels{
    flex:1;
    overflow-y:auto;
    padding:22px 28px 100px;
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  .panels::-webkit-scrollbar{ width:8px; }
  .panels::-webkit-scrollbar-track{ background:transparent; }
  .panels::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
  .panels::-webkit-scrollbar-thumb:hover{ background:var(--slate); }
  .app-footer{
    flex-shrink:0;
    padding:9px 28px;
    border-top:1px solid var(--line);
    font-size:11px;
    font-weight:700;
    color:var(--slate);
    text-align:center;
  }
  .panel{ display:none; }
  .panel.active{ display:block; animation:fade .3s cubic-bezier(.16,1,.3,1); }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  @keyframes cardIn{ from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:none;} }
  @keyframes chatIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  .toast-container{
    position:fixed;
    bottom:20px;
    right:20px;
    display:flex;
    flex-direction:column;
    gap:8px;
    z-index:9999;
    pointer-events:none;
  }
  .toast{
    background:var(--ink);
    color:#F5F7FA;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:600;
    padding:11px 16px;
    border-radius:8px;
    box-shadow:0 10px 28px -8px rgba(28,36,48,0.35);
    animation:toastIn .3s cubic-bezier(.16,1,.3,1);
    pointer-events:auto;
  }
  .toast.leaving{ animation:toastOut .22s ease forwards; }
  .toast.success{ background:var(--accent-green-dark); }
  .toast.error{ background:var(--danger); }
  @keyframes toastIn{ from{opacity:0; transform:translateY(12px) scale(.95);} to{opacity:1; transform:none;} }
  @keyframes toastOut{ from{opacity:1; transform:none;} to{opacity:0; transform:translateY(8px) scale(.95);} }

  /* ---------- Askme floating widget ---------- */
  .ai-widget{
    position:fixed;
    /* 90px, not 24px: platforms like Netlify inject their own "powered by"
       badge fixed to the exact bottom-right corner with an unbeatable
       z-index (~2147483645) — this clears it instead of fighting it. */
    bottom:90px;
    right:24px;
    z-index:500;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:14px;
    pointer-events:none;
  }
  .ai-fab{
    width:58px;
    height:58px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    pointer-events:auto;
    background:linear-gradient(135deg, var(--brass) 0%, var(--ink) 130%);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 10px 30px -8px rgba(28,36,48,0.5);
    position:relative;
    transition:transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
  }
  .ai-fab:hover{ transform:scale(1.08); box-shadow:0 14px 36px -8px rgba(28,36,48,0.6); }
  .ai-fab:active{ transform:scale(0.94); }
  .ai-fab-icon{ display:flex; filter:drop-shadow(0 1px 2px rgba(0,0,0,0.25)); }
  .ai-fab-icon svg{ width:26px; height:26px; }

  .ai-panel{
    width:380px;
    max-width:calc(100vw - 48px);
    max-height:min(600px, calc(100vh - 120px));
    background:#fff;
    border-radius:16px;
    box-shadow:0 24px 64px -14px rgba(28,36,48,0.4);
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    opacity:0;
    transform:translateY(16px) scale(.96);
    pointer-events:none;
    transition:opacity .22s ease, transform .22s cubic-bezier(.16,1,.3,1);
    transform-origin:bottom right;
  }
  .ai-panel.open{ opacity:1; transform:none; pointer-events:auto; }
  .ai-panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    background:linear-gradient(135deg, var(--ink) 0%, #223247 100%);
    color:#fff;
    flex-shrink:0;
  }
  .ai-panel-header-info{ display:flex; align-items:center; gap:10px; }
  .ai-avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--brass) 0%, var(--brass-light) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
  }
  .ai-avatar svg{ width:17px; height:17px; }
  .ai-panel-title{ font-size:14px; font-weight:700; line-height:1.3; }
  .ai-panel-status{
    font-size:10.5px;
    color:rgba(255,255,255,0.65);
    display:flex;
    align-items:center;
    gap:5px;
    margin-top:2px;
  }
  .ai-status-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#4ADE80;
    box-shadow:0 0 0 3px rgba(74,222,128,0.2);
  }
  .ai-panel-close{
    background:none;
    border:none;
    color:#fff;
    opacity:.7;
    cursor:pointer;
    font-size:14px;
    padding:4px;
    transition:opacity .15s ease;
  }
  .ai-panel-close:hover{ opacity:1; }
  .ai-panel-body{
    padding:14px 16px;
    overflow-y:auto;
    flex:1;
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  .ai-panel-body::-webkit-scrollbar{ width:8px; }
  .ai-panel-body::-webkit-scrollbar-track{ background:transparent; }
  .ai-panel-body::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }

  /* ---------- ATS score ---------- */
  .ats-score-badge{
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#FEFEFC;
    margin-bottom:14px;
    animation:cardIn .22s cubic-bezier(.16,1,.3,1);
  }
  .ats-score-circle{
    width:64px;
    height:64px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    font-family:'Inter',sans-serif;
    font-weight:800;
    font-size:20px;
    color:#fff;
    transition:background .3s ease;
  }
  .ats-score-title{ font-size:14px; font-weight:700; color:var(--ink); margin-bottom:2px; }
  .ats-score-label{ font-size:11.5px; color:var(--slate); line-height:1.5; }
  .ats-check-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line-soft);
    animation:cardIn .2s cubic-bezier(.16,1,.3,1) backwards;
  }
  .ats-check-row:last-child{ border-bottom:none; }
  .ats-check-icon{
    flex-shrink:0;
    width:19px;
    height:19px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10.5px;
    font-weight:700;
    color:#fff;
    margin-top:1px;
  }
  .ats-check-icon.pass{ background:var(--accent-green-dark); }
  .ats-check-icon.warn{ background:#C08A2E; }
  .ats-check-icon.fail{ background:var(--danger); }
  .ats-check-label{ font-size:12.5px; font-weight:600; color:var(--ink); }
  .ats-check-detail{ font-size:11.5px; color:var(--slate); margin-top:2px; line-height:1.4; }
  /* #atsAiBtn (id, not just .ats-ai-btn) — needs to out-specificity the
     surrounding ".export-menu button:not(.download-btn)" rule, which would
     otherwise flatten this back to a plain transparent menu-item button. */
  #atsAiBtn.ats-ai-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    border:none;
    background:linear-gradient(135deg, var(--brass) 0%, var(--brass-dark) 100%);
    color:#fff;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.01em;
    padding:11px;
    border-radius:8px;
    cursor:pointer;
    margin-top:8px;
    margin-bottom:18px;
    box-shadow:0 4px 14px -4px rgba(47,111,237,0.5);
    transition:box-shadow .15s ease, transform .1s ease, filter .15s ease;
  }
  #atsAiBtn.ats-ai-btn svg{ flex-shrink:0; }
  #atsAiBtn.ats-ai-btn:hover{ filter:brightness(1.06); box-shadow:0 6px 18px -4px rgba(47,111,237,0.6); }
  #atsAiBtn.ats-ai-btn:active{ transform:scale(0.98); }
  #atsAiBtn.ats-ai-btn:disabled{ opacity:0.72; cursor:default; box-shadow:none; filter:none; }
  .ats-suggestion-list{ margin:8px 0 0; padding-left:18px; }
  .ats-suggestion-list li{ font-size:12.5px; line-height:1.55; margin-bottom:6px; color:var(--ink); }
  .ats-skill-pill{
    display:inline-block;
    background:#fff;
    border:1px solid var(--line);
    color:var(--ink);
    font-size:11.5px;
    font-weight:600;
    padding:5px 11px;
    border-radius:16px;
    margin:0 6px 6px 0;
  }

  .photo-upload-row{ display:flex; align-items:center; gap:14px; }
  .photo-preview{
    width:64px; height:64px; border-radius:50%; overflow:hidden; flex-shrink:0;
    background:var(--paper); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }
  .photo-preview img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-preview-placeholder{ font-size:22px; color:var(--slate); line-height:1; }
  .photo-upload-actions{ display:flex; flex-direction:column; gap:6px; align-items:flex-start; min-width:0; }
  .photo-upload-actions input[type=file]{ font-size:11.5px; max-width:230px; color:var(--slate); }

  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:11px;
    font-weight:600;
    color:var(--slate);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:6px;
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }

  input[type=text], input[type=email], input[type=tel], input[type=url], input[type=month], textarea, select{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:7px;
    padding:9px 11px;
    outline:none;
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  input:focus, textarea:focus, select:focus{
    border-color:var(--brass);
    background:#fff;
    box-shadow:0 0 0 3px rgba(47,111,237,0.12);
  }
  textarea{ resize:vertical; min-height:70px; line-height:1.5; }
  select{ appearance:none; background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="%235B6472"><path d="M5.5 7.5l4.5 4.5 4.5-4.5"/></svg>'); background-repeat:no-repeat; background-position:right 10px center; background-size:14px; padding-right:30px; }

  .card{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 16px 6px;
    margin-bottom:14px;
    background:#FEFEFC;
    position:relative;
    cursor:grab;
    transition:box-shadow .18s ease, border-color .18s ease, opacity .15s ease, transform .15s ease;
    animation:cardIn .22s cubic-bezier(.16,1,.3,1) backwards;
  }
  .card:hover{ border-color:var(--brass); box-shadow:0 2px 12px -4px rgba(28,36,48,0.12); }
  .card:active{ cursor:grabbing; }
  .card.dragging{
    opacity:0.98; cursor:grabbing; border-color:var(--brass); z-index:20;
    box-shadow:0 20px 38px -12px rgba(28,36,48,0.35), 0 3px 10px rgba(28,36,48,0.12);
    transition:box-shadow .12s ease, border-color .12s ease;
    will-change:transform;
  }
  .card.drag-over{ border-color:var(--brass); box-shadow:0 0 0 2px rgba(47,111,237,0.28) inset, 0 2px 12px -4px rgba(28,36,48,0.12); }
  .card-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
  }
  .card-head span{
    font-size:11px;
    font-weight:700;
    color:var(--brass-dark);
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  .card input, .card select, .card textarea, .card button{ cursor:auto; }
  .card select{ cursor:pointer; }
  .card button{ cursor:pointer; }
  .remove-btn{
    border:none;
    background:none;
    color:var(--slate);
    cursor:pointer;
    font-size:12px;
    font-weight:600;
    padding:4px 6px;
    border-radius:5px;
    transition:color .15s ease, background .15s ease;
  }
  .remove-btn:hover{ color:var(--danger); background:rgba(180,72,59,0.08); }

  .bullets{ margin:8px 0 4px; }
  .bullet-row{ display:flex; gap:8px; margin-bottom:8px; align-items:flex-start; }
  .bullet-row input{ flex:1; }

  .chip-input-wrap{

  .hint{ font-size:11px; color:var(--slate); margin-top:6px; }

  .chat-box{
    max-height:360px;
    overflow-y:auto;

    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .chat-msg{ display:flex; align-items:flex-end; gap:7px; animation:chatIn .22s cubic-bezier(.16,1,.3,1); }
  .chat-msg.user{ justify-content:flex-end; }
  .chat-msg.assistant{ justify-content:flex-start; }
  .chat-avatar{
    width:24px;
    height:24px;
    border-radius:50%;

  .chat-avatar.bot{ background:linear-gradient(135deg, var(--brass) 0%, var(--brass-light) 100%); color:#fff; }
  .chat-avatar.user{ background:var(--ink); color:#fff; font-weight:700; }
  .chat-bubble{
    max-width:74%;
    padding:10px 14px;
    border-radius:16px;
    font-size:13px;
    line-height:1.5;
    white-space:pre-wrap;
    transition:transform .12s ease;
  }
  .chat-msg.user .chat-bubble{ background:linear-gradient(135deg, var(--ink) 0%, #223247 100%); color:#fff; border-bottom-right-radius:4px; }
  .chat-msg.assistant .chat-bubble{ background:var(--line-soft); color:var(--ink); border-bottom-left-radius:4px; }
  .chat-typing{ display:flex; align-items:center; gap:4px; padding:13px 16px !important; }
  .chat-typing span{ width:6px; height:6px; border-radius:50%; background:var(--slate); animation:typingBounce 1.2s ease-in-out infinite; }
  .chat-typing span:nth-child(2){ animation-delay:.15s; }
  .chat-typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes typingBounce{ 0%,60%,100%{ transform:translateY(0); opacity:.5; } 30%{ transform:translateY(-4px); opacity:1; } }
  .chat-input-row{
    display:flex;
    align-items:flex-end;
    gap:6px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:22px;
    padding:5px 5px 5px 15px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .chat-input-row:focus-within{ border-color:var(--brass); box-shadow:0 0 0 3px rgba(47,111,237,0.12); }
  .chat-input-row textarea{
    flex:1;
    border:none !important;
    background:none !important;
    box-shadow:none !important;
    min-height:22px;
    max-height:90px;
    padding:8px 0;
  }
  .chat-send-btn{
    width:34px;
    height:34px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg, var(--brass) 0%, var(--ink) 130%);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), opacity .15s ease;
  }
  .chat-send-btn svg{ width:15px; height:15px; margin-left:-1px; }
  .chat-send-btn:hover:not(:disabled){ transform:scale(1.08); }
  .chat-send-btn:active:not(:disabled){ transform:scale(0.92); }
  .chat-send-btn:disabled{ opacity:.35; cursor:default; }
  .chat-box::-webkit-scrollbar{ width:8px; }
  .chat-box::-webkit-scrollbar-track{ background:transparent; }
  .chat-box::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
  .chat-box::-webkit-scrollbar-thumb:hover{ background:var(--slate); }

  .preset-pills{ display:flex; flex-wrap:wrap; gap:7px; }
  .preset-pill{
    border:1px dashed var(--line);
    background:#fff;
    color:var(--slate);
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    font-weight:600;
    padding:6px 11px;
    border-radius:16px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease, transform .1s ease;
  }
  .preset-pill:hover{ border-color:var(--brass); color:var(--brass-dark); background:rgba(47,111,237,0.06); }
  .preset-pill:active{ transform:scale(0.96); }

  /* ---------- Right: Preview ---------- */
  .preview-pane{
    background:#EAEFF6;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 24px 60px;
    min-height:100vh;
  }
  .preview-bar{
    width:100%;
    max-width:816px;
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:center;
    row-gap:10px;
    margin-bottom:16px;
  }
  .preview-bar-label{
    font-size:11.5px;
    color:var(--slate);
    letter-spacing:0.04em;
    text-transform:uppercase;
    font-weight:600;
    white-space:nowrap;
    flex-shrink:0;
  }
  .preview-bar-actions{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
  }
  .download-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    white-space:nowrap;
    background:var(--ink);
    color:#F5F7FA;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:13px;
    line-height:1;
    height:39px;
    padding:0 16px;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
    position:relative;
    overflow:hidden;
    isolation:isolate;
  }
  .btn-icon{ width:15px; height:15px; flex-shrink:0; }
  .btn-chevron{ width:11px; height:11px; flex-shrink:0; opacity:0.75; }
  .download-btn::before{
    content:"";
    position:absolute;
    top:0; left:-60%;
    width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.22), transparent);
    transform:skewX(-20deg);
    animation:btnShimmer 3.2s ease-in-out infinite;
    z-index:-1;
  }
  @keyframes btnShimmer{ 0%{ left:-60%; } 35%,100%{ left:130%; } }
  .download-btn:hover{ background:var(--brass-dark); }
  .download-btn:active{ transform:scale(0.98); }
  .download-btn:disabled{ opacity:0.6; cursor:progress; }
  .info-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:15px;
    height:15px;
    flex-shrink:0;
    border-radius:50%;
    background:rgba(255,255,255,0.2);
    color:#F5F7FA;
    font-size:10px;
    font-weight:700;
    line-height:1;
    cursor:help;
    transition:background .15s ease;
  }
  .info-badge:hover{ background:rgba(255,255,255,0.36); }

  .export-wrap{ position:relative; }
  .export-menu{
    position:absolute;
    top:calc(100% + 6px);
    right:0;
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    box-shadow:0 10px 28px -10px rgba(28,36,48,0.3);
    min-width:170px;
    padding:6px;
    z-index:20;
    opacity:0;
    transform:translateY(-6px) scale(.98);
    pointer-events:none;
    transition:opacity .16s ease, transform .16s cubic-bezier(.16,1,.3,1);
  }
  .export-menu.show{ opacity:1; transform:none; pointer-events:auto; }
  .export-menu button:not(.download-btn){
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:9px 10px;
    border-radius:6px;
    transition:background .12s ease;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
  }
  .export-menu button:not(.download-btn):hover{ background:var(--paper); }

  .import-menu{
    width:380px;
    max-width:calc(100vw - 48px);
    max-height:70vh;
    overflow-y:auto;
    padding:16px;
  }

  .page-scaler{
    width:100%;
    max-width:816px;
    overflow:visible;
  }
  #resume-page{
    --r-scale: 1;
    width:816px;
    min-height:1056px;
    background:#fff;
    box-shadow:0 1px 3px rgba(28,36,48,0.08), 0 18px 40px -12px rgba(28,36,48,0.28);
    padding:58px 64px 70px;
    transform-origin:top left;
    font-family:'Inter',sans-serif;
    color:var(--resume-ink);
  }

  /* Resume content styles (prefixed r-). Font sizes and vertical spacing are
     driven by --r-scale (set by fitResumeToPage) so a long resume shrinks to
     fit a single page while the page padding above — the margin on every
     side — stays fixed. */
  .r-header{ margin-bottom:calc(16px * var(--r-scale)); }
  .r-header.has-photo{ display:flex; align-items:center; gap:calc(16px * var(--r-scale)); }
  .r-header.has-photo .r-header-text{ flex:1; min-width:0; }
  .r-photo{
    width:calc(70px * var(--r-scale));
    height:calc(70px * var(--r-scale));
    border-radius:50%;
    object-fit:cover;
    flex-shrink:0;
    border:2px solid var(--resume-line);
    background:#fff;
  }
  .r-name{
    font-size:calc(21px * var(--r-scale));
    font-weight:700;
    letter-spacing:0;
    margin:0 0 calc(3px * var(--r-scale));
    color:var(--resume-ink);
  }
  .r-title{
    font-size:calc(12px * var(--r-scale));
    font-weight:500;
    font-style:italic;
    color:var(--resume-slate);
    margin:0 0 calc(9px * var(--r-scale));
  }
  .r-contact{
    font-size:calc(11px * var(--r-scale));
    color:var(--resume-ink);
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:0;
  }
  .r-contact span{ display:inline-flex; align-items:center; gap:4px; }
  .r-contact span:not(:last-child)::after{
    content:"|";
    margin:0 8px;
    color:var(--resume-line);
  }
  .r-contact a{ color:var(--resume-ink); text-decoration:none; }
  .r-contact a:hover{ text-decoration:underline; }
  .r-summary{
    font-size:calc(12px * var(--r-scale));
    line-height:1.6;
    color:var(--resume-ink);
  }

  .r-section{ margin-top:calc(20px * var(--r-scale)); }
  .r-section-title{
    font-size:calc(13px * var(--r-scale));
    font-weight:700;
    letter-spacing:0;
    color:var(--resume-accent);
    padding-bottom:calc(4px * var(--r-scale));
    border-bottom:1px solid var(--resume-line);
    margin-bottom:calc(8px * var(--r-scale));
    break-after:avoid-page;
  }
  /* Section heading case is a user choice (see the Template menu), applied
     on top of whatever the active template's own default is — the #id gives
     these enough specificity to win over e.g. tpl-minimal/tpl-elegant's own
     hardcoded uppercase, so the choice is consistent across every template
     rather than silently overridden by some of them. */
  #resume-page.heading-upper .r-section-title{ text-transform:uppercase; letter-spacing:0.04em; }
  #resume-page.heading-title .r-section-title{ text-transform:none; letter-spacing:0; }
  .r-entry{ margin-top:calc(11px * var(--r-scale)); break-inside:avoid-page; }
  .r-entry-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
  }
  .r-entry-role{ font-size:calc(12.5px * var(--r-scale)); font-weight:700; color:var(--resume-ink); }
  .r-entry-org{ font-weight:500; color:var(--resume-slate); }
  .r-entry-dates{
    font-size:calc(11px * var(--r-scale));
    color:var(--resume-slate);
    font-style:italic;
    white-space:nowrap;
    flex-shrink:0;
  }
  .r-entry-loc{ font-size:calc(11px * var(--r-scale)); color:var(--resume-slate); margin-top:1px; }
  .r-entry ul{
    margin:calc(5px * var(--r-scale)) 0 0;
    padding-left:0;
    list-style:none;
  }
  .r-entry ul li{
    position:relative;
    padding-left:14px;
    font-size:calc(11.5px * var(--r-scale));
    line-height:1.55;
    margin-bottom:calc(3px * var(--r-scale));
    color:var(--resume-ink);
  }
  .r-entry ul li::before{ content:"•"; position:absolute; left:0; color:var(--resume-accent); }
  .r-skills-list{
    margin:calc(6px * var(--r-scale)) 0 0;
    padding-left:0;
    list-style:none;
  }
  .r-skills-list li{
    position:relative;
    padding-left:14px;
    font-size:calc(11.5px * var(--r-scale));
    line-height:1.6;
    margin-bottom:calc(4px * var(--r-scale));
    color:var(--resume-ink);
    break-inside:avoid-page;
  }
  .r-skills-list li::before{ content:"•"; position:absolute; left:0; color:var(--resume-accent); }
  .r-empty{
    color:#B7BAC2;
    font-style:italic;
  }

  /* ---------- Templates ----------
     All four share the same markup from renderPreview(); only #resume-page's
     tpl-<name> class differs. Bold/Sidebar stay inset within the page's
     existing padding (no bleed to the page edge) so the same rules hold
     whether the content is captured on-screen for PDF/PNG export or run
     through an actual browser print. */
  .tpl-bold .r-header{
    background:linear-gradient(135deg, var(--resume-accent) 0%, #17307A 100%);
    color:#fff;
    padding:calc(18px * var(--r-scale)) calc(20px * var(--r-scale));
    border-radius:10px;
    margin-bottom:calc(20px * var(--r-scale));
  }
  .tpl-bold .r-name, .tpl-bold .r-title, .tpl-bold .r-contact, .tpl-bold .r-contact a{ color:#fff; }
  .tpl-bold .r-title{ color:rgba(255,255,255,0.82); }
  .tpl-bold .r-contact span:not(:last-child)::after{ color:rgba(255,255,255,0.4); }
  .tpl-bold .r-photo{ border-color:rgba(255,255,255,0.55); }
  .tpl-bold .r-section-title{ color:var(--resume-ink); border-bottom:2px solid var(--resume-accent); }

  .tpl-minimal{ --resume-accent:#1F2937; }
  .tpl-minimal .r-section-title{ text-transform:uppercase; letter-spacing:0.07em; font-size:calc(11px * var(--r-scale)); }

  .tpl-sidebar .r-layout{ display:flex; gap:calc(22px * var(--r-scale)); }
  .tpl-sidebar .r-main{ flex:1; min-width:0; }
  .tpl-sidebar .r-side{
    flex:0 0 calc(180px * var(--r-scale));
    background:var(--resume-ink);
    color:#fff;
    padding:calc(18px * var(--r-scale));
    border-radius:8px;
  }
  .tpl-sidebar .r-side .r-header{ margin-bottom:calc(18px * var(--r-scale)); }
  .tpl-sidebar .r-side .r-header.has-photo{ flex-direction:column; align-items:center; text-align:center; }
  .tpl-sidebar .r-side .r-photo{ border-color:rgba(255,255,255,0.4); }
  .tpl-sidebar .r-side .r-name{ color:#fff; font-size:calc(17px * var(--r-scale)); }
  .tpl-sidebar .r-side .r-title{ color:rgba(255,255,255,0.75); }
  .tpl-sidebar .r-side .r-contact{ flex-direction:column; align-items:flex-start; gap:calc(6px * var(--r-scale)); color:#fff; }
  .tpl-sidebar .r-side .r-contact a{ color:#fff; }
  .tpl-sidebar .r-side .r-contact span:not(:last-child)::after{ content:none; }
  .tpl-sidebar .r-side .r-section-title{ color:#fff; border-bottom-color:rgba(255,255,255,0.25); }
  .tpl-sidebar .r-side .r-entry-role, .tpl-sidebar .r-side .r-entry-org,
  .tpl-sidebar .r-side .r-entry-dates, .tpl-sidebar .r-side .r-entry-loc,
  .tpl-sidebar .r-side .r-skills-list li{ color:rgba(255,255,255,0.92); }
  .tpl-sidebar .r-side .r-entry-top{ flex-direction:column; align-items:flex-start; gap:1px; }
  .tpl-sidebar .r-side .r-entry-dates{ font-size:calc(10px * var(--r-scale)); }
  .tpl-sidebar .r-side .r-skills-list li::before, .tpl-sidebar .r-side .r-entry ul li::before{ color:var(--brass-light); }

  .tpl-elegant .r-header{ position:relative; text-align:center; padding-bottom:calc(14px * var(--r-scale)); }
  .tpl-elegant .r-header::after{
    content:"";
    position:absolute; left:50%; bottom:0;
    transform:translateX(-50%);
    width:64px; height:2px;
    background:var(--resume-accent);
  }
  .tpl-elegant .r-header.has-photo{ flex-direction:column; align-items:center; gap:calc(10px * var(--r-scale)); }
  .tpl-elegant .r-name{ font-family:'Lora',serif; font-weight:700; font-size:calc(25px * var(--r-scale)); }
  .tpl-elegant .r-title{ font-family:'Lora',serif; font-style:italic; }
  .tpl-elegant .r-contact{ justify-content:center; }
  .tpl-elegant .r-section-title{
    font-family:'Lora',serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.06em;
    font-size:calc(11.5px * var(--r-scale));
    text-align:center;
    border-bottom:none;
  }
  .tpl-elegant .r-section-title::after{
    content:"";
    display:block;
    width:34px; height:2px;
    background:var(--resume-accent);
    margin:calc(5px * var(--r-scale)) auto 0;
  }
  .tpl-elegant .r-summary{ text-align:center; }

  .tpl-timeline .r-section .r-entry{
    position:relative;
    padding-left:calc(16px * var(--r-scale));
    margin-left:calc(4px * var(--r-scale));
    border-left:2px solid var(--resume-line);
  }
  .tpl-timeline .r-section .r-entry::before{
    content:"";
    position:absolute;
    left:calc(-5px * var(--r-scale)); top:calc(4px * var(--r-scale));
    width:8px; height:8px;
    border-radius:50%;
    background:var(--resume-accent);
    border:2px solid #fff;
  }
  .tpl-timeline .r-section .r-entry:last-child{ border-left-color:transparent; }

  .tpl-compact .r-section{ margin-top:calc(13px * var(--r-scale)); }
  .tpl-compact .r-entry{ margin-top:calc(7px * var(--r-scale)); }
  .tpl-compact .r-section-title{ margin-bottom:calc(5px * var(--r-scale)); padding-bottom:calc(2px * var(--r-scale)); }
  .tpl-compact .r-entry ul li, .tpl-compact .r-skills-list li{ line-height:1.4; margin-bottom:calc(2px * var(--r-scale)); }
  .tpl-compact .r-summary{ line-height:1.45; }
  .tpl-compact .r-header{ margin-bottom:calc(11px * var(--r-scale)); }

  /* ---------- Template picker thumbnails ---------- */
  .template-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .template-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 8px 12px;
    background:#fff;

    text-align:center;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .template-card:hover{ border-color:var(--brass); box-shadow:0 4px 14px -6px rgba(28,36,48,0.18); }
  .template-card.active{ border-color:var(--brass); background:rgba(47,111,237,0.06); }
  .template-card-name{ font-size:12px; font-weight:700; color:var(--ink); }
  .template-card-tag{ font-size:10.5px; color:var(--slate); }
  .heading-case-toggle{ display:flex; flex-direction:column; gap:8px; }
  .heading-case-btn{
    width:100%;
    text-align:left;
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 11px;
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .heading-case-btn:hover{ border-color:var(--brass); box-shadow:0 4px 14px -6px rgba(28,36,48,0.18); }
  .heading-case-btn.active{ border-color:var(--brass); background:rgba(47,111,237,0.06); color:var(--brass-dark); }
  .heading-case-btn.upper{ text-transform:uppercase; letter-spacing:0.04em; }
  .tpl-thumb{
    width:56px; height:68px;
    border:1px solid var(--line);
    border-radius:4px;
    background:#fff;
    padding:6px;
    display:flex;
    flex-direction:column;
    gap:4px;
    flex-shrink:0;
  }
  .tpl-thumb .tt-bar{ height:6px; border-radius:1px; background:var(--brass); width:70%; }
  .tpl-thumb .tt-line{ height:3px; border-radius:1px; background:var(--line); }
  .tpl-thumb .tt-line.short{ width:60%; }
  .tpl-thumb-bold .tt-bar{ height:16px; width:100%; border-radius:2px; }
  .tpl-thumb-minimal .tt-bar{ background:var(--resume-ink); width:50%; }
  .tpl-thumb-sidebar{ flex-direction:row; gap:5px; }
  .tpl-thumb-sidebar .tt-side{ width:14px; background:var(--ink); border-radius:2px; }
  .tpl-thumb-sidebar .tt-body{ display:flex; flex-direction:column; gap:4px; flex:1; justify-content:center; }
  .tpl-thumb-elegant{ align-items:center; }
  .tpl-thumb-elegant .tt-bar{ width:44%; height:5px; }
  .tpl-thumb-elegant .tt-line{ width:75%; }
  .tpl-thumb-elegant .tt-line.short{ width:45%; }
  .tpl-thumb-timeline .tt-dot-row{ display:flex; align-items:center; gap:4px; }
  .tpl-thumb-timeline .tt-dot{ width:5px; height:5px; border-radius:50%; background:var(--brass); flex-shrink:0; }
  .tpl-thumb-timeline .tt-dot-row .tt-line{ flex:1; }
  .tpl-thumb-compact{ gap:2px; padding:5px; }
  .tpl-thumb-compact .tt-line{ height:2px; }

  /* ---------- Feature strip (above the app grid) ---------- */
  .feature-strip{
    background:var(--ink);
    color:rgba(255,255,255,0.92);
    display:flex;
    align-items:center;
    gap:22px;
    padding:9px 24px;
    font-size:12px;
    font-weight:600;
    overflow-x:auto;
    white-space:nowrap;
  }
  .feature-strip::-webkit-scrollbar{ display:none; }
  .feature-strip span{ display:inline-flex; align-items:center; gap:6px; flex-shrink:0; }
  .feature-strip b{ display:inline-flex; color:var(--brass-light); font-weight:700; }
  .feature-strip b svg{ width:14px; height:14px; flex-shrink:0; }

  /* ---------- Export unlock modal ---------- */
  .unlock-modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(24,36,48,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:2000;
    padding:20px;
  }
  .unlock-modal-overlay.open{ display:flex; }
  .unlock-modal{
    background:#fff;
    border-radius:16px;
    padding:28px 24px 24px;
    width:400px;
    max-width:100%;
    max-height:85vh;
    overflow-y:auto;
    position:relative;
    box-shadow:0 24px 64px -14px rgba(28,36,48,0.4);
    animation:cardIn .22s cubic-bezier(.16,1,.3,1);
  }
  .unlock-modal h2{ margin:0 0 6px; font-size:17px; font-weight:800; color:var(--ink); }
  .github-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:#171515;
    color:#fff;
    border:none;
    border-radius:999px;
    height:40px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    margin-bottom:10px;
    transition:background .15s ease, transform .1s ease;
  }
  .github-btn:hover{ background:#2b2b2b; }
  .github-btn:active{ transform:scale(0.98); }
  .github-btn svg{ width:18px; height:18px; flex-shrink:0; }

  @media print{
    /* Margin lives on @page so it repeats on every printed page (matching
       the on-screen 58/64/70px padding) instead of only once around the
       whole flow — that's what kept a second page from getting the same
       side margins as the first.
       The editor panel is removed with display:none (not visibility:hidden)
       so it's taken out of layout entirely — visibility:hidden keeps its
       box's height reserved, which was silently padding out extra blank
       pages after the resume. */
    @page{ size: A4 portrait; margin: 15.3mm 16.9mm 18.5mm; }
    html, body{ background:#fff !important; }
    .feature-strip{ display:none !important; }
    .editor{ display:none !important; }
    .resize-handle{ display:none !important; }
    .preview-bar{ display:none !important; }
    .preview-pane{ padding:0; min-height:0; background:#fff; display:block; }
    .page-scaler{ width:auto; height:auto !important; }
    #resume-page{
      width:100%; min-height:0;
      padding:0;
      box-shadow:none;
      transform:none !important;
    }
  }
</style>
</head>

<script>
/* ================= STATE ================= */
let uid = 1;
const nextId = () => 'id' + (uid++);

/* Default order the reorderable resume sections render in — dragging a
   section's tab (see TABS/handleTabDrop below) rewrites this per-resume. */
const DEFAULT_SECTION_ORDER = ['experience','education','skills','certifications','awards','projects'];

let state = {
  personal: { fullName:'', title:'', email:'', phone:'', location:'', summary:'', photo:'' },
  links: [],
  experience: [],
  education: [],
  certifications: [],
  awards: [],
  skills: [],
  projects: [],
  importText: '',
  template: 'classic',
  sectionOrder: [...DEFAULT_SECTION_ORDER],
  headingCase: 'title' // 'title' (Professional Summary) or 'upper' (PROFESSIONAL SUMMARY) — applies across every template
};
try{
  const savedTemplate = localStorage.getItem('resumeBuilderTemplate');
  if(savedTemplate) state.template = savedTemplate;
  const savedHeadingCase = localStorage.getItem('resumeBuilderHeadingCase');
  if(savedHeadingCase) state.headingCase = savedHeadingCase;
}catch(e){}

const TEMPLATES = [
  { id:'classic', name:'Classic', tagline:'Most popular · single column' },
  { id:'bold', name:'Bold Header', tagline:'Bold & modern' },
  { id:'minimal', name:'Minimal', tagline:'Safest for ATS' },
  { id:'sidebar', name:'Sidebar', tagline:'Two-column' },
  { id:'elegant', name:'Elegant', tagline:'Editorial serif accent' },
  { id:'timeline', name:'Timeline', tagline:'Visual career timeline' },
  { id:'compact', name:'Compact', tagline:'Fits more in less space' },
];

const LINK_TYPES = ['LinkedIn','GitHub','Portfolio','Twitter / X','Behance','Dribbble','Website','Other'];

/* ================= TABS =================
   Personal/Links are fixed — they aren't independent blocks in the resume
   output (Personal is the header, Links folds into its contact line), so
   they always lead the tab bar and can't be dragged. The rest map 1:1 to
   state.sectionOrder, so dragging a tab reorders the resume section too. */
const FIXED_TABS = [
  { key:'personal', label:'Personal' },
  { key:'links', label:'Links' },
];
const SECTION_TAB_DEFS = {
  experience: { key:'experience', label:'Experience' },
  education: { key:'education', label:'Education' },
  certifications: { key:'certifications', label:'Certifications' },
  awards: { key:'awards', label:'Awards' },
  skills: { key:'skills', label:'Skills' },
  projects: { key:'projects', label:'Projects' },
};
function getOrderedTabs(){
  return [...FIXED_TABS, ...state.sectionOrder.map(key => SECTION_TAB_DEFS[key])];
}
let activeTab = 'personal';

function tabHasContent(key){
  switch(key){
    case 'personal': return !!(state.personal.fullName || state.personal.title || state.personal.summary || state.personal.photo);
    case 'links': return state.links.some(l => l.url);
    case 'experience': return state.experience.length > 0;
    case 'education': return state.education.length > 0;
    case 'certifications': return state.certifications.length > 0;
    case 'awards': return state.awards.length > 0;
    case 'skills': return state.skills.some(c => c.items.length);
    case 'projects': return state.projects.length > 0;
    default: return false;
  }
}
function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = getOrderedTabs().map(t => {
    const reorderable = SECTION_TAB_DEFS.hasOwnProperty(t.key);
    const attrs = reorderable
      ? `data-section-key="${t.key}" onpointerdown="handleTabPointerDown(event,'${t.key}')"`
      : `onclick="setTab('${t.key}')"`;
    return `<button class="tab ${t.key===activeTab?'active':''}" ${attrs} title="${reorderable ? 'Drag to reorder this section in the resume' : ''}">${t.label}${tabHasContent(t.key) ? '<span class="tab-dot"></span>' : ''}</button>`;
  }).join('') + '<span class="tab-indicator" id="tabIndicator"></span>';
  positionTabIndicator();
}
function positionTabIndicator(){
  const tabs = document.getElementById('tabs');
  const indicator = document.getElementById('tabIndicator');
  const active = tabs.querySelector('.tab.active');
  if(!active || !indicator) return;
  indicator.style.width = (active.offsetWidth - 20) + 'px';
  indicator.style.transform = `translateX(${active.offsetLeft + 10}px)`;
}
window.addEventListener('resize', positionTabIndicator);
function setTab(key){
  activeTab = key;
  renderTabs();
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + key));
}

/* ================= PANEL RENDERERS ================= */
function renderPanels(){
  const el = document.getElementById('panels');
  el.innerHTML = `
    ${panelPersonal()}
    ${panelLinks()}
    ${panelExperience()}
    ${panelEducation()}
    ${panelCertifications()}
    ${panelAwards()}
    ${panelSkills()}
    ${panelProjects()}
  `;
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + activeTab));
}

function panelPersonal(){

        <div class="photo-upload-actions">
          <input type="file" accept="image/png,image/jpeg,image/webp" onchange="handlePhotoUpload(event)" />

        </div>

    </div>
    <div class="field"><label>Full name</label>

      </div>

/* Downscales to a max 480px edge and re-encodes as JPEG before storing —
   keeps the data URL (and the exported PDF/PNG that embeds it) reasonably
   sized regardless of how large the source photo was. */
const PHOTO_MAX_DIMENSION = 480;
function handlePhotoUpload(event){
  const input = event.target;
  const file = input.files && input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){
    showToast('Please choose an image file.', 'error');
    input.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, PHOTO_MAX_DIMENSION / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      state.personal.photo = canvas.toDataURL('image/jpeg', 0.86);
      renderPanels(); renderPreview();
    };
    img.onerror = () => showToast('Could not read that image — please try another file.', 'error');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}

/* ---------- Drag-and-drop reordering (Pointer Events, not HTML5 DnD) ----------
   The whole card is draggable — grab anywhere on it and drop it wherever it
   should go. One drag = one move, no matter how far, no repeated up/down
   clicking needed. Gestures that start on a form control (typing, selecting
   text, opening a dropdown, clicking Remove) are left alone so dragging the
   card doesn't fight with using it.

   This deliberately avoids native HTML5 `draggable`/dragstart/dragover: that
   API hands the drag image and event loop to the browser's own OS-level drag
   session, and programmatically scrolling the page (see auto-scroll below)
   while that session is active makes Chromium's drag-ghost compositor layer
   desync from the page repaint — the whole page visibly smears/doubles while
   scrolling mid-drag. Pointer Events keep everything — the drag, the
   highlight, the scroll — on the normal synchronous render path, so nothing
   can tear. There's no drag-ghost image at all; the dim/highlight styling
   below is the only visual feedback, same as before. */
// Finds the topmost element matching `selector` under (x,y), skipping past
// `excludeEl` (the element being dragged). Deliberately uses the plural
// elementsFromPoint() + manual skip rather than toggling pointer-events:none
// on the dragged element — Chromium fires a spurious pointercancel (killing
// the whole gesture) when pointer-events flips to none on an element that
// currently holds pointer capture, at least after a preceding auto-scroll
// interaction. This sidesteps that entirely.
function topmostMatchExcluding(x, y, selector, excludeEl){
  const stack = document.elementsFromPoint(x, y);
  for(const el of stack){
    const match = el.closest && el.closest(selector);
    if(match && match !== excludeEl) return match;
  }
  return null;
}
let cardDrag = null; // { listName, sourceId, sourceEl, pointerId, startX, startY, moved, overId }
function handleCardPointerDown(e, listName, id){
  if(e.button !== 0 && e.button !== undefined) return;
  if(e.target.closest('input, textarea, select, button, a')) return;
  // preventDefault here (not just once the drag threshold is crossed) opts
  // this pointer session out of the browser's own touch/scroll gesture
  // recognition. Skipping it has been observed to make Chromium fire a
  // spurious pointercancel — silently killing the whole drag — on this
  // element if the page was scrolled (auto-scroll included) shortly before.
  e.preventDefault();
  const el = e.currentTarget;
  cardDrag = { listName, sourceId:id, sourceEl:el, pointerId:e.pointerId, startX:e.clientX, startY:e.clientY, moved:false, overId:null };
  el.setPointerCapture(e.pointerId);
}
function handleCardPointerMove(e){
  if(!cardDrag || e.pointerId !== cardDrag.pointerId) return;
  const d = cardDrag;
  if(!d.moved){
    if(Math.abs(e.clientX - d.startX) < 4 && Math.abs(e.clientY - d.startY) < 4) return;
    d.moved = true;
    d.sourceEl.classList.add('dragging');
    startAutoScroll();
  }
  e.preventDefault();
  // Carry the card with the pointer (translate only — no layout reflow, so
  // this is as cheap as a plain paint) so it visibly feels picked up instead
  // of just dimming in place while a highlight jumps between other cards.
  d.sourceEl.style.transform = `translateY(${e.clientY - d.startY}px)`;
  pageScrollSpeed = edgeScrollSpeed(e.clientY, 0, window.innerHeight);
  document.querySelectorAll('.card.drag-over').forEach(el => el.classList.remove('drag-over'));
  const overCard = topmostMatchExcluding(e.clientX, e.clientY, '.card', d.sourceEl);
  if(overCard && overCard.dataset.cardList === d.listName){
    overCard.classList.add('drag-over');
    d.overId = overCard.dataset.cardId;
  } else {
    d.overId = null;
  }
}
function handleCardPointerUp(e){
  if(!cardDrag || e.pointerId !== cardDrag.pointerId) return;
  const d = cardDrag;
  if(d.sourceEl.hasPointerCapture(e.pointerId)) d.sourceEl.releasePointerCapture(e.pointerId);
  d.sourceEl.classList.remove('dragging');
  d.sourceEl.style.transform = '';
  document.querySelectorAll('.card.drag-over').forEach(el => el.classList.remove('drag-over'));
  stopAutoScroll();
  cardDrag = null;
  if(!d.moved || !d.overId || d.overId === d.sourceId) return;
  const list = state[d.listName];
  const fromIdx = list.findIndex(i => i.id === d.sourceId);
  const toIdx = list.findIndex(i => i.id === d.overId);
  if(fromIdx === -1 || toIdx === -1) return;
  const [item] = list.splice(fromIdx, 1);
  list.splice(toIdx, 0, item);
  renderPanels(); renderPreview();
}
document.addEventListener('pointermove', e => { if(cardDrag) handleCardPointerMove(e); else if(tabDrag) handleTabPointerMove(e); });
document.addEventListener('pointerup', e => { if(cardDrag) handleCardPointerUp(e); else if(tabDrag) handleTabPointerUp(e); });
document.addEventListener('pointercancel', e => { if(cardDrag) handleCardPointerUp(e); else if(tabDrag) handleTabPointerUp(e); });

/* ---------- Auto-scroll while dragging near a viewport/container edge ----------
   Dragging a card toward the bottom of a long list (say, reordering the 1st
   of several Experience entries to last) would otherwise strand the user
   off-screen with no way to keep going short of dropping and manually
   scrolling. The editor column has no independent scroll region of its own
   — it's a flex child sized by `min-height`, so a tall form just grows the
   whole document — so a card drag scrolls the page itself (window), keyed
   off distance from the viewport's top/bottom edge. A dragged tab instead
   scrolls the tab bar's own horizontal overflow. A single rAF loop drives
   both, at a speed that ramps up the closer the pointer gets to the edge. */
const AUTOSCROLL_EDGE = 100;
const AUTOSCROLL_MAX_SPEED = 30; // px per 16.67ms frame, at the very edge
let pageScrollSpeed = 0;
let tabsScrollSpeed = 0;
let autoScrollRAF = null;
let autoScrollLastTs = null;
// Eased (quadratic) ramp instead of linear: a gentle pull just inside the
// edge zone that only reaches full speed right at the boundary, so scrolling
// starts and stops gradually instead of snapping to a speed. No rounding —
// window.scrollBy happily takes fractional px, which reads as smoother
// motion at low speeds than integer-stepping does.
function edgeScrollSpeed(pos, start, end){
  if(pos < start + AUTOSCROLL_EDGE){
    const strength = Math.min(1, (start + AUTOSCROLL_EDGE - pos) / AUTOSCROLL_EDGE);
    return -(strength * strength) * AUTOSCROLL_MAX_SPEED;
  }
  if(pos > end - AUTOSCROLL_EDGE){
    const strength = Math.min(1, (pos - (end - AUTOSCROLL_EDGE)) / AUTOSCROLL_EDGE);
    return (strength * strength) * AUTOSCROLL_MAX_SPEED;
  }
  return 0;
}
function autoScrollTick(ts){
  // Scale by actual elapsed time so scroll speed stays consistent across
  // displays/refresh rates instead of a fixed px-per-frame amount running
  // faster on a 120/144Hz screen than on 60Hz.
  const dtScale = autoScrollLastTs ? Math.min(3, (ts - autoScrollLastTs) / 16.67) : 1;
  autoScrollLastTs = ts;
  // Stop calling scrollBy once already sitting at the boundary in that
  // direction. Besides being pointless, holding the pointer near an edge
  // that's already maxed out means every frame issues a no-op scrollBy for
  // as long as the hold lasts — and Chromium has been observed to fire a
  // spurious pointercancel (silently killing the drag) on the *next*,
  // unrelated pointer-captured gesture after a long enough run of that.
  if(pageScrollSpeed){
    const atTop = pageScrollSpeed < 0 && window.scrollY <= 0;
    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    const atBottom = pageScrollSpeed > 0 && window.scrollY >= maxScroll;
    if(!atTop && !atBottom) window.scrollBy(0, pageScrollSpeed * dtScale);
  }
  if(tabsScrollSpeed){
    const tabs = document.getElementById('tabs');
    if(tabs){
      const atStart = tabsScrollSpeed < 0 && tabs.scrollLeft <= 0;
      const atEnd = tabsScrollSpeed > 0 && tabs.scrollLeft >= tabs.scrollWidth - tabs.clientWidth;
      if(!atStart && !atEnd) tabs.scrollLeft += tabsScrollSpeed * dtScale;
    }
  }
  autoScrollRAF = requestAnimationFrame(autoScrollTick);
}
function startAutoScroll(){
  if(!autoScrollRAF){ autoScrollLastTs = null; autoScrollRAF = requestAnimationFrame(autoScrollTick); }
}
function stopAutoScroll(){
  if(autoScrollRAF){ cancelAnimationFrame(autoScrollRAF); autoScrollRAF = null; }
  pageScrollSpeed = 0;
  tabsScrollSpeed = 0;
}

/* ---------- Drag-and-drop reordering of resume sections (tabs) ----------
   Mirrors the card reordering above (same Pointer Events approach, same
   reason), but for the tabs themselves: dragging a section tab rewrites
   state.sectionOrder, which renderPreview() (and the sidebar template's
   aside/main split) reads directly, so the resume's section order follows
   the drag instead of a fixed layout. A tap with no movement still switches
   tabs, same as a plain click did before. */
let tabDrag = null; // { key, tabEl, pointerId, startX, startY, moved, overKey }
function handleTabPointerDown(e, key){
  if(e.button !== 0 && e.button !== undefined) return;
  e.preventDefault(); // see the matching comment in handleCardPointerDown
  const el = e.currentTarget;
  tabDrag = { key, tabEl:el, pointerId:e.pointerId, startX:e.clientX, startY:e.clientY, moved:false, overKey:null };
  el.setPointerCapture(e.pointerId);
}
function handleTabPointerMove(e){
  if(!tabDrag || e.pointerId !== tabDrag.pointerId) return;
  const d = tabDrag;
  if(!d.moved){
    if(Math.abs(e.clientX - d.startX) < 4 && Math.abs(e.clientY - d.startY) < 4) return;
    d.moved = true;
    d.tabEl.classList.add('dragging');
    startAutoScroll();
  }
  e.preventDefault();
  d.tabEl.style.transform = `translate(${e.clientX - d.startX}px, ${e.clientY - d.startY}px)`;
  const tabs = document.getElementById('tabs');
  const r = tabs && tabs.getBoundingClientRect();
  tabsScrollSpeed = r ? edgeScrollSpeed(e.clientX, r.left, r.right) : 0;
  document.querySelectorAll('.tab.drag-over').forEach(el => el.classList.remove('drag-over'));
  const overTab = topmostMatchExcluding(e.clientX, e.clientY, '.tab[data-section-key]', d.tabEl);
  if(overTab){
    overTab.classList.add('drag-over');
    d.overKey = overTab.dataset.sectionKey;
  } else {
    d.overKey = null;
  }
}
function handleTabPointerUp(e){
  if(!tabDrag || e.pointerId !== tabDrag.pointerId) return;
  const d = tabDrag;
  if(d.tabEl.hasPointerCapture(e.pointerId)) d.tabEl.releasePointerCapture(e.pointerId);
  d.tabEl.classList.remove('dragging');
  d.tabEl.style.transform = '';
  document.querySelectorAll('.tab.drag-over').forEach(el => el.classList.remove('drag-over'));
  stopAutoScroll();
  tabDrag = null;
  if(!d.moved){ setTab(d.key); return; }
  if(!d.overKey || d.overKey === d.key) return;
  const order = state.sectionOrder;
  const fromIdx = order.indexOf(d.key);
  const toIdx = order.indexOf(d.overKey);
  if(fromIdx === -1 || toIdx === -1) return;
  const [moved] = order.splice(fromIdx, 1);
  order.splice(toIdx, 0, moved);
  renderTabs(); renderPreview();
}
